version: "3.8"

services:
  # PostgreSQL Database for Auth Service Testing
  postgres-auth-test:
    image: postgres:15-alpine
    container_name: gripday-postgres-auth-test
    environment:
      POSTGRES_DB: gripday_auth_test
      POSTGRES_USER: gripday_test_user
      POSTGRES_PASSWORD: gripday_test_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_auth_test_data:/var/lib/postgresql/data
      - ../docker/postgres/init-auth.sql:/docker-entrypoint-initdb.d/init-auth.sql
    networks:
      - gripday-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gripday_test_user -d gripday_auth_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    tmpfs:
      - /var/lib/postgresql/data:noexec,nosuid,size=100m

  # PostgreSQL Database for Bookstore Service Testing
  postgres-bookstore-test:
    image: postgres:15-alpine
    container_name: gripday-postgres-bookstore-test
    environment:
      POSTGRES_DB: gripday_bookstore_test
      POSTGRES_USER: gripday_test_user
      POSTGRES_PASSWORD: gripday_test_password
    ports:
      - "5435:5432"
    volumes:
      - postgres_bookstore_test_data:/var/lib/postgresql/data
      - ../docker/postgres/init-bookstore.sql:/docker-entrypoint-initdb.d/init-bookstore.sql
    networks:
      - gripday-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gripday_test_user -d gripday_bookstore_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    tmpfs:
      - /var/lib/postgresql/data:noexec,nosuid,size=100m

  # Redis for Testing - Caching and Sessions
  redis-test:
    image: redis:7-alpine
    container_name: gripday-redis-test
    ports:
      - "6380:6379"
    networks:
      - gripday-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    command: redis-server --appendonly no --save ""
    tmpfs:
      - /data:noexec,nosuid,size=50m

  # Auth Service for Testing
  auth-service-test:
    build:
      context: ..
      dockerfile: gripday-auth-service/Dockerfile
    container_name: gripday-auth-service-test
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth-test:5432/gripday_auth_test
      SPRING_DATASOURCE_USERNAME: gripday_test_user
      SPRING_DATASOURCE_PASSWORD: gripday_test_password
      SPRING_DATA_REDIS_HOST: redis-test
      SPRING_DATA_REDIS_PORT: 6379
      GRIPDAY_AUTH_JWT_SECRET: test-256-bit-secret-key-for-testing-only-not-production
      GRIPDAY_AUTH_JWT_EXPIRATION: 900
      GRIPDAY_AUTH_JWT_REFRESH_EXPIRATION: 604800
      LOGGING_LEVEL_ORG_GRIPDAY: DEBUG
      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "8091:8081"
    depends_on:
      postgres-auth-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - gripday-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    restart: "no"

  # Bookstore Service for Testing
  bookstore-service-test:
    build:
      context: ..
      dockerfile: gripday-bookstore-service/Dockerfile
    container_name: gripday-bookstore-service-test
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-bookstore-test:5432/gripday_bookstore_test
      SPRING_DATASOURCE_USERNAME: gripday_test_user
      SPRING_DATASOURCE_PASSWORD: gripday_test_password
      SPRING_DATA_REDIS_HOST: redis-test
      SPRING_DATA_REDIS_PORT: 6379
      JWT_ISSUER_URI: http://gateway-service-test:8080/auth/realms/gripday
      LOGGING_LEVEL_ORG_GRIPDAY: DEBUG
      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "8092:8082"
    depends_on:
      postgres-bookstore-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - gripday-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    restart: "no"

  # Gateway Service for Testing
  gateway-service-test:
    build:
      context: ..
      dockerfile: gripday-gateway-service/Dockerfile
    container_name: gripday-gateway-service-test
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATA_REDIS_HOST: redis-test
      SPRING_DATA_REDIS_PORT: 6379
      GRIPDAY_GATEWAY_AUTH_SERVICE_URL: http://auth-service-test:8081
      GRIPDAY_GATEWAY_BOOKSTORE_SERVICE_URL: http://bookstore-service-test:8082
      GRIPDAY_GATEWAY_RATE_LIMITING_ENABLED: true
      GRIPDAY_GATEWAY_RATE_LIMITING_REQUESTS_PER_MINUTE: 1000
      LOGGING_LEVEL_ORG_GRIPDAY: DEBUG
      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "8090:8080"
    depends_on:
      auth-service-test:
        condition: service_healthy
      bookstore-service-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - gripday-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: "no"

networks:
  gripday-test-network:
    driver: bridge
    name: gripday-test-network

volumes:
  postgres_auth_test_data:
    name: gripday_postgres_auth_test_data
  postgres_bookstore_test_data:
    name: gripday_postgres_bookstore_test_data
