version: "3.8"

services:
  # PostgreSQL Database for IAM Service Testing
  postgres-iam-test:
    image: postgres:15-alpine
    container_name: foundation-postgres-iam-test
    environment:
      POSTGRES_DB: foundation_iam_test
      POSTGRES_USER: foundation_test_user
      POSTGRES_PASSWORD: foundation_test_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_auth_test_data:/var/lib/postgresql/data
      - ../docker/postgres/init-user.sql:/docker-entrypoint-initdb.d/init-user.sql
    networks:
      - foundation-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation_test_user -d foundation_iam_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    tmpfs:
      - /var/lib/postgresql/data:noexec,nosuid,size=100m

  # Redis for Testing - Caching and Sessions
  redis-test:
    image: redis:7-alpine
    container_name: foundation-redis-test
    ports:
      - "6380:6379"
    networks:
      - foundation-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    command: redis-server --appendonly no --save ""
    tmpfs:
      - /data:noexec,nosuid,size=50m

  # User Service for Testing
  iam-service-test:
    build:
      context: ..
      dockerfile: foundation-iam-service/Dockerfile
    container_name: foundation-iam-service-test
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-iam-test:5432/foundation_iam_test
      SPRING_DATASOURCE_USERNAME: foundation_test_user
      SPRING_DATASOURCE_PASSWORD: foundation_test_password
      SPRING_DATA_REDIS_HOST: redis-test
      SPRING_DATA_REDIS_PORT: 6379
      IQKV_AUTH_JWT_SECRET: test-256-bit-secret-key-for-testing-only-not-production
      IQKV_AUTH_JWT_EXPIRATION: 900
      IQKV_AUTH_JWT_REFRESH_EXPIRATION: 604800
      LOGGING_LEVEL_ORG_FOUNDATION: DEBUG
      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "8091:8080"
    depends_on:
      postgres-iam-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - foundation-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    restart: "no"

  # Gateway Service for Testing
  gateway-service-test:
    build:
      context: ..
      dockerfile: foundation-gateway-service/Dockerfile
    container_name: foundation-gateway-service-test
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATA_REDIS_HOST: redis-test
      SPRING_DATA_REDIS_PORT: 6379
      IQKV_GATEWAY_USER_SERVICE_URL: http://iam-service-test:8080
      IQKV_GATEWAY_RATE_LIMITING_ENABLED: true
      IQKV_GATEWAY_RATE_LIMITING_REQUESTS_PER_MINUTE: 1000
      LOGGING_LEVEL_ORG_FOUNDATION: DEBUG
      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "8090:8080"
    depends_on:
      iam-service-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - foundation-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: "no"

networks:
  foundation-test-network:
    driver: bridge
    name: foundation-test-network

volumes:
  postgres_auth_test_data:
    name: foundation_postgres_auth_test_data
  redis_data:
    name: foundation_redis_data
