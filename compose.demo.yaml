# =============================================================================
# Foundation Platform — All-in-One Demo Stack
# =============================================================================
# This configuration is designed for demonstration and quick-start purposes.
# It runs the entire microservices platform, including:
# - Reverse Proxy (Nginx) for single-port entry (80)
# - User Interfaces (Admin and App)
# - Backend Services (IAM, Billing, Gateway)
# - Infrastructure (Postgres, Redis, RabbitMQ, MailHog, MinIO)
# - Database Administration (DbGate)
# - Observability (Prometheus, Grafana, Loki, Promtail)
#
# Key Architectural Principles:
# 1. Standardized Naming: All services use 'foundation-' prefix.
# 2. Network Isolation: All services run on the 'foundation-network'.
# 3. Proxy-Only Exposure: Only Nginx exposes port 80 to the host.
# 4. Host-Based Routing: Requires local domains (api.iqkv.local, etc.) in hosts file.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Reverse Proxy (The Entry Point)
  # Acts as the gateway for all HTTP traffic, routing by Hostname and Path.
  # ---------------------------------------------------------------------------
  foundation-nginx:
    image: nginx:latest
    container_name: foundation-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - foundation-network
    depends_on:
      - foundation-gateway-service
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Databases (Persistent Storage)
  # ---------------------------------------------------------------------------
  foundation-postgres-iam:
    image: postgres:17-alpine
    container_name: foundation-postgres-iam
    environment:
      POSTGRES_DB: ${IAM_DB_NAME:-iam}
      POSTGRES_USER: ${IAM_DB_USERNAME:-svc_iam_dba}
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:-svc_iam_dba}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - foundation_postgres_iam_data:/var/lib/postgresql/data
      - ./docker/postgres/init-iam.sql:/docker-entrypoint-initdb.d/init-iam.sql:ro
    networks:
      - foundation-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IAM_DB_USERNAME:-svc_iam_dba} -d ${IAM_DB_NAME:-iam}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  foundation-postgres-billing:
    image: postgres:17-alpine
    container_name: foundation-postgres-billing
    environment:
      POSTGRES_DB: ${BILLING_DB_NAME:-billing}
      POSTGRES_USER: ${BILLING_DB_USERNAME:-svc_billing_dba}
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD:-svc_billing_dba}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - foundation_postgres_billing_data:/var/lib/postgresql/data
      - ./docker/postgres/init-billing.sql:/docker-entrypoint-initdb.d/init-billing.sql:ro
    networks:
      - foundation-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BILLING_DB_USERNAME:-svc_billing_dba} -d ${BILLING_DB_NAME:-billing}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  foundation-postgres-audit:
    image: postgres:17-alpine
    container_name: foundation-postgres-audit
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME:-audit}
      POSTGRES_USER: ${AUDIT_DB_USERNAME:-svc_audit_dba}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-svc_audit_dba}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - foundation_postgres_audit_data:/var/lib/postgresql/data
      - ./docker/postgres/init-audit.sql:/docker-entrypoint-initdb.d/init-audit.sql:ro
    networks:
      - foundation-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDIT_DB_USERNAME:-svc_audit_dba} -d ${AUDIT_DB_NAME:-audit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # ---------------------------------------------------------------------------
  # Cache (State Management)
  # ---------------------------------------------------------------------------
  foundation-redis:
    image: redis:7-alpine
    container_name: foundation-redis
    expose:
      - "6379"
    volumes:
      - foundation_redis_data:/data
    networks:
      - foundation-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: redis-server --appendonly yes
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Messaging (Event-Driven Communication)
  # ---------------------------------------------------------------------------
  foundation-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: foundation-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-svc_platform_rmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-svc_platform_rmq}
      RABBITMQ_DEFAULT_VHOST: /
    expose:
      - "5672"
      - "15672"
    volumes:
      - foundation_rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - foundation-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mail (Local Development Testing)
  # ---------------------------------------------------------------------------
  foundation-mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: foundation-mailhog
    expose:
      - "1025"
      - "8025"
    networks:
      - foundation-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Object Storage (S3-Compatible Storage)
  # MinIO provides S3-compatible object storage for file uploads, avatars,
  # document storage, and other binary assets across all services.
  # ---------------------------------------------------------------------------
  foundation-minio:
    image: minio/minio:latest
    container_name: foundation-minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-iqkv}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-iqkv_password}
    expose:
      - "9000" # S3 API
      - "9001" # Console UI
    volumes:
      - foundation_minio_data:/data
    networks:
      - foundation-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Database Administration (DbGate)
  # Web-based database administration tool providing unified access to:
  # - PostgreSQL databases (IAM, Billing, Audit)
  # - Redis cache
  # - RabbitMQ management
  # - MinIO S3 storage
  # ---------------------------------------------------------------------------
  foundation-dbgate:
    image: dbgate/dbgate:5.3.3
    container_name: foundation-dbgate
    environment:
      WEB_ROOT: /
      LOGINS: "1"
    expose:
      - "3000"
    volumes:
      - ./docker/dbgate/connections.jsonl:/root/.dbgate/connections.jsonl:ro
      - foundation_dbgate_data:/root/.dbgate
    networks:
      - foundation-network
    depends_on:
      foundation-postgres-iam:
        condition: service_healthy
      foundation-postgres-billing:
        condition: service_healthy
      foundation-postgres-audit:
        condition: service_healthy
      foundation-redis:
        condition: service_healthy
      foundation-rabbitmq:
        condition: service_healthy
      foundation-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # IAM Service (Identity & Access Management)
  # Internal service providing Authentication and Authorization.
  # ---------------------------------------------------------------------------
  foundation-iam-service:
    image: know-how.download/iqkv/foundation-iam-service:wip
    container_name: foundation-iam-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}

      # Database
      DB_HOST: foundation-postgres-iam
      DB_PORT: 5432
      DB_NAME: ${IAM_DB_NAME:-iam}
      DB_USERNAME: ${IAM_DB_USERNAME:-svc_iam_dba}
      DB_PASSWORD: ${IAM_DB_PASSWORD:-svc_iam_dba}

      # RabbitMQ
      RABBITMQ_HOST: foundation-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-svc_platform_rmq}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-svc_platform_rmq}

      # Mail (MailHog)
      MAIL_HOST: foundation-mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: ${MAIL_FROM:-noreply@iqkv.dev}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}

      # Billing service — routing target
      BILLING_SERVICE_URI: http://foundation-billing-service:8080

      # Object Storage (MinIO)
      OBJECTSTORAGE_ENDPOINT: http://foundation-minio:9000
      OBJECTSTORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-iqkv}
      OBJECTSTORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-iqkv_password}
      OBJECTSTORAGE_BUCKET_NAME: ${IAM_BUCKET_NAME:-iam-assets}
      OBJECTSTORAGE_REGION: ${MINIO_REGION:-us-east-1}
      OBJECTSTORAGE_SSL: "false"

      # JWT RS256
      JWT_PRIVATE_KEY_PATH: classpath:keys/private.pem
      JWT_PUBLIC_KEY_PATH: classpath:keys/public.pem
      JWT_ISSUER: foundation-iam-service

      # Application
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:80}

      # Multi-tenancy
      ROLLOUT_MODE: ${ROLLOUT_MODE:-MULTI_TENANT}
      DEFAULT_TENANT_KEY: ${DEFAULT_TENANT_KEY:-}
      DEFAULT_TENANT_NAME: ${DEFAULT_TENANT_NAME:-Default Organization}

      # Observability
      OTEL_SERVICE_NAME: foundation-iam-service
      OTEL_RESOURCE_ATTRIBUTES: service.name=foundation-iam-service,deployment.environment=${SPRING_PROFILES_ACTIVE:-local}
    expose:
      - "8080" # Application API
      - "8081" # Management / Actuator
    depends_on:
      foundation-postgres-iam:
        condition: service_healthy
      foundation-rabbitmq:
        condition: service_healthy
      foundation-minio:
        condition: service_healthy
      foundation-mailhog:
        condition: service_started
    networks:
      - foundation-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    volumes:
      - foundation_iam_logs:/app/logs
      - foundation_iam_tmp:/app/tmp
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Billing Service (Payments & Subscriptions)
  # Internal service handling Stripe integration and financial workflows.
  # ---------------------------------------------------------------------------
  foundation-billing-service:
    image: know-how.download/iqkv/foundation-billing-service:wip
    container_name: foundation-billing-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}

      # Database
      DB_HOST: foundation-postgres-billing
      DB_PORT: 5432
      DB_NAME: ${BILLING_DB_NAME:-billing}
      DB_USERNAME: ${BILLING_DB_USERNAME:-svc_billing_dba}
      DB_PASSWORD: ${BILLING_DB_PASSWORD:-svc_billing_dba}

      # RabbitMQ
      RABBITMQ_HOST: foundation-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-svc_platform_rmq}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-svc_platform_rmq}
      MESSAGING_ENABLED: ${MESSAGING_ENABLED:-true}

      # Mail (MailHog)
      MAIL_HOST: foundation-mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: ${MAIL_FROM:-noreply@iqkv.dev}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-IQ Key Value}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}

      # Object Storage (MinIO)
      OBJECTSTORAGE_ENDPOINT: http://foundation-minio:9000
      OBJECTSTORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-iqkv}
      OBJECTSTORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-iqkv_password}
      OBJECTSTORAGE_BUCKET_NAME: ${BILLING_BUCKET_NAME:-billing-assets}
      OBJECTSTORAGE_REGION: ${MINIO_REGION:-us-east-1}
      OBJECTSTORAGE_SSL: "false"

      # JWT RS256 (OAuth2 Resource Server — validates tokens from IAM)
      JWT_PUBLIC_KEY_PATH: classpath:keys/public.pem

      # Application
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:80}

      # Multi-tenancy
      ROLLOUT_MODE: ${ROLLOUT_MODE:-MULTI_TENANT}
      DEFAULT_BILLING_EMAIL: ${DEFAULT_BILLING_EMAIL:-}

      # Stripe (placeholders — override via .env)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL:-http://localhost:80/billing}

      # Observability
      OTEL_SERVICE_NAME: foundation-billing-service
      OTEL_RESOURCE_ATTRIBUTES: service.name=foundation-billing-service,deployment.environment=${SPRING_PROFILES_ACTIVE:-local}
    expose:
      - "8080"
      - "8081"
    depends_on:
      foundation-postgres-billing:
        condition: service_healthy
      foundation-rabbitmq:
        condition: service_healthy
      foundation-iam-service:
        condition: service_healthy
      foundation-minio:
        condition: service_healthy
      foundation-mailhog:
        condition: service_started
    networks:
      - foundation-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    volumes:
      - foundation_billing_logs:/app/logs
      - foundation_billing_tmp:/app/tmp
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Audit Service (Activity Tracking & Compliance)
  # Internal service for logging and querying system-wide audit trails.
  # ---------------------------------------------------------------------------
  foundation-audit-service:
    image: know-how.download/iqkv/foundation-audit-service:wip
    container_name: foundation-audit-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}

      # Database
      DB_HOST: foundation-postgres-audit
      DB_PORT: 5432
      DB_NAME: ${AUDIT_DB_NAME:-audit}
      DB_USERNAME: ${AUDIT_DB_USERNAME:-svc_audit_dba}
      DB_PASSWORD: ${AUDIT_DB_PASSWORD:-svc_audit_dba}

      # RabbitMQ
      RABBITMQ_HOST: foundation-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-svc_platform_rmq}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-svc_platform_rmq}

      # JWT RS256 (OAuth2 Resource Server — validates tokens from IAM)
      JWT_PUBLIC_KEY_PATH: classpath:keys/public.pem

      # Observability
      OTEL_SERVICE_NAME: foundation-audit-service
      OTEL_RESOURCE_ATTRIBUTES: service.name=foundation-audit-service,deployment.environment=${SPRING_PROFILES_ACTIVE:-local}
    expose:
      - "8080"
      - "8081"
    depends_on:
      foundation-postgres-audit:
        condition: service_healthy
      foundation-rabbitmq:
        condition: service_healthy
      foundation-iam-service:
        condition: service_healthy
    networks:
      foundation-network:
        aliases:
          - audit-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    volumes:
      - foundation_audit_logs:/app/logs
      - foundation_audit_tmp:/app/tmp
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Gateway Service (API Gateway)
  # The unified entry point for all API requests, providing routing and security.
  # ---------------------------------------------------------------------------
  foundation-gateway-service:
    image: know-how.download/iqkv/foundation-gateway-service:wip
    container_name: foundation-gateway-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}

      # IAM service — routing target and JWKS endpoint for JWT validation
      IAM_SERVICE_URI: http://foundation-iam-service:8080
      IAM_JWKS_URI: http://foundation-iam-service:8080/.well-known/jwks.json

      # IAM service URL — used by PlatformModeGuardFilter to verify rollout mode consistency
      IQKV_IAM_SERVICE_URL: http://foundation-iam-service:8081

      # Billing service — routing target
      BILLING_SERVICE_URI: http://foundation-billing-service:8080

      # Audit service — routing target
      AUDIT_SERVICE_URI: http://foundation-audit-service:8080

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

      # Server ports (defaults match Dockerfile EXPOSE)
      SERVER_PORT: 8080
      MANAGEMENT_PORT: 8081

      # Multi-tenancy
      ROLLOUT_MODE: ${ROLLOUT_MODE:-MULTI_TENANT}
      DEFAULT_TENANT_KEY: ${DEFAULT_TENANT_KEY:-}

      # Observability
      OTEL_SERVICE_NAME: foundation-gateway-service
      OTEL_RESOURCE_ATTRIBUTES: service.name=foundation-gateway-service,deployment.environment=${SPRING_PROFILES_ACTIVE:-local}
    expose:
      - "8080" # Gateway API
      - "8081" # Management / Actuator
    depends_on:
      foundation-iam-service:
        condition: service_healthy
      foundation-billing-service:
        condition: service_healthy
      foundation-audit-service:
        condition: service_healthy
    networks:
      - foundation-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - foundation_gateway_logs:/app/logs
      - foundation_gateway_tmp:/app/tmp
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # User Interfaces (Frontends)
  # ---------------------------------------------------------------------------
  foundation-ui-platform-admin:
    image: know-how.download/iqkv/foundation-ui-platform-admin:wip
    container_name: foundation-ui-platform-admin
    expose:
      - "8080"
    networks:
      - foundation-network
    restart: unless-stopped

  foundation-ui-app:
    image: know-how.download/iqkv/foundation-ui-app:wip
    container_name: foundation-ui-app
    expose:
      - "8080"
    networks:
      - foundation-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Observability Stack (Monitoring & Logging)
  # ---------------------------------------------------------------------------
  foundation-prometheus:
    image: prom/prometheus:v2.54.1
    container_name: foundation-prometheus
    expose:
      - "9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - foundation_prometheus_data:/prometheus
    networks:
      - foundation-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
      - "--web.external-url=http://localhost/services/prometheus/"
      - "--web.route-prefix=/prometheus/"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  foundation-grafana:
    image: grafana/grafana:11.3.0
    container_name: foundation-grafana
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost/services/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - foundation_grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - foundation-network
    depends_on:
      foundation-prometheus:
        condition: service_healthy
      foundation-loki:
        condition: service_healthy
    restart: unless-stopped

  foundation-loki:
    image: grafana/loki:3.2.0
    container_name: foundation-loki
    expose:
      - "3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - foundation_loki_data:/loki
    networks:
      foundation-network:
        aliases:
          - loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  foundation-promtail:
    image: grafana/promtail:3.2.0
    container_name: foundation-promtail
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - foundation-network
    depends_on:
      foundation-loki:
        condition: service_healthy
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

networks:
  foundation-network:
    driver: overlay
    external: true
    name: foundation-network

