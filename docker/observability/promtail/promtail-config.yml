server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # Gripday User Service logs
  - job_name: gripday-user-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: gripday-user-service
          service: auth
          __path__: /var/log/gripday/user-service/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            logger: logger
            correlationId: correlationId
            traceId: traceId
            spanId: spanId
            userId: userId
            tenantId: tenantId
      - timestamp:
          format: RFC3339
          source: timestamp
      - labels:
          level:
          logger:
          correlationId:
          traceId:
          spanId:
          userId:
          tenantId:

  # Gripday Gateway Service logs
  - job_name: gripday-gateway-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: gripday-gateway-service
          service: gateway
          __path__: /var/log/gripday/gateway-service/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            logger: logger
            correlationId: correlationId
            traceId: traceId
            spanId: spanId
            userId: userId
            tenantId: tenantId
      - timestamp:
          format: RFC3339
          source: timestamp
      - labels:
          level:
          logger:
          correlationId:
          traceId:
          spanId:
          userId:
          tenantId:
