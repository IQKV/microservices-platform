global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
# - "alert_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # IAM Service — actuator on 8081, API on 8080
  - job_name: "iam-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ["host.docker.internal:8081"]

  # Billing Service — actuator on 8083, API on 8082
  - job_name: "billing-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ["host.docker.internal:8083"]

  # Audit Service — actuator on 8085, API on 8084
  - job_name: "audit-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ["host.docker.internal:8085"]

  # CMS Service — actuator on 8087, API on 8086
  - job_name: "cms-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ["host.docker.internal:8087"]

  # Gateway Service — actuator on 8089, API on 8088
  - job_name: "gateway-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ["host.docker.internal:8089"]

  # Docker daemon metrics (requires daemon metrics enabled: "metrics-addr": "0.0.0.0:9323")
  - job_name: "docker"
    static_configs:
      - targets: ["host.docker.internal:9323"]

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093
