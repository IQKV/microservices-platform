# =============================================================================
# Foundation Platform Nginx Reverse Proxy Configuration
# =============================================================================
# Purpose:
# 1. Acts as a single entry point (Port 80) for the entire platform.
# 2. Implements Virtual Hosting (Host-based routing) for UIs and API.
# 3. Implements Path-based routing for monitoring and infrastructure services.
# 4. Standardizes headers for backend services (CORS, Client IP, etc.).
# =============================================================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # Virtual Host: Platform Admin UI (admin.iqkv.local)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name admin.iqkv.local;

        location / {
            proxy_pass http://foundation-ui-platform-admin:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # -------------------------------------------------------------------------
    # Virtual Host: Application UI (app.iqkv.local)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name app.iqkv.local;

        location / {
            proxy_pass http://foundation-ui-app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # -------------------------------------------------------------------------
    # Main Virtual Host: Gateway API and Shared Services
    # Handles: api.iqkv.local, foundation-gateway-service.local, localhost
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost foundation-gateway-service.local api.iqkv.local;

        # Path-based routing for infrastructure services
        # Note: Trailing slashes in proxy_pass strip the URI prefix (e.g., /services/rabbitmq/ -> /)

        # DbGate - Database Administration Tool
        location /services/dbgate/ {
            proxy_pass http://foundation-dbgate:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # RabbitMQ Management Console
        location /services/rabbitmq/ {
            proxy_pass http://foundation-rabbitmq:15672/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MailHog Web UI (includes WebSocket support for real-time updates)
        location /services/mailhog/ {
            proxy_pass http://foundation-mailhog:8025/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Prometheus UI (requires matching --web.external-url in compose)
        location /services/prometheus/ {
            proxy_pass http://foundation-prometheus:9090/prometheus/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana Dashboards (requires matching GF_SERVER_ROOT_URL in compose)
        location /services/grafana/ {
            proxy_pass http://foundation-grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Loki API
        location /services/loki/ {
            proxy_pass http://foundation-loki:3100/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default: Gateway Service (Entry point for all REST API traffic)
        location / {
            proxy_pass http://foundation-gateway-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
