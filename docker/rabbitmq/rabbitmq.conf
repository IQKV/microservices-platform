# RabbitMQ Configuration for IQ Key Value Development

# Logging
log.console = true
log.console.level = info
log.file.level = info

# Management Plugin
management.tcp.port = 15672
management.load_definitions = /etc/rabbitmq/definitions.json

# Default User
default_vhost = /
# Note: default_user and default_pass are set via environment variables 
# in compose.yaml (RABBITMQ_DEFAULT_USER, RABBITMQ_DEFAULT_PASS)

# Permissions
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Memory and Disk Limits
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 2GB

# Heartbeat
heartbeat = 60

# Connection Settings
channel_max = 2047
