global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # IAM Service — management port 8081 exposes /actuator/prometheus
  - job_name: "iam-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["iam-service:8081"]
    scrape_interval: 10s
    scrape_timeout: 5s

  # Billing Service — management port 8081
  - job_name: "billing-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["billing-service:8081"]
    scrape_interval: 10s
    scrape_timeout: 5s

  # Gateway Service — management port 8081
  - job_name: "gateway-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["gateway-service:8081"]
    scrape_interval: 10s
    scrape_timeout: 5s
