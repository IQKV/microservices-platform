server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs (JSON log driver)
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # IAM Service structured logs (volume-mounted at /app/logs)
  - job_name: iam-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: iam-service
          service: iam-service
          __path__: /var/log/iam-service/*.log

  # Billing Service structured logs
  - job_name: billing-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: billing-service
          service: billing-service
          __path__: /var/log/billing-service/*.log

  # Gateway Service structured logs
  - job_name: gateway-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: gateway-service
          service: gateway-service
          __path__: /var/log/gateway-service/*.log
