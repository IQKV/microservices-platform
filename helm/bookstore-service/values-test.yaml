# Test environment values for bookstore-service

global:
  environment: test
  platform: gripday

namespace:
  name: gripday-test-env
  labels:
    app.kubernetes.io/component: bookstore
    environment: test

replicaCount: 2

image:
  repository: gripday/bookstore-service
  pullPolicy: Always
  tag: "test-latest"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"
  environment: "test"

priorityClassName: medium-priority

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://test.gripday.site, https://*.test.gripday.site"
  hosts:
    - host: bookstore-test.gripday.site
      paths:
        - path: /
          pathType: Prefix
        - path: /api
          pathType: Prefix
        - path: /actuator
          pathType: Prefix
        - path: /swagger-ui
          pathType: Prefix
        - path: /api-docs
          pathType: Prefix
  tls:
    - secretName: bookstore-test-tls
      hosts:
        - bookstore-test.gripday.site

resources:
  requests:
    memory: "512Mi"
    cpu: "300m"
  limits:
    memory: "1Gi"
    cpu: "750m"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "test"
  - name: GRIPDAY_DATABASE_URL
    value: "jdbc:postgresql://bookstore-postgres:5432/gripday_bookstore_test"
  - name: GRIPDAY_CACHE_REDIS_HOST
    value: "bookstore-redis"
  - name: GRIPDAY_CACHE_REDIS_PORT
    value: "6379"
  - name: GRIPDAY_CACHE_REDIS_DATABASE
    value: "2"
  - name: JWT_ISSUER_URI
    value: "http://user-service:8080"
  - name: JWT_JWK_SET_URI
    value: "http://user-service:8080/.well-known/jwks.json"
  - name: CORS_ALLOWED_ORIGINS
    value: "https://test.gripday.site,https://*.test.gripday.site"
  - name: REDIS_HOST
    value: "bookstore-redis"
  - name: REDIS_PORT
    value: "6379"
  - name: GRIPDAY_OBSERVABILITY_TRACING_ENDPOINT
    value: "http://jaeger-collector.observability:14268/api/traces"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.observability:4317"
  - name: OTEL_SERVICE_NAME
    value: "gripday-bookstore-service"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "service.name=gripday-bookstore-service,service.version=test,deployment.environment=test"
  - name: JAVA_OPTS
    value: "-Xms384m -Xmx768m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof"

secretEnv:
  - name: GRIPDAY_DATABASE_USERNAME
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_DATABASE_USERNAME
  - name: GRIPDAY_DATABASE_PASSWORD
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_DATABASE_PASSWORD
  - name: GRIPDAY_CACHE_REDIS_PASSWORD
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_CACHE_REDIS_PASSWORD
      optional: true
  - name: GRIPDAY_AUTH_JWT_SECRET
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_AUTH_JWT_SECRET
  - name: REDIS_PASSWORD
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_CACHE_REDIS_PASSWORD
      optional: true

secrets:
  enabled: true
  data: {}  # Secrets should be managed externally in test

configMap:
  enabled: true
  data:
    application.yml: |
      spring:
        profiles:
          active: test
      
      logging:
        level:
          org.gripday.bookstore: INFO
          org.springframework.security: INFO
          org.springframework.cache: WARN
          org.hibernate.SQL: WARN
          AUDIT: INFO
        pattern:
          console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","thread":"%thread","correlationId":"%X{correlationId}","userId":"%X{userId}","username":"%X{username}","logger":"%logger{36}","message":"%msg"}%n'

postgresql:
  enabled: true
  image:
    tag: "15.8-alpine"
  replicaCount: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: standard
  env:
    POSTGRES_DB: gripday_bookstore_test
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

redis:
  enabled: true
  image:
    tag: "7.2-alpine"
  replicaCount: 1
  persistence:
    enabled: true
    size: 2Gi
    storageClass: standard
  config:
    maxmemory: "512mb"
    maxmemoryPolicy: "allkeys-lru"
    appendonly: "yes"
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"

networkPolicy:
  enabled: true

resourceQuota:
  enabled: true

limitRange:
  enabled: true
