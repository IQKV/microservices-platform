{{- if and .Values.postgresql.enabled .Values.postgresql.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookstore-postgres-netpol
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "bookstore-service.postgresql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bookstore-service.postgresql.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  {{- toYaml .Values.postgresql.networkPolicy.ingress | nindent 2 }}
  egress:
  - to: []
    ports:
    - protocol: UDP
      port: 53
{{- end }}
