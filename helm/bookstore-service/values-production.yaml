# Production environment values for bookstore-service

global:
  environment: production
  platform: gripday

namespace:
  name: gripday-production-env
  labels:
    app.kubernetes.io/component: bookstore
    environment: production

replicaCount: 5

image:
  repository: gripday/bookstore-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"  # Use specific version tags in production

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"
  environment: "production"

priorityClassName: high-priority

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "500"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://gripday.site, https://*.gripday.site"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
  hosts:
    - host: bookstore.gripday.site
      paths:
        - path: /
          pathType: Prefix
        - path: /api
          pathType: Prefix
        - path: /actuator
          pathType: Prefix
  tls:
    - secretName: bookstore-production-tls
      hosts:
        - bookstore.gripday.site

resources:
  requests:
    memory: "768Mi"
    cpu: "500m"
  limits:
    memory: "1536Mi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
        - type: Pods
          value: 3
          periodSeconds: 30
      selectPolicy: Max

podDisruptionBudget:
  enabled: true
  minAvailable: 3

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - gripday-bookstore-service
        topologyKey: kubernetes.io/hostname
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node.kubernetes.io/instance-type
              operator: In
              values:
                - c5.xlarge
                - c5.2xlarge

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: gripday-bookstore-service
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: gripday-bookstore-service

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "production"
  - name: GRIPDAY_DATABASE_URL
    value: "jdbc:postgresql://bookstore-postgres:5432/gripday_bookstore_production"
  - name: GRIPDAY_CACHE_REDIS_HOST
    value: "bookstore-redis"
  - name: GRIPDAY_CACHE_REDIS_PORT
    value: "6379"
  - name: GRIPDAY_CACHE_REDIS_DATABASE
    value: "2"
  - name: JWT_ISSUER_URI
    value: "http://user-service:8080"
  - name: JWT_JWK_SET_URI
    value: "http://user-service:8080/.well-known/jwks.json"
  - name: CORS_ALLOWED_ORIGINS
    value: "https://gripday.site,https://*.gripday.site"
  - name: REDIS_HOST
    value: "bookstore-redis"
  - name: REDIS_PORT
    value: "6379"
  - name: GRIPDAY_OBSERVABILITY_TRACING_ENDPOINT
    value: "http://jaeger-collector.observability:14268/api/traces"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.observability:4317"
  - name: OTEL_SERVICE_NAME
    value: "gripday-bookstore-service"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "service.name=gripday-bookstore-service,service.version=1.0.0,deployment.environment=production"
  - name: JAVA_OPTS
    value: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -XX:+UseStringDeduplication -XX:+ParallelRefProcEnabled"

secretEnv:
  - name: GRIPDAY_DATABASE_USERNAME
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_DATABASE_USERNAME
  - name: GRIPDAY_DATABASE_PASSWORD
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_DATABASE_PASSWORD
  - name: GRIPDAY_CACHE_REDIS_PASSWORD
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_CACHE_REDIS_PASSWORD
  - name: GRIPDAY_AUTH_JWT_SECRET
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_AUTH_JWT_SECRET
  - name: REDIS_PASSWORD
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_CACHE_REDIS_PASSWORD

secrets:
  enabled: true
  data: {}  # Secrets must be managed externally in production (e.g., AWS Secrets Manager, Vault)

configMap:
  enabled: true
  data:
    application.yml: |
      spring:
        profiles:
          active: production
      
      logging:
        level:
          org.gripday.bookstore: WARN
          org.springframework.security: WARN
          org.springframework.cache: WARN
          org.hibernate.SQL: WARN
          AUDIT: INFO
        pattern:
          console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","thread":"%thread","correlationId":"%X{correlationId}","userId":"%X{userId}","username":"%X{username}","logger":"%logger{36}","message":"%msg"}%n'
      
      management:
        tracing:
          sampling:
            probability: 0.1  # Sample 10% of requests in production

postgresql:
  enabled: true
  image:
    tag: "15.8-alpine"
  replicaCount: 1
  persistence:
    enabled: true
    size: 50Gi
    storageClass: fast-ssd
  env:
    POSTGRES_DB: gripday_bookstore_production
  resources:
    requests:
      memory: "1Gi"
      cpu: "1000m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

redis:
  enabled: true
  image:
    tag: "7.2-alpine"
  replicaCount: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: fast-ssd
  config:
    maxmemory: "1024mb"
    maxmemoryPolicy: "allkeys-lru"
    appendonly: "yes"
    save: "900 1 300 10 60 10000"  # RDB snapshots
  resources:
    requests:
      memory: "512Mi"
      cpu: "400m"
    limits:
      memory: "1Gi"
      cpu: "800m"
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

networkPolicy:
  enabled: true

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "16"
    requests.memory: "32Gi"
    limits.cpu: "32"
    limits.memory: "64Gi"
    requests.storage: "100Gi"
    persistentvolumeclaims: "15"
    pods: "50"
    services: "20"
    configmaps: "20"
    secrets: "20"

limitRange:
  enabled: true
  limits:
    - type: Container
      max:
        cpu: "4"
        memory: "8Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "1000m"
        memory: "1Gi"
      defaultRequest:
        cpu: "500m"
        memory: "512Mi"
      maxLimitRequestRatio:
        cpu: "4"
        memory: "4"
    - type: Pod
      max:
        cpu: "8"
        memory: "16Gi"
      min:
        cpu: "200m"
        memory: "256Mi"
    - type: PersistentVolumeClaim
      max:
        storage: "50Gi"
      min:
        storage: "1Gi"
