# Default values for bookstore-service Helm chart

# Global settings
global:
  environment: dev
  platform: iqscaffold

# Namespace configuration
namespace:
  create: true
  name: iqscaffold-dev-env
  labels:
    app.kubernetes.io/component: bookstore
    environment: dev
  annotations:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

# Application deployment configuration
# Note: For k3s single instance, set to 1 to avoid scheduling issues
replicaCount: 1

image:
  repository: iqscaffold/bookstore-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "bookstore-service-sa"
  automountServiceAccountToken: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80 # External service port
  targetPort: 8080 # Internal container port
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
  headless:
    enabled: true

ingress:
  enabled: false # Bookstore service is internal-only, accessed via Gateway

resources:
  requests:
    memory: "384Mi"
    cpu: "250m"
  limits:
    memory: "768Mi"
    cpu: "500m"

# Horizontal Pod Autoscaler (HPA)
# Note: For k3s single instance, disable HPA or set minReplicas: 1
autoscaling:
  enabled: false # Disabled for k3s single instance
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max

# Pod Disruption Budget
# Note: For k3s single instance, disable PDB
podDisruptionBudget:
  enabled: false # Disabled for k3s single instance
  minAvailable: 1

# Priority Class
# Note: For k3s, priority classes may not be configured - leave empty or create them
priorityClassName: "" # Empty for k3s - set to "medium-priority" if priority classes are configured

# Node selection and affinity
nodeSelector: {}

tolerations: []

# Note: For k3s single instance, affinity rules are not needed
affinity: {}

# Topology spread constraints
# Note: For k3s single instance, topology spread is not applicable
topologySpreadConstraints: []

# Probes configuration
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12
  successThreshold: 1

# Lifecycle hooks
lifecycle:
  preStop:
    exec:
      command:
        - sh
        - -c
        - sleep 15

# Volumes
volumes:
  tmp:
    enabled: true
    emptyDir: {}

# ConfigMap data
configMap:
  enabled: true
  data:
    application.yml: |
      server:
        port: 8080
        shutdown: graceful
        servlet:
          context-path: /
        error:
          include-message: always
          include-binding-errors: always

      spring:
        application:
          name: bookstore-service
        profiles:
          active: local
        
        jpa:
          hibernate:
            ddl-auto: validate
          show-sql: false
          open-in-view: false
          properties:
            hibernate:
              dialect: org.hibernate.dialect.PostgreSQLDialect
              format_sql: true
              use_sql_comments: true
              jdbc:
                batch_size: 20
              order_inserts: true
              order_updates: true
        
        liquibase:
          change-log: classpath:db/changelog/db.changelog-master.xml
          enabled: true
        
        cache:
          type: redis
          redis:
            time-to-live: 600000
            cache-null-values: false
        
        data:
          redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}
            timeout: 2000ms
            lettuce:
              pool:
                max-active: 8
                max-idle: 8
                min-idle: 0
        
        security:
          oauth2:
            resourceserver:
              jwt:
                issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}
                jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}

      springdoc:
        api-docs:
          enabled: true
          path: /api-docs
        swagger-ui:
          enabled: true
          path: /swagger-ui.html
          operations-sorter: method
          tags-sorter: alpha
          try-it-out-enabled: true
          filter: true
          display-request-duration: true
          display-operation-id: false
          default-models-expand-depth: 1
          default-model-expand-depth: 1
          doc-expansion: none
        show-actuator: true
        group-configs:
          - group: bookstore-api-v1
            display-name: Bookstore API v1 (Current)
            paths-to-match: /api/v1/bookstore/**
          - group: bookstore-api-all
            display-name: Bookstore API (All Versions)
            paths-to-match: /api/**/bookstore/**
          - group: actuator
            display-name: Actuator Endpoints
            paths-to-match: /actuator/**

      management:
        endpoints:
          web:
            exposure:
              include: health,info,metrics,prometheus,env,configprops
            base-path: /actuator
        endpoint:
          health:
            show-details: when-authorized
            show-components: always
            probes:
              enabled: true
          metrics:
            enabled: true
          prometheus:
            enabled: true
        health:
          defaults:
            enabled: true
          db:
            enabled: true
          redis:
            enabled: true
          diskspace:
            enabled: true
        metrics:
          distribution:
            percentiles-histogram:
              "[http.server.requests]": true
              "[bookstore.books.search.duration]": true
              "[bookstore.books.creation.duration]": true
              "[bookstore.inventory.update.duration]": true
          tags:
            application: bookstore-service
            environment: ${spring.profiles.active:local}
        prometheus:
          metrics:
            export:
              enabled: true
              step: 60s
              descriptions: true
        tracing:
          sampling:
            probability: 1.0

      logging:
        level:
          com.iqscaffold.bookstore: INFO
          org.springframework.security: INFO
          org.springframework.cache: INFO
          org.hibernate.SQL: INFO
          org.hibernate.type.descriptor.sql.BasicBinder: INFO
          AUDIT: INFO
        pattern:
          console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] [%X{userId}:%X{username}] %logger{36} - %msg%n"

      iqscaffold:
        bookstore:
          cors:
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

# Environment variables
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: IQSCAFFOLD_DATABASE_URL
    value: "jdbc:postgresql://bookstore-postgres:5432/iqscaffold_bookstore_local"
  - name: IQSCAFFOLD_CACHE_REDIS_HOST
    value: "bookstore-redis"
  - name: IQSCAFFOLD_CACHE_REDIS_PORT
    value: "6379"
  - name: IQSCAFFOLD_CACHE_REDIS_DATABASE
    value: "2"
  - name: JWT_ISSUER_URI
    value: "http://user-service:8080"
  - name: JWT_JWK_SET_URI
    value: "http://user-service:8080/.well-known/jwks.json"
  - name: CORS_ALLOWED_ORIGINS
    value: "http://localhost:5173,http://localhost:3000"
  - name: REDIS_HOST
    value: "bookstore-redis"
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_PASSWORD
    value: ""
  - name: IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT
    value: "http://jaeger-collector:14268/api/traces"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector:4317"
  - name: OTEL_SERVICE_NAME
    value: "iqscaffold-bookstore-service"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "service.name=iqscaffold-bookstore-service,service.version=1.0.0,deployment.environment=dev"
  - name: JAVA_OPTS
    value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

# Secret environment variables
secretEnv:
  - name: IQSCAFFOLD_DATABASE_USERNAME
    secretKeyRef:
      name: bookstore-service-secrets
      key: IQSCAFFOLD_DATABASE_USERNAME
  - name: IQSCAFFOLD_DATABASE_PASSWORD
    secretKeyRef:
      name: bookstore-service-secrets
      key: IQSCAFFOLD_DATABASE_PASSWORD
  - name: IQSCAFFOLD_CACHE_REDIS_PASSWORD
    secretKeyRef:
      name: bookstore-service-secrets
      key: IQSCAFFOLD_CACHE_REDIS_PASSWORD
      optional: true
  - name: IQSCAFFOLD_AUTH_JWT_SECRET
    secretKeyRef:
      name: bookstore-service-secrets
      key: IQSCAFFOLD_AUTH_JWT_SECRET

# Secrets configuration
secrets:
  enabled: true
  data:
    IQSCAFFOLD_DATABASE_USERNAME: Z3JpcGRheV91c2Vy
    IQSCAFFOLD_DATABASE_PASSWORD: Z3JpcGRheV9wYXNzd29yZA==
    IQSCAFFOLD_AUTH_JWT_SECRET: bG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tdXNl
    IQSCAFFOLD_CACHE_REDIS_PASSWORD: ""

# Network Policy
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from gateway service (same namespace)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: iqscaffold-gateway-service
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bookstore-postgres
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bookstore-redis
              app.kubernetes.io/component: cache
      ports:
        - protocol: TCP
          port: 6379
    - to: []
      ports:
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: observability
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 14268
    - to: []
      ports:
        - protocol: TCP
          port: 443

# Resource Quota
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    requests.storage: "20Gi"
    persistentvolumeclaims: "5"
    pods: "20"
    services: "10"
    configmaps: "10"
    secrets: "10"

# Limit Range
limitRange:
  enabled: true
  limits:
    - type: Container
      max:
        cpu: "2"
        memory: "4Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      maxLimitRequestRatio:
        cpu: "4"
        memory: "4"
    - type: Pod
      max:
        cpu: "4"
        memory: "8Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
    - type: PersistentVolumeClaim
      max:
        storage: "10Gi"
      min:
        storage: "1Gi"

# PostgreSQL configuration
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15.8-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  priorityClassName: "" # Empty for k3s
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    storageClass: local-path # k3s default storage class
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  env:
    POSTGRES_DB: iqscaffold_bookstore_local
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  initConfig:
    enabled: true
    scripts:
      01-init-extensions.sql: |
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        CREATE EXTENSION IF NOT EXISTS "pgcrypto";
        CREATE EXTENSION IF NOT EXISTS "pg_trgm";
        GRANT ALL PRIVILEGES ON DATABASE iqscaffold_bookstore_local TO iqscaffold_user;
  livenessProbe:
    enabled: true
    command:
      - pg_isready
      - -U
      - $(POSTGRES_USER)
      - -d
      - $(POSTGRES_DB)
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    command:
      - pg_isready
      - -U
      - $(POSTGRES_USER)
      - -d
      - $(POSTGRES_DB)
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: iqscaffold-bookstore-service
                app.kubernetes.io/component: bookstore
        ports:
          - protocol: TCP
            port: 5432
      - from:
          - namespaceSelector:
              matchLabels:
                app.kubernetes.io/name: monitoring
        ports:
          - protocol: TCP
            port: 5432

# Redis configuration
redis:
  enabled: true
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  priorityClassName: "" # Empty for k3s
  service:
    type: ClusterIP
    port: 6379
  persistence:
    enabled: true
    storageClass: local-path # k3s default storage class
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  config:
    maxmemory: "512mb"
    maxmemoryPolicy: "allkeys-lru"
    appendonly: "yes"
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"
  livenessProbe:
    enabled: true
    command:
      - redis-cli
      - ping
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    command:
      - redis-cli
      - ping
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: iqscaffold-bookstore-service
                app.kubernetes.io/component: bookstore
        ports:
          - protocol: TCP
            port: 6379
      - from:
          - namespaceSelector:
              matchLabels:
                app.kubernetes.io/name: monitoring
        ports:
          - protocol: TCP
            port: 6379
