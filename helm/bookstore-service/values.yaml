# Default values for bookstore-service Helm chart

# Global settings
global:
  environment: local
  platform: gripday-platform

# Namespace configuration
namespace:
  create: true
  name: gripday-bookstore
  labels:
    app.kubernetes.io/component: bookstore
    environment: local
  annotations:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

# Application deployment configuration
replicaCount: 2

image:
  repository: gripday/bookstore-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "bookstore-service-sa"
  automountServiceAccountToken: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8082"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8082
  targetPort: 8082
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
    prometheus.io/path: "/actuator/prometheus"
  headless:
    enabled: true

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://pynity.site, https://*.pynity.site"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-ID,X-Correlation-ID"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/limit-rps: "200"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
  hosts:
    - host: bookstore.pynity.site
      paths:
        - path: /
          pathType: Prefix
        - path: /api
          pathType: Prefix
        - path: /actuator
          pathType: Prefix
        - path: /swagger-ui
          pathType: Prefix
        - path: /api-docs
          pathType: Prefix
  tls: []

resources:
  requests:
    memory: "384Mi"
    cpu: "250m"
  limits:
    memory: "768Mi"
    cpu: "500m"

# Horizontal Pod Autoscaler (HPA)
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Priority Class
priorityClassName: medium-priority

# Node selection and affinity
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - gripday-bookstore-service
          topologyKey: kubernetes.io/hostname

# Topology spread constraints
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

# Probes configuration
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8082
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8082
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /actuator/health
    port: 8082
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12
  successThreshold: 1

# Lifecycle hooks
lifecycle:
  preStop:
    exec:
      command:
        - sh
        - -c
        - sleep 15

# Volumes
volumes:
  tmp:
    enabled: true
    emptyDir: {}

# ConfigMap data
configMap:
  enabled: true
  data:
    application.yml: |
      server:
        port: 8082

      spring:
        application:
          name: gripday-bookstore-service
        profiles:
          active: local
        
        jpa:
          hibernate:
            ddl-auto: validate
          show-sql: false
          properties:
            hibernate:
              dialect: org.hibernate.dialect.PostgreSQLDialect
              format_sql: true
              use_sql_comments: true
              jdbc:
                batch_size: 20
              order_inserts: true
              order_updates: true
          open-in-view: false
        
        liquibase:
          change-log: classpath:db/changelog/db.changelog-master.xml
          enabled: true
        
        cache:
          type: redis
          redis:
            time-to-live: PT1H

      springdoc:
        api-docs:
          enabled: true
          path: /api-docs
          groups:
            enabled: true
        swagger-ui:
          enabled: true
          path: /swagger-ui.html
          groups-order: ASC
          operations-sorter: alpha
          tags-sorter: alpha
          try-it-out-enabled: true
          filter: true
          display-request-duration: true
          display-operation-id: true
          show-extensions: true
          show-common-extensions: true
        group-configs:
          - group: books
            display-name: Book Management APIs
            paths-to-match: /api/*/books/**
          - group: inventory
            display-name: Inventory Management APIs
            paths-to-match: /api/*/inventory/**
          - group: search
            display-name: Book Search APIs
            paths-to-match: /api/*/search/**
        show-actuator: true
        use-management-port: false

      management:
        endpoints:
          web:
            exposure:
              include: health,info,metrics,prometheus,liquibase,openapi,caches
        endpoint:
          health:
            show-details: when-authorized
          liquibase:
            enabled: true
          prometheus:
            enabled: true
          caches:
            enabled: true
        metrics:
          export:
            prometheus:
              enabled: true
          distribution:
            percentiles-histogram:
              http.server.requests: true
            percentiles:
              http.server.requests: 0.5,0.95,0.99
        tracing:
          sampling:
            probability: 1.0

      gripday:
        observability:
          tracing:
            enabled: true
            service-name: ${spring.application.name}
            sampling-rate: 1.0
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
            timeout: PT10S
          metrics:
            enabled: true
            path: /actuator/prometheus
            prefix: gripday_bookstore
            include-host-tag: true
            include-application-tag: true
          logging:
            include-correlation-id: true
            include-trace-id: true
            include-span-id: true
            include-user-id: true
            include-tenant-id: true
            correlation-id-header: X-Correlation-ID
            request-id-header: X-Request-ID
            tenant-id-header: X-Tenant-ID

# Environment variables
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "local"
  - name: GRIPDAY_DATABASE_URL
    value: "jdbc:postgresql://bookstore-postgres:5432/gripday_bookstore_local"
  - name: GRIPDAY_CACHE_REDIS_HOST
    value: "bookstore-redis"
  - name: GRIPDAY_CACHE_REDIS_PORT
    value: "6379"
  - name: GRIPDAY_CACHE_REDIS_DATABASE
    value: "2"
  - name: GRIPDAY_OBSERVABILITY_TRACING_ENDPOINT
    value: "http://jaeger-collector:14268/api/traces"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector:4317"
  - name: OTEL_SERVICE_NAME
    value: "gripday-bookstore-service"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "service.name=gripday-bookstore-service,service.version=1.0.0,deployment.environment=local"
  - name: JAVA_OPTS
    value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

# Secret environment variables
secretEnv:
  - name: GRIPDAY_DATABASE_USERNAME
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_DATABASE_USERNAME
  - name: GRIPDAY_DATABASE_PASSWORD
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_DATABASE_PASSWORD
  - name: GRIPDAY_CACHE_REDIS_PASSWORD
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_CACHE_REDIS_PASSWORD
      optional: true
  - name: GRIPDAY_AUTH_JWT_SECRET
    secretKeyRef:
      name: bookstore-service-secrets
      key: GRIPDAY_AUTH_JWT_SECRET

# Secrets configuration
secrets:
  enabled: true
  data:
    GRIPDAY_DATABASE_USERNAME: Z3JpcGRheV91c2Vy
    GRIPDAY_DATABASE_PASSWORD: Z3JpcGRheV9wYXNzd29yZA==
    GRIPDAY_AUTH_JWT_SECRET: bG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tdXNl
    GRIPDAY_CACHE_REDIS_PASSWORD: ""

# Network Policy
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: gripday-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gripday-gateway-service
      ports:
        - protocol: TCP
          port: 8082
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8082
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8082
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bookstore-postgres
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bookstore-redis
              app.kubernetes.io/component: cache
      ports:
        - protocol: TCP
          port: 6379
    - to: []
      ports:
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: observability
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 14268
    - to: []
      ports:
        - protocol: TCP
          port: 443

# Resource Quota
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    requests.storage: "20Gi"
    persistentvolumeclaims: "5"
    pods: "20"
    services: "10"
    configmaps: "10"
    secrets: "10"

# Limit Range
limitRange:
  enabled: true
  limits:
    - type: Container
      max:
        cpu: "2"
        memory: "4Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      maxLimitRequestRatio:
        cpu: "4"
        memory: "4"
    - type: Pod
      max:
        cpu: "4"
        memory: "8Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
    - type: PersistentVolumeClaim
      max:
        storage: "10Gi"
      min:
        storage: "1Gi"

# PostgreSQL configuration
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15.8-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  priorityClassName: infrastructure-priority
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    storageClass: standard
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  env:
    POSTGRES_DB: gripday_bookstore_local
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  initConfig:
    enabled: true
    scripts:
      01-init-extensions.sql: |
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        CREATE EXTENSION IF NOT EXISTS "pgcrypto";
        CREATE EXTENSION IF NOT EXISTS "pg_trgm";
        GRANT ALL PRIVILEGES ON DATABASE gripday_bookstore_local TO gripday_user;
  livenessProbe:
    enabled: true
    command:
      - pg_isready
      - -U
      - $(POSTGRES_USER)
      - -d
      - $(POSTGRES_DB)
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    command:
      - pg_isready
      - -U
      - $(POSTGRES_USER)
      - -d
      - $(POSTGRES_DB)
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: gripday-bookstore-service
                app.kubernetes.io/component: bookstore
        ports:
          - protocol: TCP
            port: 5432
      - from:
          - namespaceSelector:
              matchLabels:
                app.kubernetes.io/name: monitoring
        ports:
          - protocol: TCP
            port: 5432

# Redis configuration
redis:
  enabled: true
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  priorityClassName: infrastructure-priority
  service:
    type: ClusterIP
    port: 6379
  persistence:
    enabled: true
    storageClass: standard
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  config:
    maxmemory: "512mb"
    maxmemoryPolicy: "allkeys-lru"
    appendonly: "yes"
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"
  livenessProbe:
    enabled: true
    command:
      - redis-cli
      - ping
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    command:
      - redis-cli
      - ping
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: gripday-bookstore-service
                app.kubernetes.io/component: bookstore
        ports:
          - protocol: TCP
            port: 6379
      - from:
          - namespaceSelector:
              matchLabels:
                app.kubernetes.io/name: monitoring
        ports:
          - protocol: TCP
            port: 6379
