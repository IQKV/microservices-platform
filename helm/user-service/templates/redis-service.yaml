{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: user-redis
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "user-service.redis.labels" . | nindent 4 }}
spec:
  type: {{ .Values.redis.service.type }}
  ports:
  - port: {{ .Values.redis.service.port }}
    targetPort: {{ .Values.redis.service.port }}
    protocol: TCP
    name: redis
  selector:
    {{- include "user-service.redis.selectorLabels" . | nindent 4 }}
{{- end }}
