# Production values for billing-service Helm chart
global:
  environment: production
  platform: iqscaffold

namespace:
  create: true
  name: iqscaffold-production

replicaCount: 3

image:
  repository: iqscaffold/iqscaffold-billing-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8082

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8082
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8082
  initialDelaySeconds: 90
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "production"
  # Service Integration URLs
  - name: IQSCAFFOLD_USER_SERVICE_URL
    value: "http://user-service:80"
  - name: EMAIL_SERVICE_URL
    value: "http://email-service:80"
  # JWT Configuration
  - name: JWT_ISSUER
    value: "iqscaffold-user-service"
  # Payment Configuration
  - name: PAYMENT_PROVIDER
    value: "stripe"
  - name: BILLING_SAAS_MODE
    value: "true"
  # Email Configuration
  - name: EMAIL_FROM_EMAIL
    value: "billing@iqscaffold.com"
  - name: EMAIL_FROM_NAME
    value: "IQ Scaffold Billing"
  - name: APP_BASE_URL
    value: "https://app.iqscaffold.com"
  # Notification Configuration
  - name: BILLING_EMAIL_NOTIFICATIONS
    value: "true"
  - name: BILLING_WEBHOOK_NOTIFICATIONS
    value: "true"

# Production secrets should be managed externally (e.g., via Sealed Secrets, External Secrets Operator)
secrets:
  enabled: false  # Disable in production - use external secret management

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15.8-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    storageClass: fast-ssd
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  env:
    POSTGRES_DB: iqscaffold_billing_production
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  initConfig:
    enabled: true
    scripts:
      01-init-extensions.sql: |
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        CREATE EXTENSION IF NOT EXISTS "pgcrypto";
  livenessProbe:
    enabled: true
    command:
      - pg_isready
      - -U
      - $(POSTGRES_USER)
      - -d
      - $(POSTGRES_DB)
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    command:
      - pg_isready
      - -U
      - $(POSTGRES_USER)
      - -d
      - $(POSTGRES_DB)
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Production-specific configurations
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

nodeSelector:
  node-type: application

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - billing-service
        topologyKey: kubernetes.io/hostname