{{- if and .Values.redis.enabled .Values.redis.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: billing-redis-netpol
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "billing-service.redis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "billing-service.redis.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
  {{- toYaml .Values.redis.networkPolicy.ingress | nindent 2 }}
{{- end }}
