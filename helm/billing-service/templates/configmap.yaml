apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "billing-service.fullname" . }}-config
  labels:
    {{- include "billing-service.labels" . | nindent 4 }}
data:
  application.yml: |
    spring:
      profiles:
        active: ${SPRING_PROFILES_ACTIVE:production}
      
      # Database Configuration (overridden by environment variables)
      datasource:
        url: ${IQSCAFFOLD_DATABASE_URL}
        username: ${IQSCAFFOLD_DATABASE_USERNAME}
        password: ${IQSCAFFOLD_DATABASE_PASSWORD}
        driver-class-name: org.postgresql.Driver
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000
          leak-detection-threshold: 60000
          auto-commit: false

      # JPA Configuration for Production
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: false
            use_sql_comments: false
            multiTenancy: SCHEMA
            jdbc:
              batch_size: 20
            order_inserts: true
            order_updates: true
        open-in-view: false

    # Production Logging Configuration
    logging:
      level:
        root: INFO
        com.iqscaffold.billingservice: INFO
        org.springframework.security: WARN
        org.hibernate.SQL: WARN
        liquibase: INFO

    # Management and Observability Configuration
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
          base-path: /actuator
      endpoint:
        health:
          show-details: when-authorized
          probes:
            enabled: true
        prometheus:
          enabled: true
      health:
        livenessstate:
          enabled: true
        readinessstate:
          enabled: true
      metrics:
        distribution:
          percentiles-histogram:
            http.server.requests: true
          percentiles:
            http.server.requests: 0.5,0.95,0.99
        tags:
          application: ${spring.application.name}
          service: billing-service
          environment: ${SPRING_PROFILES_ACTIVE:production}
      prometheus:
        metrics:
          export:
            enabled: true
