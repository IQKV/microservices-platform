{{- if and .Values.postgresql.enabled .Values.postgresql.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: billing-postgres-netpol
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "billing-service.postgresql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "billing-service.postgresql.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
  {{- toYaml .Values.postgresql.networkPolicy.ingress | nindent 2 }}
{{- end }}
