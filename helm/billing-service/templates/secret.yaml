{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "billing-service.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
