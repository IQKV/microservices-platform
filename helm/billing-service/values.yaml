# Default values for billing-service Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  environment: dev
  platform: iqscaffold

# Namespace configuration
namespace:
  create: true
  name: iqscaffold-dev-env
  labels:
    app.kubernetes.io/component: billing
    environment: dev
  annotations:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

# Application deployment configuration
# Note: For k3s single instance, set to 1 to avoid scheduling issues
replicaCount: 1

image:
  repository: iqscaffold/iqscaffold-billing-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "billing-service-sa"
  automountServiceAccountToken: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8082"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80 # External service port
  targetPort: 8082 # Internal container port
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
    prometheus.io/path: "/actuator/prometheus"
  # Create headless service for StatefulSet patterns or service mesh
  headless:
    enabled: true

ingress:
  enabled: false # Billing service is internal-only, accessed via Gateway

resources:
  requests:
    memory: "768Mi"
    cpu: "500m"
  limits:
    memory: "1536Mi"
    cpu: "1000m"

# Horizontal Pod Autoscaler (HPA)
# Note: For k3s single instance, disable HPA or set minReplicas: 1
autoscaling:
  enabled: false # Disabled for k3s single instance
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 3
          periodSeconds: 60
      selectPolicy: Max

# Pod Disruption Budget
# Note: For k3s single instance, disable PDB
podDisruptionBudget:
  enabled: false # Disabled for k3s single instance
  minAvailable: 1

# Priority Class
# Note: For k3s, priority classes may not be configured - leave empty or create them
priorityClassName: "" # Empty for k3s - set to "high-priority" if priority classes are configured

# Node selection and affinity
nodeSelector: {}

tolerations: []

# Note: For k3s single instance, affinity rules are not needed
affinity: {}

# Topology spread constraints
# Note: For k3s single instance, topology spread is not applicable
topologySpreadConstraints: []

# Probes configuration
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8082
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8082
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /actuator/health
    port: 8082
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12
  successThreshold: 1

# Lifecycle hooks
lifecycle:
  preStop:
    exec:
      command:
        - sh
        - -c
        - sleep 15

# Volumes
volumes:
  tmp:
    enabled: true
    emptyDir: {}

# ConfigMap data
configMap:
  enabled: true
  data:
    application.yml: |
      server:
        port: 8082

      spring:
        application:
          name: iqscaffold-billing-service
        profiles:
          active: local
        
        # JPA Configuration
        jpa:
          hibernate:
            ddl-auto: validate
          show-sql: false
          properties:
            hibernate:
              dialect: org.hibernate.dialect.PostgreSQLDialect
              format_sql: true
              use_sql_comments: true
              jdbc:
                batch_size: 20
              order_inserts: true
              order_updates: true
          open-in-view: false

        # Liquibase Configuration
        liquibase:
          change-log: classpath:db/changelog/master.xml
          enabled: true

      # SpringDoc OpenAPI Configuration
      springdoc:
        api-docs:
          enabled: true
          path: /api-docs
          groups:
            enabled: true
        swagger-ui:
          enabled: true
          path: /swagger-ui.html
          groups-order: ASC
          operations-sorter: alpha
          tags-sorter: alpha
          try-it-out-enabled: true
          filter: true
          display-request-duration: true
          display-operation-id: true
          show-extensions: true
          show-common-extensions: true
        group-configs:
          - group: subscription-plans
            display-name: Subscription Plan APIs
            paths-to-match: /api/*/billing/plans/**
          - group: subscriptions
            display-name: Subscription Management APIs
            paths-to-match: /api/*/billing/subscriptions/**
          - group: payments
            display-name: Payment APIs
            paths-to-match: /api/*/billing/payments/**
          - group: invoices
            display-name: Invoice APIs
            paths-to-match: /api/*/billing/invoices/**
          - group: usage
            display-name: Usage & Quota APIs
            paths-to-match: /api/*/billing/usage/**
          - group: webhooks
            display-name: Webhook APIs
            paths-to-match: /api/*/billing/webhooks/**
          - group: admin
            display-name: Admin APIs
            paths-to-match: /api/*/admin/billing/**
        show-actuator: true
        use-management-port: false

      # OpenTelemetry Configuration
      management:
        endpoints:
          web:
            exposure:
              include: health,info,metrics,prometheus,liquibase,openapi
        endpoint:
          health:
            show-details: when-authorized
          liquibase:
            enabled: true
          prometheus:
            enabled: true
        metrics:
          export:
            prometheus:
              enabled: true
          distribution:
            percentiles-histogram:
              http.server.requests: true
            percentiles:
              http.server.requests: 0.5,0.95,0.99
        tracing:
          sampling:
            probability: 1.0

      # IQ Scaffold Billing-specific configuration properties
      iqscaffold:
        billing:
          security:
            jwt:
              issuer: iqscaffold-user-service
            rate-limiting:
              enabled: true
              requests-per-minute: 100
              burst-capacity: 200
          integration:
            user-service:
              timeout: 5s
            email-service:
              timeout: 10s
          subscription:
            default-currency: USD
            trial-days: 14
            grace-period-days: 3
            allow-multiple-subscriptions: false
          usage:
            metering-enabled: true
            batch-size: 100
            flush-interval: PT30S
            retention-days: 365
          invoice:
            number-format: "INV-{YEAR}{MONTH}-{SEQUENCE}"
            due-days: 7
            auto-finalize: true
            pdf-generation-enabled: true
          portal:
            enabled: true
            allow-plan-changes: true
            allow-cancellation: true
          features:
            proration: true
            dunning: true
            analytics: true
            webhooks: true
        observability:
          tracing:
            enabled: true
            service-name: ${spring.application.name}
            sampling-rate: 1.0
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
            timeout: PT10S
          metrics:
            enabled: true
            path: /actuator/prometheus
            prefix: iqscaffold_billing
            include-host-tag: true
            include-application-tag: true
          logging:
            include-correlation-id: true
            include-trace-id: true
            include-span-id: true
            include-user-id: true
            include-tenant-id: true
            correlation-id-header: X-Correlation-ID
            request-id-header: X-Request-ID
            tenant-id-header: X-Tenant-ID

# Environment variables
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: IQSCAFFOLD_DATABASE_URL
    value: "jdbc:postgresql://billing-postgres:5432/iqscaffold_billing_local"
  - name: IQSCAFFOLD_CACHE_REDIS_HOST
    value: "billing-redis"
  - name: IQSCAFFOLD_CACHE_REDIS_PORT
    value: "6379"
  - name: IQSCAFFOLD_CACHE_REDIS_DATABASE
    value: "0"
  - name: IQSCAFFOLD_RABBITMQ_HOST
    value: "billing-rabbitmq"
  - name: IQSCAFFOLD_RABBITMQ_PORT
    value: "5672"
  - name: IQSCAFFOLD_RABBITMQ_VIRTUAL_HOST
    value: "/"
  - name: IQSCAFFOLD_BILLING_SECURITY_JWT_JWK_SET_URI
    value: "http://user-service:8081/.well-known/jwks.json"
  - name: IQSCAFFOLD_BILLING_INTEGRATION_USER_SERVICE_URL
    value: "http://user-service:8081"
  - name: IQSCAFFOLD_BILLING_INTEGRATION_EMAIL_SERVICE_URL
    value: "http://email-service:8084"
  - name: IQSCAFFOLD_BILLING_PAYMENT_PROVIDER
    value: "stripe"
  - name: IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT
    value: "http://jaeger-collector:14268/api/traces"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector:4317"
  - name: OTEL_SERVICE_NAME
    value: "iqscaffold-billing-service"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "service.name=iqscaffold-billing-service,service.version=1.0.0,deployment.environment=dev"
  - name: JAVA_OPTS
    value: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

# Secret environment variables (from Kubernetes Secret)
secretEnv:
  - name: IQSCAFFOLD_DATABASE_USERNAME
    secretKeyRef:
      name: billing-service-secrets
      key: IQSCAFFOLD_DATABASE_USERNAME
  - name: IQSCAFFOLD_DATABASE_PASSWORD
    secretKeyRef:
      name: billing-service-secrets
      key: IQSCAFFOLD_DATABASE_PASSWORD
  - name: IQSCAFFOLD_CACHE_REDIS_PASSWORD
    secretKeyRef:
      name: billing-service-secrets
      key: IQSCAFFOLD_CACHE_REDIS_PASSWORD
      optional: true
  - name: IQSCAFFOLD_RABBITMQ_USERNAME
    secretKeyRef:
      name: billing-service-secrets
      key: IQSCAFFOLD_RABBITMQ_USERNAME
  - name: IQSCAFFOLD_RABBITMQ_PASSWORD
    secretKeyRef:
      name: billing-service-secrets
      key: IQSCAFFOLD_RABBITMQ_PASSWORD
  - name: STRIPE_API_KEY
    secretKeyRef:
      name: billing-service-secrets
      key: STRIPE_API_KEY
  - name: STRIPE_WEBHOOK_SECRET
    secretKeyRef:
      name: billing-service-secrets
      key: STRIPE_WEBHOOK_SECRET
  - name: PAYPAL_CLIENT_ID
    secretKeyRef:
      name: billing-service-secrets
      key: PAYPAL_CLIENT_ID
      optional: true
  - name: PAYPAL_CLIENT_SECRET
    secretKeyRef:
      name: billing-service-secrets
      key: PAYPAL_CLIENT_SECRET
      optional: true

# Secrets configuration
secrets:
  enabled: true
  data:
    IQSCAFFOLD_DATABASE_USERNAME: aXFzY2FmZm9sZF9iaWxsaW5n # iqscaffold_billing
    IQSCAFFOLD_DATABASE_PASSWORD: aXFzY2FmZm9sZF9wYXNzd29yZA== # iqscaffold_password
    IQSCAFFOLD_CACHE_REDIS_PASSWORD: ""
    IQSCAFFOLD_RABBITMQ_USERNAME: aXFzY2FmZm9sZF9iaWxsaW5n # iqscaffold_billing
    IQSCAFFOLD_RABBITMQ_PASSWORD: aXFzY2FmZm9sZF9wYXNzd29yZA== # iqscaffold_password
    STRIPE_API_KEY: c2tfdGVzdF9kdW1teV9rZXk= # sk_test_dummy_key
    STRIPE_WEBHOOK_SECRET: d2hzZWNfZHVtbXlfc2VjcmV0 # whsec_dummy_secret
    PAYPAL_CLIENT_ID: ""
    PAYPAL_CLIENT_SECRET: ""

# Network Policy
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from gateway service (same namespace)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: iqscaffold-gateway-service
      ports:
        - protocol: TCP
          port: 8082
    # Allow traffic from other business microservices (same namespace)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8082
    # Allow traffic from monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8082
  egress:
    # Allow access to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: billing-postgres
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 5432
    # Allow access to Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: billing-redis
              app.kubernetes.io/component: cache
      ports:
        - protocol: TCP
          port: 6379
    # Allow access to RabbitMQ
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: billing-rabbitmq
              app.kubernetes.io/component: message-queue
      ports:
        - protocol: TCP
          port: 5672
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # Allow access to observability services
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: observability
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 14268
    # Allow access to user service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: iqscaffold-user-service
      ports:
        - protocol: TCP
          port: 8081
    # Allow HTTPS for external payment providers (Stripe, PayPal)
    - to: []
      ports:
        - protocol: TCP
          port: 443

# Resource Quota
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    requests.storage: "30Gi"
    persistentvolumeclaims: "5"
    pods: "20"
    services: "15"
    configmaps: "10"
    secrets: "10"

# Limit Range
limitRange:
  enabled: true
  limits:
    - type: Container
      max:
        cpu: "2"
        memory: "4Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
      default:
        cpu: "1000m"
        memory: "1536Mi"
      defaultRequest:
        cpu: "500m"
        memory: "768Mi"
      maxLimitRequestRatio:
        cpu: "4"
        memory: "4"
    - type: Pod
      max:
        cpu: "4"
        memory: "8Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
    - type: PersistentVolumeClaim
      max:
        storage: "10Gi"
      min:
        storage: "1Gi"

# PostgreSQL configuration
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15.8-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  priorityClassName: "" # Empty for k3s
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    storageClass: local-path # k3s default storage class
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  env:
    POSTGRES_DB: iqscaffold_billing_local
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  initConfig:
    enabled: true
    scripts:
      01-init-extensions.sql: |
        -- Create extensions if needed
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        CREATE EXTENSION IF NOT EXISTS "pgcrypto";

        -- Grant necessary permissions
        GRANT ALL PRIVILEGES ON DATABASE iqscaffold_billing_local TO iqscaffold_billing;
  livenessProbe:
    enabled: true
    command:
      - pg_isready
      - -U
      - $(POSTGRES_USER)
      - -d
      - $(POSTGRES_DB)
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    command:
      - pg_isready
      - -U
      - $(POSTGRES_USER)
      - -d
      - $(POSTGRES_DB)
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: iqscaffold-billing-service
                app.kubernetes.io/component: billing
        ports:
          - protocol: TCP
            port: 5432
      - from:
          - namespaceSelector:
              matchLabels:
                app.kubernetes.io/name: monitoring
        ports:
          - protocol: TCP
            port: 5432

# Redis configuration
redis:
  enabled: true
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  priorityClassName: "" # Empty for k3s
  service:
    type: ClusterIP
    port: 6379
  persistence:
    enabled: true
    storageClass: local-path # k3s default storage class
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  config:
    maxmemory: "256mb"
    maxmemoryPolicy: "allkeys-lru"
    appendonly: "yes"
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"
  livenessProbe:
    enabled: true
    command:
      - redis-cli
      - ping
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    command:
      - redis-cli
      - ping
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: iqscaffold-billing-service
                app.kubernetes.io/component: billing
        ports:
          - protocol: TCP
            port: 6379
      - from:
          - namespaceSelector:
              matchLabels:
                app.kubernetes.io/name: monitoring
        ports:
          - protocol: TCP
            port: 6379

# RabbitMQ configuration
rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: "3.12-management-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  priorityClassName: "" # Empty for k3s
  service:
    type: ClusterIP
    amqpPort: 5672
    managementPort: 15672
  persistence:
    enabled: true
    storageClass: local-path # k3s default storage class
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  env:
    RABBITMQ_DEFAULT_VHOST: /
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  livenessProbe:
    enabled: true
    command:
      - rabbitmq-diagnostics
      - -q
      - ping
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    command:
      - rabbitmq-diagnostics
      - -q
      - check_port_connectivity
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: iqscaffold-billing-service
                app.kubernetes.io/component: billing
        ports:
          - protocol: TCP
            port: 5672
          - protocol: TCP
            port: 15672
      - from:
          - namespaceSelector:
              matchLabels:
                app.kubernetes.io/name: monitoring
        ports:
          - protocol: TCP
            port: 15672
