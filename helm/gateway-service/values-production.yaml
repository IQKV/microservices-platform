# Production environment values for gateway-service

global:
  environment: production
  platform: gripday

namespace:
  name: gripday-production-env
  labels:
    app.kubernetes.io/component: gateway
    environment: production

replicaCount: 10

image:
  repository: gripday/gateway-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"  # Use specific version tags in production

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"
  environment: "production"

priorityClassName: critical-priority

ingress:
  enabled: true
  className: nginx
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-prod  # Uncomment if using cert-manager
    nginx.ingress.kubernetes.io/ssl-redirect: "false"  # TLS optional - set to "true" if TLS enabled
    nginx.ingress.kubernetes.io/rate-limit: "2000"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://gripday.com, https://*.gripday.com"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
  hosts:
    - host: api.gripday.com
      paths:
        - path: /
          pathType: Prefix
  tls: []  # TLS disabled by default - configure externally if needed
  # Uncomment to enable TLS:
  # tls:
  #   - secretName: gateway-production-tls
  #     hosts:
  #       - api.gripday.com

resources:
  requests:
    memory: "1536Mi"
    cpu: "1000m"
  limits:
    memory: "3Gi"
    cpu: "2000m"

autoscaling:
  enabled: true
  minReplicas: 10
  maxReplicas: 30
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 10
          periodSeconds: 120
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 5
          periodSeconds: 15
      selectPolicy: Max

podDisruptionBudget:
  enabled: true
  minAvailable: 7

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - gripday-gateway-service
        topologyKey: kubernetes.io/hostname
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node.kubernetes.io/instance-type
              operator: In
              values:
                - c5.2xlarge
                - c5.4xlarge

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: gripday-gateway-service
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: gripday-gateway-service

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "production"
  - name: GRIPDAY_CACHE_REDIS_HOST
    value: "gateway-redis"
  - name: GRIPDAY_CACHE_REDIS_PORT
    value: "6379"
  - name: GRIPDAY_CACHE_REDIS_DATABASE
    value: "1"
  - name: USER_SERVICE_JWK_URI
    value: "http://user-service.gripday-production-env.svc.cluster.local:8080/.well-known/jwks.json"
  - name: GRIPDAY_GATEWAY_ROUTING_SERVICES_USER_SERVICE_URI
    value: "http://user-service.gripday-production-env.svc.cluster.local:8080"
  - name: GRIPDAY_GATEWAY_ROUTING_SERVICES_BOOKSTORE_SERVICE_URI
    value: "http://bookstore-service.gripday-production-env.svc.cluster.local:8080"
  - name: GRIPDAY_GATEWAY_CORS_ALLOWED_ORIGINS
    value: "https://gripday.com,https://*.gripday.com"
  - name: GRIPDAY_OBSERVABILITY_TRACING_ENDPOINT
    value: "http://jaeger-collector.observability:14268/api/traces"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.observability:4317"
  - name: OTEL_SERVICE_NAME
    value: "gripday-gateway-service"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "service.name=gripday-gateway-service,service.version=1.0.0,deployment.environment=production"
  - name: JAVA_OPTS
    value: "-Xms1024m -Xmx2048m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -XX:+UseStringDeduplication -XX:+ParallelRefProcEnabled"

secretEnv:
  - name: GRIPDAY_CACHE_REDIS_PASSWORD
    secretKeyRef:
      name: gateway-service-secrets
      key: GRIPDAY_CACHE_REDIS_PASSWORD
  - name: GRIPDAY_AUTH_JWT_SECRET
    secretKeyRef:
      name: gateway-service-secrets
      key: GRIPDAY_AUTH_JWT_SECRET

secrets:
  enabled: true
  data: {}  # Secrets must be managed externally in production (e.g., AWS Secrets Manager, Vault)

configMap:
  enabled: true
  data:
    application.yml: |
      spring:
        profiles:
          active: production
      
      logging:
        level:
          org.gripday.gateway: WARN
          org.springframework.cloud.gateway: WARN
          org.springframework.security: WARN
          AUDIT: INFO
        pattern:
          console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","thread":"%thread","correlationId":"%X{correlationId}","userId":"%X{userId}","username":"%X{username}","logger":"%logger{36}","message":"%msg"}%n'
      
      management:
        tracing:
          sampling:
            probability: 0.1  # Sample 10% of requests in production
      
      gripday:
        observability:
          logging:
            enable-request-logging: false  # Disable verbose request logging in production
            enable-response-logging: false

redis:
  enabled: true
  image:
    tag: "7.2-alpine"
  replicaCount: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: fast-ssd
  config:
    maxmemory: "1536mb"
    maxmemoryPolicy: "allkeys-lru"
    appendonly: "yes"
    save: "900 1 300 10 60 10000"  # RDB snapshots
  resources:
    requests:
      memory: "768Mi"
      cpu: "500m"
    limits:
      memory: "1536Mi"
      cpu: "1000m"
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

networkPolicy:
  enabled: true

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "24"
    requests.memory: "48Gi"
    limits.cpu: "48"
    limits.memory: "96Gi"
    requests.storage: "30Gi"
    persistentvolumeclaims: "15"
    pods: "60"
    services: "20"
    configmaps: "20"
    secrets: "20"

limitRange:
  enabled: true
  limits:
    - type: Container
      max:
        cpu: "4"
        memory: "8Gi"
      min:
        cpu: "200m"
        memory: "256Mi"
      default:
        cpu: "2000m"
        memory: "2Gi"
      defaultRequest:
        cpu: "1000m"
        memory: "1Gi"
      maxLimitRequestRatio:
        cpu: "4"
        memory: "4"
    - type: Pod
      max:
        cpu: "12"
        memory: "24Gi"
      min:
        cpu: "400m"
        memory: "512Mi"
    - type: PersistentVolumeClaim
      max:
        storage: "10Gi"
      min:
        storage: "1Gi"
