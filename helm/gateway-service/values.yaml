# Default values for gateway-service Helm chart

# Global settings
global:
  environment: dev
  platform: iqscaffold

# Namespace configuration
namespace:
  create: true
  name: iqscaffold-dev-env
  labels:
    app.kubernetes.io/component: gateway
    environment: dev
  annotations:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

# Application deployment configuration
# Note: For k3s single instance, set to 1 to avoid scheduling issues
replicaCount: 1

image:
  repository: iqscaffold/iqscaffold-gateway-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "gateway-service-sa"
  automountServiceAccountToken: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80 # External service port
  targetPort: 8080 # Internal container port
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
  headless:
    enabled: true

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # TLS optional - set to "true" if TLS enabled
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://iqscaffold.site, https://*.iqscaffold.site"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-ID,X-Correlation-ID"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/limit-rps: "500"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
  hosts:
    - host: api.iqscaffold.site
      paths:
        - path: /
          pathType: Prefix
  tls: [] # TLS disabled by default - configure externally if needed

resources:
  requests:
    memory: "768Mi"
    cpu: "500m"
  limits:
    memory: "1536Mi"
    cpu: "1000m"

# Horizontal Pod Autoscaler (HPA)
# Note: For k3s single instance, disable HPA or set minReplicas: 1
autoscaling:
  enabled: false # Disabled for k3s single instance
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 5
          periodSeconds: 30
      selectPolicy: Max

# Pod Disruption Budget
# Note: For k3s single instance, disable PDB
podDisruptionBudget:
  enabled: false # Disabled for k3s single instance
  minAvailable: 1

# Priority Class
# Note: For k3s, priority classes may not be configured - leave empty or create them
priorityClassName: "" # Empty for k3s - set to "high-priority" if priority classes are configured

# Node selection and affinity
nodeSelector: {}

tolerations: []

# Note: For k3s single instance, affinity rules are not needed
affinity: {}

# Topology spread constraints
# Note: For k3s single instance, topology spread is not applicable
topologySpreadConstraints: []

# Probes configuration
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12
  successThreshold: 1

# Lifecycle hooks
lifecycle:
  preStop:
    exec:
      command:
        - sh
        - -c
        - sleep 15

# Volumes
volumes:
  tmp:
    enabled: true
    emptyDir: {}

# ConfigMap data
configMap:
  enabled: true
  data:
    application.yml: |
      server:
        port: 8080
        shutdown: graceful

      spring:
        application:
          name: iqscaffold-gateway-service
        profiles:
          active: local
        
        cloud:
          gateway:
            routes:
              # User Service Routes
              - id: user-service-auth
                uri: ${iqscaffold.gateway.routing.services.user-service.uri}
                predicates:
                  - Path=/api/v1/auth/**
                filters:
                  - StripPrefix=0
                  - name: RequestRateLimiter
                    args:
                      redis-rate-limiter.replenish-rate: 60
                      redis-rate-limiter.burst-capacity: 100
              
              - id: user-service-profile
                uri: ${iqscaffold.gateway.routing.services.user-service.uri}
                predicates:
                  - Path=/api/v1/users/me,/api/v1/users/me/**
                filters:
                  - StripPrefix=0
                  - name: RequestRateLimiter
                    args:
                      redis-rate-limiter.replenish-rate: 100
                      redis-rate-limiter.burst-capacity: 150
              
              - id: user-service-admin
                uri: ${iqscaffold.gateway.routing.services.user-service.uri}
                predicates:
                  - Path=/api/v1/admin/**
                filters:
                  - StripPrefix=0
                  - name: RequestRateLimiter
                    args:
                      redis-rate-limiter.replenish-rate: 100
                      redis-rate-limiter.burst-capacity: 150
              
              - id: user-service-jwks
                uri: ${iqscaffold.gateway.routing.services.user-service.uri}
                predicates:
                  - Path=/.well-known/jwks.json
                filters:
                  - StripPrefix=0
              
              # Gateway Health & Monitoring
              - id: gateway-actuator
                uri: http://localhost:8080
                predicates:
                  - Path=/actuator/**
                filters:
                  - StripPrefix=0
            
            globalcors:
              cors-configurations:
                '[/**]':
                  allowedOriginPatterns: ${iqscaffold.gateway.cors.allowed-origins}
                  allowedMethods:
                    - GET
                    - POST
                    - PUT
                    - PATCH
                    - DELETE
                    - OPTIONS
                  allowedHeaders:
                    - "*"
                  allowCredentials: true
                  maxAge: 3600
            
            default-filters:
              - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      # IQ Scaffold Gateway Configuration
      iqscaffold:
        cache:
          redis:
            host: ${IQSCAFFOLD_CACHE_REDIS_HOST:localhost}
            port: ${IQSCAFFOLD_CACHE_REDIS_PORT:6379}
            password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD:}
            database: ${IQSCAFFOLD_CACHE_REDIS_DATABASE:1}
            timeout: PT2S
            pool:
              max-active: 8
              max-idle: 8
              min-idle: 0
            key-prefix: "iqscaffold:gateway"
            default-ttl: PT1H
        
        gateway:
          routing:
            api-prefix:
              enabled: true
              prefix: /api
              strip-count: 0
            services:
              user-service:
                uri: ${IQSCAFFOLD_GATEWAY_ROUTING_SERVICES_USER_SERVICE_URI:http://user-service}
                path: /v1/**
                enabled: true
                connect-timeout: 5000
                response-timeout: 30000
          
          security:
            jwt:
              access-token-expiry: PT15M
              refresh-token-expiry: P7D
              issuer: iqscaffold-user-service
              audience: iqscaffold-services
              algorithm: RS256
              jwk-set-uri: ${USER_SERVICE_JWK_URI:http://user-service/.well-known/jwks.json}
            authentication:
              enabled: true
              user-service-url: ${IQSCAFFOLD_GATEWAY_ROUTING_SERVICES_USER_SERVICE_URI:http://user-service}
              token-validation-timeout: PT5S
              enable-user-context-propagation: true
            public-paths:
              - /.well-known/jwks.json
              - /api/v1/auth/login
              - /api/v1/auth/signup
              - /api/v1/auth/refresh
              - /api/v1/auth/validate
              - /api/v1/auth/health
              - /api/v1/auth/email/verify
              - /api/v1/auth/email/resend
              - /api/v1/auth/email/status
              - /api/v1/auth/password/forgot
              - /api/v1/auth/password/reset
              - /actuator/health
              - /actuator/info
              - /swagger-ui/**
              - /api-docs/**
          
          rate-limiting:
            enabled: true
            redis:
              key-prefix: "iqscaffold:gateway:rate-limit"
              key-expiry: PT1M
            policies:
              default-requests-per-minute: 60
              default-burst-capacity: 100
              endpoints:
                "/api/v1/auth/login":
                  requests-per-minute: 10
                  burst-capacity: 20
                "/api/v1/auth/signup":
                  requests-per-minute: 5
                  burst-capacity: 10
          
          circuit-breaker:
            enabled: true
            failure-rate-threshold: 50
            slow-call-rate-threshold: 50
            slow-call-duration-threshold: PT2S
            minimum-number-of-calls: 10
            wait-duration-in-open-state: PT30S
            sliding-window-size: 100
            sliding-window-type: COUNT_BASED
          
          cors:
            enabled: true
            allowed-origins: ${IQSCAFFOLD_GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true
            max-age: 3600
          
          transformation:
            request:
              enabled: true
              enable-header-enrichment: true
              enable-user-context-propagation: true
              enable-tenant-context-propagation: true
              additional-headers:
                X-Gateway-Version: "1.0.0"
            response:
              enabled: true
              enable-security-headers: true
              enable-correlation-headers: true
              remove-internal-headers: true
        
        observability:
          tracing:
            enabled: true
            service-name: ${spring.application.name}
            sampling-rate: 1.0
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
            timeout: PT10S
          metrics:
            enabled: true
            path: /actuator/prometheus
            prefix: iqscaffold_gateway
            include-host-tag: true
            include-application-tag: true
          logging:
            level: INFO
            format: console
            enable-request-logging: true
            enable-response-logging: false
            enable-correlation-id: true
            include-trace-id: true
            include-span-id: true
            include-user-id: true
            include-tenant-id: true
            correlation-id-header: X-Correlation-ID
            request-id-header: X-Request-ID
            tenant-id-header: X-Tenant-ID

      # SpringDoc OpenAPI Configuration
      springdoc:
        api-docs:
          enabled: true
          path: /api-docs
        swagger-ui:
          enabled: true
          path: /swagger-ui.html

      # Management Configuration
      management:
        endpoints:
          web:
            exposure:
              include: health,info,metrics,prometheus,gateway
            base-path: /actuator
        endpoint:
          health:
            show-details: when-authorized
            show-components: always
            probes:
              enabled: true
          prometheus:
            enabled: true
        health:
          defaults:
            enabled: true
          redis:
            enabled: true
          diskspace:
            enabled: true
        metrics:
          distribution:
            percentiles-histogram:
              "[http.server.requests]": true
              "[gateway.requests]": true
            percentiles:
              "[http.server.requests]": 0.5,0.95,0.99
          tags:
            application: iqscaffold-gateway-service
            environment: ${spring.profiles.active:local}
        prometheus:
          metrics:
            export:
              enabled: true
              step: 60s
              descriptions: true
        tracing:
          sampling:
            probability: 1.0

# Environment variables
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: IQSCAFFOLD_CACHE_REDIS_HOST
    value: "gateway-redis"
  - name: IQSCAFFOLD_CACHE_REDIS_PORT
    value: "6379"
  - name: IQSCAFFOLD_CACHE_REDIS_DATABASE
    value: "1"
  - name: USER_SERVICE_JWK_URI
    value: "http://user-service/.well-known/jwks.json"
  - name: IQSCAFFOLD_GATEWAY_ROUTING_SERVICES_USER_SERVICE_URI
    value: "http://user-service"
  - name: IQSCAFFOLD_GATEWAY_CORS_ALLOWED_ORIGINS
    value: "http://localhost:3000,http://localhost:5173,http://localhost:8080"
  - name: IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT
    value: "http://jaeger-collector:14268/api/traces"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector:4317"
  - name: OTEL_SERVICE_NAME
    value: "iqscaffold-gateway-service"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "service.name=iqscaffold-gateway-service,service.version=1.0.0,deployment.environment=dev"
  - name: JAVA_OPTS
    value: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

# Secret environment variables
secretEnv:
  - name: IQSCAFFOLD_CACHE_REDIS_PASSWORD
    secretKeyRef:
      name: gateway-service-secrets
      key: IQSCAFFOLD_CACHE_REDIS_PASSWORD
      optional: true
  - name: IQSCAFFOLD_AUTH_JWT_SECRET
    secretKeyRef:
      name: gateway-service-secrets
      key: IQSCAFFOLD_AUTH_JWT_SECRET

# Secrets configuration
secrets:
  enabled: true
  data:
    IQSCAFFOLD_AUTH_JWT_SECRET: bG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tdXNl
    IQSCAFFOLD_CACHE_REDIS_PASSWORD: ""

# Network Policy
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow external traffic (from ingress controller)
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Allow traffic from same namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    # Allow traffic from monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow access to user-service (same namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: iqscaffold-user-service
      ports:
        - protocol: TCP
          port: 8080
    # Allow access to Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway-redis
              app.kubernetes.io/component: cache
      ports:
        - protocol: TCP
          port: 6379
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # Allow access to observability services
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: observability
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 14268
    # Allow HTTPS for external services
    - to: []
      ports:
        - protocol: TCP
          port: 443

# Resource Quota
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "6"
    requests.memory: "12Gi"
    limits.cpu: "12"
    limits.memory: "24Gi"
    requests.storage: "10Gi"
    persistentvolumeclaims: "5"
    pods: "30"
    services: "10"
    configmaps: "10"
    secrets: "10"

# Limit Range
limitRange:
  enabled: true
  limits:
    - type: Container
      max:
        cpu: "2"
        memory: "4Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "1000m"
        memory: "1Gi"
      defaultRequest:
        cpu: "500m"
        memory: "512Mi"
      maxLimitRequestRatio:
        cpu: "4"
        memory: "4"
    - type: Pod
      max:
        cpu: "6"
        memory: "12Gi"
      min:
        cpu: "200m"
        memory: "256Mi"
    - type: PersistentVolumeClaim
      max:
        storage: "5Gi"
      min:
        storage: "500Mi"

# Redis configuration (Gateway only needs Redis, no PostgreSQL)
redis:
  enabled: true
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  priorityClassName: "" # Empty for k3s
  service:
    type: ClusterIP
    port: 6379
  persistence:
    enabled: true
    storageClass: local-path # k3s default storage class
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  config:
    maxmemory: "512mb"
    maxmemoryPolicy: "allkeys-lru"
    appendonly: "yes"
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"
  livenessProbe:
    enabled: true
    command:
      - redis-cli
      - ping
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    command:
      - redis-cli
      - ping
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: iqscaffold-gateway-service
                app.kubernetes.io/component: gateway
        ports:
          - protocol: TCP
            port: 6379
      - from:
          - namespaceSelector:
              matchLabels:
                app.kubernetes.io/name: monitoring
        ports:
          - protocol: TCP
            port: 6379
