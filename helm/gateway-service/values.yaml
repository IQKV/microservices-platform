# Default values for gateway-service Helm chart

# Global settings
global:
  environment: local
  platform: gripday-platform

# Namespace configuration
namespace:
  create: true
  name: gripday-gateway
  labels:
    app.kubernetes.io/component: gateway
    environment: local
  annotations:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

# Application deployment configuration
replicaCount: 3

image:
  repository: gripday/gateway-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "gateway-service-sa"
  automountServiceAccountToken: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
  headless:
    enabled: true

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://gripday.dev, https://*.gripday.dev"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-ID,X-Correlation-ID"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/limit-rps: "500"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
  hosts:
    - host: api.gripday.dev
      paths:
        - path: /
          pathType: Prefix
        - path: /api
          pathType: Prefix
        - path: /actuator
          pathType: Prefix
  tls: []

resources:
  requests:
    memory: "768Mi"
    cpu: "500m"
  limits:
    memory: "1536Mi"
    cpu: "1000m"

# Horizontal Pod Autoscaler (HPA)
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  metrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Priority Class
priorityClassName: high-priority

# Node selection and affinity
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - gripday-gateway-service
        topologyKey: kubernetes.io/hostname

# Topology spread constraints
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

# Probes configuration
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12
  successThreshold: 1

# Lifecycle hooks
lifecycle:
  preStop:
    exec:
      command:
      - sh
      - -c
      - sleep 15

# Volumes
volumes:
  tmp:
    enabled: true
    emptyDir: {}

# ConfigMap data
configMap:
  enabled: true
  data:
    application.yml: |
      server:
        port: 8080
      
      spring:
        application:
          name: gripday-gateway-service
        profiles:
          active: local
        
        cloud:
          gateway:
            routes:
            # Auth Service Routes
            - id: auth-service-api
              uri: http://auth-service.gripday-auth.svc.cluster.local:8081
              predicates:
              - Path=/api/v1/auth/**
              filters:
              - StripPrefix=0
            
            - id: auth-service-users
              uri: http://auth-service.gripday-auth.svc.cluster.local:8081
              predicates:
              - Path=/api/v1/users/**
              filters:
              - StripPrefix=0
            
            - id: auth-service-tenants
              uri: http://auth-service.gripday-auth.svc.cluster.local:8081
              predicates:
              - Path=/api/v1/tenants/**
              filters:
              - StripPrefix=0
            
            # Bookstore Service Routes
            - id: bookstore-service-api
              uri: http://bookstore-service.gripday-bookstore.svc.cluster.local:8082
              predicates:
              - Path=/api/v1/bookstore/**
              filters:
              - StripPrefix=0
            
            - id: bookstore-service-public
              uri: http://bookstore-service.gripday-bookstore.svc.cluster.local:8082
              predicates:
              - Path=/api/v1/bookstore/public/**
              filters:
              - StripPrefix=0
            
            # Gateway Health & Monitoring
            - id: gateway-actuator
              uri: http://localhost:8080
              predicates:
              - Path=/actuator/**
              filters:
              - StripPrefix=0
            
            globalcors:
              cors-configurations:
                '[/**]':
                  allowedOriginPatterns: "*"
                  allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                  allowedHeaders:
                  - "*"
                  allowCredentials: true
                  maxAge: 3600
            
            default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      
      management:
        endpoints:
          web:
            exposure:
              include: health,info,metrics,prometheus,gateway
        endpoint:
          health:
            show-details: when-authorized
          prometheus:
            enabled: true
        metrics:
          export:
            prometheus:
              enabled: true
          distribution:
            percentiles-histogram:
              http.server.requests: true
            percentiles:
              http.server.requests: 0.5,0.95,0.99
        tracing:
          sampling:
            probability: 1.0
      
      gripday:
        gateway:
          auth:
            jwt:
              secret: ${GRIPDAY_AUTH_JWT_SECRET}
              issuer: gripday-auth-service
          rate-limiting:
            enabled: true
            default-requests-per-minute: 60
            burst-capacity: 10
            replenish-rate: 1
          circuit-breaker:
            enabled: true
            failure-rate-threshold: 50
            wait-duration-in-open-state: 30s
            sliding-window-size: 10
            minimum-number-of-calls: 5
        observability:
          tracing:
            enabled: true
            service-name: ${spring.application.name}
            sampling-rate: 1.0
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
            timeout: PT10S
          metrics:
            enabled: true
            path: /actuator/prometheus
            prefix: gripday_gateway
            include-host-tag: true
            include-application-tag: true
          logging:
            include-correlation-id: true
            include-trace-id: true
            include-span-id: true
            include-user-id: true
            include-tenant-id: true
            correlation-id-header: X-Correlation-ID
            request-id-header: X-Request-ID
            tenant-id-header: X-Tenant-ID

# Environment variables
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "local"
  - name: GRIPDAY_CACHE_REDIS_HOST
    value: "gateway-redis"
  - name: GRIPDAY_CACHE_REDIS_PORT
    value: "6379"
  - name: GRIPDAY_CACHE_REDIS_DATABASE
    value: "1"
  - name: GRIPDAY_OBSERVABILITY_TRACING_ENDPOINT
    value: "http://jaeger-collector:14268/api/traces"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector:4317"
  - name: OTEL_SERVICE_NAME
    value: "gripday-gateway-service"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "service.name=gripday-gateway-service,service.version=1.0.0,deployment.environment=local"
  - name: JAVA_OPTS
    value: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

# Secret environment variables
secretEnv:
  - name: GRIPDAY_CACHE_REDIS_PASSWORD
    secretKeyRef:
      name: gateway-service-secrets
      key: GRIPDAY_CACHE_REDIS_PASSWORD
      optional: true
  - name: GRIPDAY_AUTH_JWT_SECRET
    secretKeyRef:
      name: gateway-service-secrets
      key: GRIPDAY_AUTH_JWT_SECRET

# Secrets configuration
secrets:
  enabled: true
  data:
    GRIPDAY_AUTH_JWT_SECRET: bG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tdXNl
    GRIPDAY_CACHE_REDIS_PASSWORD: ""

# Network Policy
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow external traffic (from ingress controller)
    - from:
      - namespaceSelector:
          matchLabels:
            app.kubernetes.io/name: ingress-nginx
      ports:
      - protocol: TCP
        port: 8080
    # Allow traffic from same namespace
    - from:
      - podSelector: {}
      ports:
      - protocol: TCP
        port: 8080
    # Allow traffic from monitoring
    - from:
      - namespaceSelector:
          matchLabels:
            app.kubernetes.io/name: monitoring
        podSelector:
          matchLabels:
            app: prometheus
      ports:
      - protocol: TCP
        port: 8080
  egress:
    # Allow access to auth-service
    - to:
      - namespaceSelector:
          matchLabels:
            app.kubernetes.io/part-of: gripday-platform
        podSelector:
          matchLabels:
            app.kubernetes.io/name: gripday-auth-service
      ports:
      - protocol: TCP
        port: 8081
    # Allow access to bookstore-service
    - to:
      - namespaceSelector:
          matchLabels:
            app.kubernetes.io/part-of: gripday-platform
        podSelector:
          matchLabels:
            app.kubernetes.io/name: gripday-bookstore-service
      ports:
      - protocol: TCP
        port: 8082
    # Allow access to Redis
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: gateway-redis
            app.kubernetes.io/component: cache
      ports:
      - protocol: TCP
        port: 6379
    # Allow DNS resolution
    - to: []
      ports:
      - protocol: UDP
        port: 53
    # Allow access to observability services
    - to:
      - namespaceSelector:
          matchLabels:
            app.kubernetes.io/name: observability
      ports:
      - protocol: TCP
        port: 4317
      - protocol: TCP
        port: 14268
    # Allow HTTPS for external services
    - to: []
      ports:
      - protocol: TCP
        port: 443

# Resource Quota
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "6"
    requests.memory: "12Gi"
    limits.cpu: "12"
    limits.memory: "24Gi"
    requests.storage: "10Gi"
    persistentvolumeclaims: "5"
    pods: "30"
    services: "10"
    configmaps: "10"
    secrets: "10"

# Limit Range
limitRange:
  enabled: true
  limits:
    - type: Container
      max:
        cpu: "2"
        memory: "4Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "1000m"
        memory: "1Gi"
      defaultRequest:
        cpu: "500m"
        memory: "512Mi"
      maxLimitRequestRatio:
        cpu: "4"
        memory: "4"
    - type: Pod
      max:
        cpu: "6"
        memory: "12Gi"
      min:
        cpu: "200m"
        memory: "256Mi"
    - type: PersistentVolumeClaim
      max:
        storage: "5Gi"
      min:
        storage: "500Mi"

# Redis configuration (Gateway only needs Redis, no PostgreSQL)
redis:
  enabled: true
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  priorityClassName: infrastructure-priority
  service:
    type: ClusterIP
    port: 6379
  persistence:
    enabled: true
    storageClass: standard
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  config:
    maxmemory: "512mb"
    maxmemoryPolicy: "allkeys-lru"
    appendonly: "yes"
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"
  livenessProbe:
    enabled: true
    command:
      - redis-cli
      - ping
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    command:
      - redis-cli
      - ping
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  networkPolicy:
    enabled: true
    ingress:
      - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gripday-gateway-service
              app.kubernetes.io/component: gateway
        ports:
        - protocol: TCP
          port: 6379
      - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: monitoring
        ports:
        - protocol: TCP
          port: 6379
