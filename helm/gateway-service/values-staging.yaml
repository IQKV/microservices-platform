# Staging environment values for gateway-service

global:
  environment: staging
  platform: gripday

namespace:
  name: gripday-staging-env
  labels:
    app.kubernetes.io/component: gateway
    environment: staging

replicaCount: 5

image:
  repository: gripday/gateway-service
  pullPolicy: Always
  tag: "staging-latest"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"
  environment: "staging"

priorityClassName: high-priority

ingress:
  enabled: true
  className: nginx
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-staging  # Uncomment if using cert-manager
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # TLS optional - set to "true" if TLS enabled
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://gripday.space, https://*.gripday.space"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
  hosts:
    - host: api.gripday.space
      paths:
        - path: /
          pathType: Prefix
  tls: [] # TLS disabled by default - configure externally if needed
  # Uncomment to enable TLS:
  # tls:
  #   - secretName: gateway-staging-tls
  #     hosts:
  #       - api.gripday.space

resources:
  requests:
    memory: "1Gi"
    cpu: "750m"
  limits:
    memory: "2Gi"
    cpu: "1500m"

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 3

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "staging"
  - name: GRIPDAY_CACHE_REDIS_HOST
    value: "gateway-redis"
  - name: GRIPDAY_CACHE_REDIS_PORT
    value: "6379"
  - name: GRIPDAY_CACHE_REDIS_DATABASE
    value: "1"
  - name: USER_SERVICE_JWK_URI
    value: "http://user-service/.well-known/jwks.json"
  - name: GRIPDAY_GATEWAY_ROUTING_SERVICES_USER_SERVICE_URI
    value: "http://user-service"
  - name: GRIPDAY_GATEWAY_ROUTING_SERVICES_BOOKSTORE_SERVICE_URI
    value: "http://bookstore-service"
  - name: GRIPDAY_GATEWAY_CORS_ALLOWED_ORIGINS
    value: "https://gripday.space,https://*.gripday.space"
  - name: GRIPDAY_OBSERVABILITY_TRACING_ENDPOINT
    value: "http://jaeger-collector.observability:14268/api/traces"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.observability:4317"
  - name: OTEL_SERVICE_NAME
    value: "gripday-gateway-service"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "service.name=gripday-gateway-service,service.version=staging,deployment.environment=staging"
  - name: JAVA_OPTS
    value: "-Xms768m -Xmx1536m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof"

secretEnv:
  - name: GRIPDAY_CACHE_REDIS_PASSWORD
    secretKeyRef:
      name: gateway-service-secrets
      key: GRIPDAY_CACHE_REDIS_PASSWORD
      optional: true
  - name: GRIPDAY_AUTH_JWT_SECRET
    secretKeyRef:
      name: gateway-service-secrets
      key: GRIPDAY_AUTH_JWT_SECRET

secrets:
  enabled: true
  data: {} # Secrets should be managed externally in staging

configMap:
  enabled: true
  data:
    application.yml: |
      spring:
        profiles:
          active: staging

      logging:
        level:
          org.gripday.gateway: INFO
          org.springframework.cloud.gateway: INFO
          org.springframework.security: WARN
          AUDIT: INFO
        pattern:
          console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","thread":"%thread","correlationId":"%X{correlationId}","userId":"%X{userId}","username":"%X{username}","logger":"%logger{36}","message":"%msg"}%n'

redis:
  enabled: true
  image:
    tag: "7.2-alpine"
  replicaCount: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClass: fast-ssd
  config:
    maxmemory: "768mb"
    maxmemoryPolicy: "allkeys-lru"
    appendonly: "yes"
  resources:
    requests:
      memory: "384Mi"
      cpu: "300m"
    limits:
      memory: "768Mi"
      cpu: "600m"

networkPolicy:
  enabled: true

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "12"
    requests.memory: "24Gi"
    limits.cpu: "24"
    limits.memory: "48Gi"
    requests.storage: "20Gi"
    persistentvolumeclaims: "10"
    pods: "40"
    services: "15"
    configmaps: "15"
    secrets: "15"

limitRange:
  enabled: true
