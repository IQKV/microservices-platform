# IQ Scaffold Platform - Umbrella Chart Values

# Global settings applied to all sub-charts
global:
  # Environment: local, staging, test, production
  environment: local

  # Namespace - all services deploy to same environment-specific namespace
  namespace: iqscaffold-dev-env

  # Platform identifier
  platform: iqscaffold

  # Image pull policy
  imagePullPolicy: IfNotPresent

  # Image registry (override for private registries)
  imageRegistry: ""

# User Service
user-service:
  enabled: true
  replicaCount: 2

  image:
    tag: "1.0.0"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  postgresql:
    enabled: true
    persistence:
      size: 5Gi

  redis:
    enabled: true
    persistence:
      size: 1Gi

# Gateway Service
gateway-service:
  enabled: true
  replicaCount: 3

  image:
    tag: "1.0.0"

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  redis:
    enabled: true
    persistence:
      size: 2Gi

  # Service routing configuration
  routing:
    userServiceUrl: "http://user-service.{{ .Values.global.namespace }}.svc.cluster.local:8080"
    billingServiceUrl: "http://billing-service.{{ .Values.global.namespace }}.svc.cluster.local:8082"

# Billing Service
billing-service:
  enabled: true
  replicaCount: 2

  image:
    tag: "1.0.0"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  postgresql:
    enabled: true
    persistence:
      size: 5Gi

  env:
    - name: SPRING_PROFILES_ACTIVE
      value: "production"
    # Service Integration URLs
    - name: IQSCAFFOLD_USER_SERVICE_URL
      value: "http://user-service.{{ .Values.global.namespace }}.svc.cluster.local:80"
    - name: EMAIL_SERVICE_URL
      value: "http://email-service.{{ .Values.global.namespace }}.svc.cluster.local:80"
    # JWT Configuration
    - name: JWT_ISSUER
      value: "iqscaffold-user-service"
    # Payment Configuration
    - name: PAYMENT_PROVIDER
      value: "stripe"
    - name: BILLING_SAAS_MODE
      value: "true"
    # Email Configuration
    - name: EMAIL_FROM_EMAIL
      value: "billing@iqscaffold.com"
    - name: EMAIL_FROM_NAME
      value: "IQ Scaffold Billing"
    - name: APP_BASE_URL
      value: "https://app.iqscaffold.com"
    # Notification Configuration
    - name: BILLING_EMAIL_NOTIFICATIONS
      value: "true"
    - name: BILLING_WEBHOOK_NOTIFICATIONS
      value: "true"

# Observability Stack (Optional)
observability:
  enabled: false

  jaeger:
    enabled: false

  prometheus:
    enabled: false

  grafana:
    enabled: false

# Ingress Configuration
ingress:
  enabled: true
  className: nginx

  # TLS configuration
  tls:
    enabled: false
    secretName: iqscaffold-tls

  # Hosts configuration
  hosts:
    gateway: api.iqscaffold.site
    user: user.iqscaffold.site
    billing: billing.iqscaffold.site

# Priority Classes
priorityClasses:
  high: high-priority
  medium: medium-priority
  infrastructure: infrastructure-priority
