# IQ Scaffold Platform - Staging Environment Values

global:
  environment: staging
  namespace: iqscaffold-staging-env
  imagePullPolicy: Always

user-service:
  replicaCount: 3

  image:
    tag: "staging"

  autoscaling:
    minReplicas: 3
    maxReplicas: 15

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  postgresql:
    persistence:
      size: 10Gi
      storageClass: fast-ssd

  redis:
    persistence:
      size: 2Gi

gateway-service:
  replicaCount: 5

  image:
    tag: "staging"

  autoscaling:
    minReplicas: 5
    maxReplicas: 20

  resources:
    requests:
      memory: "1Gi"
      cpu: "1000m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

  redis:
    persistence:
      size: 5Gi

billing-service:
  replicaCount: 3

  image:
    tag: "staging"

  autoscaling:
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  postgresql:
    persistence:
      size: 10Gi
      storageClass: fast-ssd

  env:
    - name: SPRING_PROFILES_ACTIVE
      value: "staging"
    # Service Integration URLs
    - name: IQSCAFFOLD_USER_SERVICE_URL
      value: "http://user-service.iqscaffold-staging-env.svc.cluster.local:80"
    - name: EMAIL_SERVICE_URL
      value: "http://email-service.iqscaffold-staging-env.svc.cluster.local:80"
    # Email Configuration
    - name: EMAIL_FROM_EMAIL
      value: "billing@staging.iqscaffold.com"
    - name: EMAIL_FROM_NAME
      value: "IQ Scaffold Billing (Staging)"
    - name: APP_BASE_URL
      value: "https://app-staging.iqscaffold.com"

ingress:
  tls:
    enabled: true
  hosts:
    gateway: api-staging.iqscaffold.com
    user: user-staging.iqscaffold.com
    billing: billing-staging.iqscaffold.com

observability:
  enabled: true
  jaeger:
    enabled: true
  prometheus:
    enabled: true
