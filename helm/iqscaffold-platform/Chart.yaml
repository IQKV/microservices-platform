apiVersion: v2
name: iqscaffold
description: Umbrella Helm chart for the complete IQ Scaffold Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - microservices
  - platform
  - iqscaffold
maintainers:
  - name: IQ Scaffold Platform Team
home: https://iqscaffold.site
sources:
  - https://github.com/iqscaffold/platform
dependencies:
  - name: user-service
    version: "1.0.0"
    repository: "file://../user-service"
    condition: user-service.enabled
  - name: bookstore-service
    version: "1.0.0"
    repository: "file://../bookstore-service"
    condition: bookstore-service.enabled
  - name: gateway-service
    version: "1.0.0"
    repository: "file://../gateway-service"
    condition: gateway-service.enabled
