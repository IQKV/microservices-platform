apiVersion: v2
name: gripday-platform
description: Umbrella Helm chart for the complete Gripday Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - microservices
  - platform
  - gripday
maintainers:
  - name: Gripday Platform Team
home: https://pynity.site
sources:
  - https://github.com/gripday/platform
dependencies:
  - name: auth-service
    version: "1.0.0"
    repository: "file://../auth-service"
    condition: auth-service.enabled
  - name: bookstore-service
    version: "1.0.0"
    repository: "file://../bookstore-service"
    condition: bookstore-service.enabled
  - name: gateway-service
    version: "1.0.0"
    repository: "file://../gateway-service"
    condition: gateway-service.enabled
