version: '3.8'

services:
  # PostgreSQL Database for Auth Service only
  postgres-auth:
    image: postgres:15-alpine
    container_name: gripday-auth-postgres
    environment:
      POSTGRES_DB: gripday_auth
      POSTGRES_USER: gripday_user
      POSTGRES_PASSWORD: gripday_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ../docker/postgres/init-auth.sql:/docker-entrypoint-initdb.d/init-auth.sql
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gripday_user -d gripday_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis for Auth Service
  redis-auth:
    image: redis:7-alpine
    container_name: gripday-auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_auth_data:/data
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: redis-server --appendonly yes

  # Auth Service
  auth-service:
    build:
      context: ..
      dockerfile: gripday-auth-service/Dockerfile
    container_name: gripday-auth-service-standalone
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/gripday_auth
      SPRING_DATASOURCE_USERNAME: gripday_user
      SPRING_DATASOURCE_PASSWORD: gripday_password
      SPRING_DATA_REDIS_HOST: redis-auth
      SPRING_DATA_REDIS_PORT: 6379
      GRIPDAY_AUTH_JWT_SECRET: your-256-bit-secret-key-here-change-in-production
      GRIPDAY_AUTH_JWT_EXPIRATION: 900
      GRIPDAY_AUTH_JWT_REFRESH_EXPIRATION: 604800
    ports:
      - "8081:8081"
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  auth-network:
    driver: bridge
    name: gripday-auth-network

volumes:
  postgres_auth_data:
    name: gripday_auth_postgres_data
  redis_auth_data:
    name: gripday_auth_redis_data