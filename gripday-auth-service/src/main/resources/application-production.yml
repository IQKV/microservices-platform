# Production Environment Configuration
# This configuration is optimized for production with minimal logging and maximum security

server:
  port: 8081

spring:
  # Database Configuration - Production PostgreSQL
  datasource:
    url: ${GRIPDAY_DATABASE_URL}
    username: ${GRIPDAY_DATABASE_USERNAME}
    password: ${GRIPDAY_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  # JPA Configuration - Production Settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        generate_statistics: false
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  # Redis Configuration - Production Redis
  data:
    redis:
      host: ${GRIPDAY_CACHE_REDIS_HOST}
      port: ${GRIPDAY_CACHE_REDIS_PORT:6379}
      password: ${GRIPDAY_CACHE_REDIS_PASSWORD}
      database: ${GRIPDAY_CACHE_REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: -1ms

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    contexts: production

# Gripday Configuration - Production Environment
gripday:
  # Database Configuration
  database:
    url: ${GRIPDAY_DATABASE_URL}
    username: ${GRIPDAY_DATABASE_USERNAME}
    password: ${GRIPDAY_DATABASE_PASSWORD}
    pool:
      maximum-size: 50
      minimum-idle: 10
      connection-timeout: PT20S
      idle-timeout: PT5M
      max-lifetime: PT20M
    migration:
      enabled: true
      contexts: production
      validate-on-migrate: true

  # Cache Configuration - Redis
  cache:
    redis:
      host: ${GRIPDAY_CACHE_REDIS_HOST}
      port: ${GRIPDAY_CACHE_REDIS_PORT:6379}
      password: ${GRIPDAY_CACHE_REDIS_PASSWORD}
      database: ${GRIPDAY_CACHE_REDIS_DATABASE:0}
      timeout: PT2S
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 4
        max-wait: PT-1S
      key-prefix: "gripday:auth:production"
      default-ttl: PT15M
      enable-statistics: false

  # Authentication Configuration
  auth:
    jwt:
      secret-key: ${GRIPDAY_AUTH_JWT_SECRET}
      access-token-expiry: PT15M
      refresh-token-expiry: P7D
      issuer: gripday-auth-service
      audience: gripday-services
      algorithm: HS256

  # Email Configuration - Production Environment
  email:
    smtp:
      host: ${SMTP_HOST}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
      auth: true
      starttls: true
      timeout: PT30S
    verification:
      from-email: ${VERIFICATION_FROM_EMAIL:noreply@pynity.com}
      from-name: ${VERIFICATION_FROM_NAME:Gripday Platform}
      base-url: ${VERIFICATION_BASE_URL:https://app.pynity.com}
      token-expiry: PT24H
      rate-limit: 3
    templates:
      verification-subject: "Verify your Gripday account"
      verification-template: "email/verification.html"
      password-reset-subject: "Reset your Gripday password"
      password-reset-template: "email/password-reset.html"
    security:
      password:
        encoder-strength: 14
        require-special-chars: true
        min-length: 12
      rate-limiting:
        login-attempts: 3
        lockout-duration: PT30M
      session:
        timeout: PT2H
        concurrent-sessions: 2
    oauth2:
      enabled: false
      providers: {}

  # Observability Configuration - Production
  observability:
    tracing:
      enabled: true
      service-name: ${spring.application.name}
      sampling-rate: 0.01  # Minimal sampling for production
      endpoint: ${GRIPDAY_OBSERVABILITY_TRACING_ENDPOINT}
      timeout: PT10S
      export-timeout: PT30S
      batch-size: 1024
    metrics:
      enabled: true
      path: /actuator/prometheus
      prefix: gripday_auth
      include-host-tag: true
      include-application-tag: true
      include-environment-tag: true
      custom-tags:
        environment: production
        service: auth-service
    logging:
      level: WARN
      format: json  # JSON format for production
      include-correlation-id: true
      include-trace-id: true
      include-span-id: true
      include-user-id: false  # Disabled for privacy in production
      include-tenant-id: true
      correlation-id-header: X-Correlation-ID
      request-id-header: X-Request-ID
      tenant-id-header: X-Tenant-ID
      enable-sql-logging: false
      enable-security-events: true
      enable-performance-logging: false

# Logging Configuration - Production
logging:
  level:
    org.gripday: WARN
    org.springframework.security: ERROR
    org.springframework.web: ERROR
    org.hibernate.SQL: ERROR
    liquibase: WARN
    com.zaxxer.hikari: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"

# Management Configuration - Production
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 0.01  # Minimal sampling for production

# SpringDoc Configuration - Production
springdoc:
  api-docs:
    enabled: false  # Disabled in production
  swagger-ui:
    enabled: false  # Disabled in production