# Production Environment Configuration
# This configuration is optimized for production with minimal logging and maximum security

server:
  port: 8081

spring:
  # Database Configuration - Production PostgreSQL
  datasource:
    url: ${GRIPDAY_DATABASE_URL}
    username: ${GRIPDAY_DATABASE_USERNAME}
    password: ${GRIPDAY_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 0  # Disabled in production

  # JPA Configuration - Production Settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        generate_statistics: false
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  # Redis Configuration - Production Redis
  data:
    redis:
      host: ${GRIPDAY_CACHE_REDIS_HOST}
      port: ${GRIPDAY_CACHE_REDIS_PORT:6379}
      password: ${GRIPDAY_CACHE_REDIS_PASSWORD}
      database: ${GRIPDAY_CACHE_REDIS_DATABASE:2}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 10000ms

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    contexts: production

# Gripday Configuration - Production Environment
gripday:
  # Database Configuration
  database:
    url: ${GRIPDAY_DATABASE_URL}
    username: ${GRIPDAY_DATABASE_USERNAME}
    password: ${GRIPDAY_DATABASE_PASSWORD}
    pool:
      maximum-size: 50
      minimum-idle: 10
      connection-timeout: PT30S
      idle-timeout: PT10M
      max-lifetime: PT30M
    migration:
      enabled: true
      contexts: production
      validate-on-migrate: true

  # Cache Configuration - Redis
  cache:
    redis:
      host: ${GRIPDAY_CACHE_REDIS_HOST}
      port: ${GRIPDAY_CACHE_REDIS_PORT:6379}
      password: ${GRIPDAY_CACHE_REDIS_PASSWORD}
      database: ${GRIPDAY_CACHE_REDIS_DATABASE:2}
      timeout: PT5S
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 4
        max-wait: PT10S
      key-prefix: "gripday:auth:production"
      default-ttl: PT15M
      enable-statistics: false  # Disabled for performance

  # Authentication Configuration
  auth:
    jwt:
      secret-key: ${GRIPDAY_AUTH_JWT_SECRET}
      access-token-expiry: PT15M
      refresh-token-expiry: P7D
      issuer: gripday-auth-service
      audience: gripday-services
      algorithm: RS256
    security:
      password:
        encoder-strength: 14  # Maximum security
        require-special-chars: true
        min-length: 12
      rate-limiting:
        login-attempts: 3  # Strict rate limiting
        lockout-duration: PT30M
      session:
        timeout: PT2H  # Shorter sessions for security
        concurrent-sessions: 2
    oauth2:
      enabled: true
      providers:
        google:
          client-id: ${GRIPDAY_AUTH_OAUTH2_GOOGLE_CLIENT_ID}
          client-secret: ${GRIPDAY_AUTH_OAUTH2_GOOGLE_CLIENT_SECRET}
          enabled: ${GRIPDAY_AUTH_OAUTH2_GOOGLE_ENABLED:false}

  # Observability Configuration - Production
  observability:
    tracing:
      enabled: true
      service-name: ${spring.application.name}
      sampling-rate: 0.01  # 1% sampling for production
      endpoint: ${GRIPDAY_OBSERVABILITY_TRACING_ENDPOINT}
      timeout: PT5S
      export-timeout: PT15S
      batch-size: 2048
    metrics:
      enabled: true
      path: /actuator/prometheus
      prefix: gripday_auth
      include-host-tag: false  # Reduced for security
      include-application-tag: true
      include-environment-tag: true
      custom-tags:
        environment: production
        service: auth-service
    logging:
      level: WARN  # Minimal logging for production
      format: json  # Structured logging for production
      include-correlation-id: true
      include-trace-id: true
      include-span-id: true
      include-user-id: false  # Disabled for privacy
      include-tenant-id: true
      correlation-id-header: X-Correlation-ID
      request-id-header: X-Request-ID
      tenant-id-header: X-Tenant-ID
      enable-sql-logging: false
      enable-security-events: true
      enable-performance-logging: false

# Logging Configuration - Production
logging:
  level:
    org.gripday: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: ERROR
    liquibase: WARN
    com.zaxxer.hikari: WARN
    root: WARN
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%-5level","thread":"%thread","logger":"%logger{36}","correlationId":"%X{correlationId:-}","traceId":"%X{traceId:-}","spanId":"%X{spanId:-}","message":"%msg"}%n'

# Management Configuration - Production
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus  # Minimal exposure for security
  endpoint:
    health:
      show-details: never  # Security: never show details
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 0.01

# SpringDoc Configuration - Production
springdoc:
  api-docs:
    enabled: false  # Disabled for production security
  swagger-ui:
    enabled: false  # Disabled for production security