server:
  port: 8081

spring:
  application:
    name: gripday-auth-service
  profiles:
    active: local
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,liquibase,openapi
  endpoint:
    health:
      show-details: when-authorized
    liquibase:
      enabled: true

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
    groups:
      enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    groups-order: ASC
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    display-operation-id: true
    show-extensions: true
    show-common-extensions: true
  group-configs:
    - group: authentication
      display-name: Authentication APIs
      paths-to-match: /api/*/auth/**
    - group: user-management
      display-name: User Management APIs
      paths-to-match: /api/*/users/**
    - group: tenant-management
      display-name: Tenant Management APIs
      paths-to-match: /api/*/tenants/**
  show-actuator: true
  use-management-port: false

# Gripday-specific configuration properties
gripday:
  auth:
    jwt:
      access-token-expiry: PT15M  # 15 minutes
      refresh-token-expiry: P7D   # 7 days
      issuer: gripday-auth-service
  observability:
    tracing:
      enabled: true
      service-name: ${spring.application.name}
    metrics:
      enabled: true
      path: /actuator/prometheus
    logging:
      include-correlation-id: true