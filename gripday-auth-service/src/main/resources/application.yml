server:
  port: 8080

spring:
  application:
    name: gripday-auth-service
  profiles:
    active: local
  
  # Internationalization Configuration
  messages:
    basename: i18n/messages
    encoding: UTF-8
    cache-duration: PT1H
    fallback-to-system-locale: false
    use-code-as-default-message: true
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
    groups:
      enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    groups-order: ASC
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    display-operation-id: true
    show-extensions: true
    show-common-extensions: true
  group-configs:
    - group: authentication
      display-name: Authentication APIs
      paths-to-match: /api/*/auth/**
    - group: user-management
      display-name: User Management APIs
      paths-to-match: /api/*/users/**
    - group: tenant-management
      display-name: Tenant Management APIs
      paths-to-match: /api/*/tenants/**
  show-actuator: true
  use-management-port: false

# OpenTelemetry Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,liquibase,openapi
  endpoint:
    health:
      show-details: when-authorized
    liquibase:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true

# Gripday-specific configuration properties
gripday:
  auth:
    jwt:
      access-token-expiry: PT15M  # 15 minutes
      refresh-token-expiry: P7D   # 7 days
      issuer: gripday-auth-service
  email:
    smtp:
      host: ${SMTP_HOST:localhost}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      auth: true
      starttls: true
      timeout: PT30S
    sender:
      from-email: ${EMAIL_FROM_EMAIL:noreply@gripday.com}
      from-name: ${EMAIL_FROM_NAME:Gripday Platform}
      base-url: ${APP_BASE_URL:https://app.gripday.com}
    verification:
      token-expiry: PT24H  # 24 hours
      rate-limit: 3  # emails per hour per user
    templates:
      verification-subject: "Verify your Gripday account"
      verification-template: "email/user-registration/email-verification.html"
      password-reset-subject: "Reset your Gripday password"
      password-reset-template: "email/password-reset/initiate.html"
      password-reset-confirmed-subject: "Password Reset Successful - Gripday"
      password-reset-confirmed-template: "email/password-reset/confirmed.html"
      registration-confirmed-subject: "Welcome to Gripday - Email Verified!"
      registration-confirmed-template: "email/user-registration/email-confirmed.html"
  observability:
    tracing:
      enabled: true
      service-name: ${spring.application.name}
      sampling-rate: 1.0
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      timeout: PT10S
    metrics:
      enabled: true
      path: /actuator/prometheus
      prefix: gripday_auth
      include-host-tag: true
      include-application-tag: true
    logging:
      include-correlation-id: true
      include-trace-id: true
      include-span-id: true
      include-user-id: true
      include-tenant-id: true
      correlation-id-header: X-Correlation-ID
      request-id-header: X-Request-ID
      tenant-id-header: X-Tenant-ID
