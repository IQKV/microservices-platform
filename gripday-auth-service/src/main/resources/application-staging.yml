# Staging Environment Configuration
# This configuration is optimized for staging with moderate logging and security

server:
  port: 8080

spring:
  # Database Configuration - Staging PostgreSQL
  datasource:
    url: ${GRIPDAY_DATABASE_URL:jdbc:postgresql://postgres-staging:5432/gripday_auth_staging}
    username: ${GRIPDAY_DATABASE_USERNAME:gripday_user}
    password: ${GRIPDAY_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  # JPA Configuration - Staging Settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        generate_statistics: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Redis Configuration - Staging Redis
  data:
    redis:
      host: ${GRIPDAY_CACHE_REDIS_HOST:redis-staging}
      port: ${GRIPDAY_CACHE_REDIS_PORT:6379}
      password: ${GRIPDAY_CACHE_REDIS_PASSWORD}
      database: ${GRIPDAY_CACHE_REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    contexts: staging

# Gripday Configuration - Staging Environment
gripday:
  # Database Configuration
  database:
    url: ${GRIPDAY_DATABASE_URL:jdbc:postgresql://postgres-staging:5432/gripday_auth_staging}
    username: ${GRIPDAY_DATABASE_USERNAME:gripday_user}
    password: ${GRIPDAY_DATABASE_PASSWORD}
    pool:
      maximum-size: 20
      minimum-idle: 5
      connection-timeout: PT20S
      idle-timeout: PT5M
      max-lifetime: PT20M
    migration:
      enabled: true
      contexts: staging
      validate-on-migrate: true

  # Cache Configuration - Redis
  cache:
    redis:
      host: ${GRIPDAY_CACHE_REDIS_HOST:redis-staging}
      port: ${GRIPDAY_CACHE_REDIS_PORT:6379}
      password: ${GRIPDAY_CACHE_REDIS_PASSWORD}
      database: ${GRIPDAY_CACHE_REDIS_DATABASE:0}
      timeout: PT2S
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: PT-1S
      key-prefix: "gripday:auth:staging"
      default-ttl: PT30M
      enable-statistics: false

  # Authentication Configuration
  auth:
    jwt:
      secret-key: ${GRIPDAY_AUTH_JWT_SECRET}
      access-token-expiry: PT15M
      refresh-token-expiry: P7D
      issuer: gripday-auth-service-staging
      audience: gripday-services-staging
      algorithm: HS256

  # Email Configuration - Staging Environment
  email:
    smtp:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
      auth: true
      starttls: true
      timeout: PT30S
    verification:
      from-email: ${VERIFICATION_FROM_EMAIL:noreply@gripday.website}
      from-name: ${VERIFICATION_FROM_NAME:Gripday Platform (Staging)}
      base-url: ${VERIFICATION_BASE_URL:https://gripday.website}
      token-expiry: PT24H
      rate-limit: 3
    templates:
      verification-subject: "[STAGING] Verify your Gripday account"
      verification-template: "email/verification.html"
      password-reset-subject: "[STAGING] Reset your Gripday password"
      password-reset-template: "email/password-reset.html"
    security:
      password:
        encoder-strength: 12
        require-special-chars: true
        min-length: 8
      rate-limiting:
        login-attempts: 5
        lockout-duration: PT15M
      session:
        timeout: PT4H
        concurrent-sessions: 3
    oauth2:
      enabled: false
      providers: { }

  # Observability Configuration - Staging
  observability:
    tracing:
      enabled: true
      service-name: ${spring.application.name}
      sampling-rate: 0.1  # Reduced sampling for staging
      endpoint: ${GRIPDAY_OBSERVABILITY_TRACING_ENDPOINT:http://otel-collector:4317}
      timeout: PT10S
      export-timeout: PT30S
      batch-size: 512
    metrics:
      enabled: true
      path: /actuator/prometheus
      prefix: gripday_auth_staging
      include-host-tag: true
      include-application-tag: true
      include-environment-tag: true
      custom-tags:
        environment: staging
        service: auth-service
    logging:
      level: INFO
      format: json  # JSON format for staging
      include-correlation-id: true
      include-trace-id: true
      include-span-id: true
      include-user-id: true
      include-tenant-id: true
      correlation-id-header: X-Correlation-ID
      request-id-header: X-Request-ID
      tenant-id-header: X-Tenant-ID
      enable-sql-logging: false
      enable-security-events: true
      enable-performance-logging: false

# Logging Configuration - Staging
logging:
  level:
    org.gripday: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    liquibase: INFO
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"

# Management Configuration - Staging
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      access: read_only
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 0.1  # Reduced sampling for staging
  prometheus:
    metrics:
      export:
        enabled: true

# SpringDoc Configuration - Staging
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    try-it-out-enabled: false