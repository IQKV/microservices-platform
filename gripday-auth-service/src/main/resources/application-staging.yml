# Staging environment configuration
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/gripday_auth_staging}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.gripday.authservice: INFO
    org.springframework.security: INFO
    org.hibernate: WARN
    org.liquibase: INFO

management:
  tracing:
    sampling:
      probability: 0.1

gripday:
  auth:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
  observability:
    tracing:
      enabled: true
      sampling-rate: 0.1
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4317}
    metrics:
      enabled: true
    logging:
      include-correlation-id: true
      include-trace-id: true
      include-span-id: true
      include-user-id: true
      include-tenant-id: true