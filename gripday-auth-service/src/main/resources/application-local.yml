# Local development configuration
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gripday_auth_local
    username: ${DB_USERNAME:gripday_user}
    password: ${DB_PASSWORD:gripday_pass}
    driver-class-name: org.postgresql.Driver
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.gripday.authservice: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  tracing:
    sampling:
      probability: 1.0

gripday:
  auth:
    jwt:
      secret-key: ${JWT_SECRET_KEY:local-development-secret-key-change-in-production}
  observability:
    tracing:
      enabled: true
      sampling-rate: 1.0
      endpoint: http://localhost:4317
    metrics:
      enabled: true
    logging:
      include-correlation-id: true
      include-trace-id: true
      include-span-id: true