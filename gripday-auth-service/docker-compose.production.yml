version: '3.8'

services:
  # PostgreSQL Database for Auth Service - Production Environment
  postgres-auth:
    image: postgres:15-alpine
    container_name: gripday-auth-postgres-production
    environment:
      POSTGRES_DB: ${GRIPDAY_DATABASE_NAME:-gripday_auth}
      POSTGRES_USER: ${GRIPDAY_DATABASE_USERNAME:-gripday_user}
      POSTGRES_PASSWORD: ${GRIPDAY_DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_auth_data_production:/var/lib/postgresql/data
      - ./scripts/init-auth-db.sql:/docker-entrypoint-initdb.d/01-init-auth-db.sql:ro
      - ./scripts/init-auth-schema.sql:/docker-entrypoint-initdb.d/02-init-auth-schema.sql:ro
      - ./scripts/postgres-production.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - auth-network-production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GRIPDAY_DATABASE_USERNAME:-gripday_user} -d ${GRIPDAY_DATABASE_NAME:-gripday_auth} -h localhost"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service=postgres-auth,environment=production"
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c shared_preload_libraries=pg_stat_statements,pg_buffercache
      -c pg_stat_statements.track=all
      -c max_connections=300
      -c shared_buffers=1GB
      -c effective_cache_size=4GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c min_wal_size=4GB
      -c max_wal_size=16GB
      -c log_statement=ddl
      -c log_duration=on
      -c log_min_duration_statement=5000
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
        reservations:
          cpus: '2.0'
          memory: 3G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # Redis for Auth Service - Production Environment
  redis-auth:
    image: redis:7-alpine
    container_name: gripday-auth-redis-production
    environment:
      REDIS_PASSWORD: ${GRIPDAY_CACHE_REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_auth_data_production:/data
      - ./scripts/redis-production.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - auth-network-production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${GRIPDAY_CACHE_REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service=redis-auth,environment=production"
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${GRIPDAY_CACHE_REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-keepalive 300
      --timeout 0
      --tcp-backlog 511
      --databases 16
      --stop-writes-on-bgsave-error yes
      --rdbcompression yes
      --rdbchecksum yes
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '1.0'
          memory: 1.5G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # Auth Service - Production Environment
  auth-service:
    build:
      context: ..
      dockerfile: gripday-auth-service/Dockerfile
    image: gripday/auth-service:production
    container_name: gripday-auth-service-production
    env_file:
      - .env.production
    environment:
      # Spring Configuration
      SPRING_PROFILES_ACTIVE: production
      SPRING_APPLICATION_NAME: gripday-auth-service
      
      # Database Configuration
      GRIPDAY_DATABASE_URL: jdbc:postgresql://postgres-auth:5432/${GRIPDAY_DATABASE_NAME:-gripday_auth}
      GRIPDAY_DATABASE_USERNAME: ${GRIPDAY_DATABASE_USERNAME:-gripday_user}
      GRIPDAY_DATABASE_PASSWORD: ${GRIPDAY_DATABASE_PASSWORD}
      GRIPDAY_DATABASE_DRIVER_CLASS_NAME: org.postgresql.Driver
      GRIPDAY_DATABASE_JPA_HIBERNATE_DDL_AUTO: validate
      GRIPDAY_DATABASE_JPA_SHOW_SQL: false
      
      # Redis Configuration
      GRIPDAY_CACHE_REDIS_HOST: redis-auth
      GRIPDAY_CACHE_REDIS_PORT: 6379
      GRIPDAY_CACHE_REDIS_PASSWORD: ${GRIPDAY_CACHE_REDIS_PASSWORD}
      GRIPDAY_CACHE_REDIS_TIMEOUT: 5000ms
      GRIPDAY_CACHE_REDIS_DATABASE: 0
      
      # JWT Configuration
      GRIPDAY_AUTH_JWT_SECRET: ${GRIPDAY_AUTH_JWT_SECRET}
      GRIPDAY_AUTH_JWT_EXPIRATION: ${GRIPDAY_AUTH_JWT_EXPIRATION:-900}
      GRIPDAY_AUTH_JWT_REFRESH_EXPIRATION: ${GRIPDAY_AUTH_JWT_REFRESH_EXPIRATION:-604800}
      GRIPDAY_AUTH_JWT_ISSUER: gripday-auth-service
      
      # Security Configuration
      GRIPDAY_AUTH_RATE_LIMIT_ENABLED: true
      GRIPDAY_AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE: ${GRIPDAY_AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE:-200}
      GRIPDAY_AUTH_ACCOUNT_LOCKOUT_ENABLED: true
      GRIPDAY_AUTH_ACCOUNT_LOCKOUT_MAX_ATTEMPTS: ${GRIPDAY_AUTH_ACCOUNT_LOCKOUT_MAX_ATTEMPTS:-3}
      GRIPDAY_AUTH_ACCOUNT_LOCKOUT_DURATION: ${GRIPDAY_AUTH_ACCOUNT_LOCKOUT_DURATION:-1800}
      
      # Observability Configuration
      GRIPDAY_OBSERVABILITY_TRACING_ENABLED: true
      GRIPDAY_OBSERVABILITY_METRICS_ENABLED: true
      GRIPDAY_OBSERVABILITY_LOGGING_LEVEL: WARN
      
      # JVM Configuration for production
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -XX:+OptimizeStringConcat
        -XX:+UseCompressedOops
        -XX:+UseCompressedClassPointers
        -XX:+UnlockExperimentalVMOptions
        -XX:+UseCGroupMemoryLimitForHeap
        -XX:+PrintGCDetails
        -XX:+PrintGCTimeStamps
        -XX:+PrintGCApplicationStoppedTime
        -Xloggc:/app/logs/gc.log
        -XX:+UseGCLogFileRotation
        -XX:NumberOfGCLogFiles=5
        -XX:GCLogFileSize=10M
        -Djava.security.egd=file:/dev/./urandom
        -Dspring.profiles.active=production
        -Dlogging.level.org.gripday=WARN
        -Dlogging.config=classpath:logback-spring.xml
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=9999
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
      - "${JMX_PORT:-9999}:9999"  # JMX monitoring port
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
    networks:
      - auth-network-production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
        labels: "service=auth-service,environment=production"
    volumes:
      - auth_logs_production:/app/logs
      - auth_tmp_production:/app/tmp
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

networks:
  auth-network-production:
    driver: bridge
    name: gripday-auth-network-production
    ipam:
      config:
        - subnet: 172.22.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-auth-production
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

volumes:
  postgres_auth_data_production:
    name: gripday_auth_postgres_data_production
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/opt/gripday/data}/postgres-production
  redis_auth_data_production:
    name: gripday_auth_redis_data_production
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/opt/gripday/data}/redis-production
  auth_logs_production:
    name: gripday_auth_logs_production
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_PATH:-/opt/gripday/logs}/auth-production
  auth_tmp_production:
    name: gripday_auth_tmp_production
    driver: local