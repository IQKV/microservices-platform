version : "3.8"

services :
  bookstore-service :
    build :
      context : .
      dockerfile : Dockerfile
    container_name : bookstore-service-prod
    ports :
      - "8080:8080"
    environment :
      # Spring Configuration
      SPRING_PROFILES_ACTIVE : production
      SPRING_APPLICATION_NAME : iqscaffold-bookstore-service

      # Database Configuration
      IQSCAFFOLD_DATABASE_URL : jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/iqscaffold_bookstore_production
      IQSCAFFOLD_DATABASE_USERNAME : ${DB_USERNAME}
      IQSCAFFOLD_DATABASE_PASSWORD : ${DB_PASSWORD}

      # Redis Configuration
      IQSCAFFOLD_CACHE_REDIS_HOST : ${REDIS_HOST}
      IQSCAFFOLD_CACHE_REDIS_PORT : ${REDIS_PORT:-6379}
      IQSCAFFOLD_CACHE_REDIS_PASSWORD : ${REDIS_PASSWORD}
      IQSCAFFOLD_CACHE_REDIS_DATABASE : 0

      # JWT Configuration
      USER_SERVICE_JWK_URI : ${USER_SERVICE_JWK_URI}

      # Observability Configuration
      IQSCAFFOLD_OBSERVABILITY_TRACING_ENABLED : true
      IQSCAFFOLD_OBSERVABILITY_TRACING_SAMPLING_RATE : 0.1
      OTEL_EXPORTER_OTLP_ENDPOINT : http://otel-collector.observability:4317
      OTEL_SERVICE_NAME : iqscaffold-bookstore-service
      OTEL_RESOURCE_ATTRIBUTES : service.name=iqscaffold-bookstore-service,service.version=1.0.0,deployment.environment=production

      # JVM Configuration
      JAVA_OPTS : >-
        -Xms512m
        -Xmx1024m
        -XX:+UseG1GC
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
        -XX:+UseStringDeduplication
        -XX:+ParallelRefProcEnabled
        -Djava.security.egd=file:/dev/./urandom
    networks :
      - iqscaffold-production-network
    restart : unless-stopped
    deploy :
      resources :
        limits :
          memory : 3G
          cpus : "2.0"
        reservations :
          memory : 1G
          cpus : "1.0"
      replicas : 2
      update_config :
        parallelism : 1
        delay : 30s
        order : start-first
      restart_policy :
        condition : on-failure
        delay : 5s
        max_attempts : 3
    healthcheck :
      test : [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval : 30s
      timeout : 10s
      retries : 3
      start_period : 120s
    logging :
      driver : "json-file"
      options :
        max-size : "100m"
        max-file : "10"
        labels : "service=bookstore,environment=production"
    volumes :
      - bookstore_production_logs:/app/logs

volumes :
  bookstore_production_logs :

networks :
  iqscaffold-production-network :
    external : true
