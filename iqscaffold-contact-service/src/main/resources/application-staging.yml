spring:
  datasource:
    url: ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://staging-db:5432/iqscaffold_contact_staging}
    username: ${IQSCAFFOLD_DATABASE_USERNAME:iqscaffold_contact}
    password: ${IQSCAFFOLD_DATABASE_PASSWORD}
    hikari:
      pool-name: ContactServiceHikariPool-Staging
      maximum-pool-size: 15
      minimum-idle: 3

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.iqscaffold.contactservice: INFO
    org.hibernate.SQL: WARN

# Staging environment overrides for IQ Scaffold properties
iqscaffold:
  crm:
    contact:
      enable-lead-scoring: true
      enable-activity-tracking: true
      enable-email-integration: true
    company:
      enable-company-hierarchy: true
      enable-company-scoring: true
    activity:
      enable-auto-logging: true
      retention-days: 180