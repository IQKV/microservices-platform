spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/contact_db
    username: ${DB_USERNAME:contact_user}
    password: ${DB_PASSWORD:contact_pass}
    hikari:
      pool-name: ContactServiceHikariPool-Local
      leak-detection-threshold: 60000

  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG

# Local development overrides for IQ Scaffold properties
iqscaffold:
  crm:
    contact:
      enable-lead-scoring: true
      enable-activity-tracking: true
      enable-email-integration: false  # Disabled for local dev
    company:
      enable-company-hierarchy: true
      enable-company-scoring: false  # Disabled for local dev
    activity:
      enable-auto-logging: true
      retention-days: 30  # Shorter retention for local dev