services:
  # PostgreSQL Database for Contact Service - Local Development
  postgres-contact:
    image: postgres:15.8-alpine
    container_name: iqscaffold-contact-postgres-dev
    environment:
      POSTGRES_DB: iqscaffold_contact_local
      POSTGRES_USER: iqscaffold_contact
      POSTGRES_PASSWORD: iqscaffold_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - postgres_contact_data:/var/lib/postgresql/data
    networks:
      - contact-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iqscaffold_contact -d iqscaffold_contact_local -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # Redis for Contact Service - Local Development
  redis-contact:
    image: redis:7.2-alpine
    container_name: iqscaffold-contact-redis-dev
    ports:
      - "6381:6379"
    volumes:
      - redis_contact_data:/data
    networks:
      - contact-service-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

  # RabbitMQ for Contact Service - Local Development
  rabbitmq-contact:
    image: rabbitmq:3.13-management-alpine
    container_name: iqscaffold-contact-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: iqscaffold
      RABBITMQ_DEFAULT_PASS: iqscaffold_password
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit log_levels [{connection,error},{default,info}] disk_free_limit 2147483648
    ports:
      - "5673:5672" # AMQP port
      - "15673:15672" # Management UI
    volumes:
      - rabbitmq_contact_data:/var/lib/rabbitmq
    networks:
      - contact-service-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Contact Service - Local Development
  contact-service:
    build:
      context: ..
      dockerfile: iqscaffold-contact-service/Dockerfile
      target: builder
    image: iqscaffold/iqscaffold-contact-service:dev
    container_name: iqscaffold-contact-service-dev
    environment:
      # Spring Configuration
      SPRING_PROFILES_ACTIVE: local
      SPRING_APPLICATION_NAME: iqscaffold-contact-service

      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-contact:5432/iqscaffold_contact_local
      SPRING_DATASOURCE_USERNAME: iqscaffold_contact
      SPRING_DATASOURCE_PASSWORD: iqscaffold_password

      # RabbitMQ Configuration
      SPRING_RABBITMQ_HOST: rabbitmq-contact
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: iqscaffold
      SPRING_RABBITMQ_PASSWORD: iqscaffold_password
      SPRING_RABBITMQ_VIRTUAL_HOST: /

      # JWT Configuration
      USER_SERVICE_URL: http://host.docker.internal:8081
      JWT_ISSUER: iqscaffold-user-service

      # Multi-tenancy Configuration
      IQSCAFFOLD_TENANT_ID_HEADER: X-Tenant-ID

      # Observability Configuration
      IQSCAFFOLD_OBSERVABILITY_TRACING_ENABLED: true
      IQSCAFFOLD_OBSERVABILITY_TRACING_SAMPLING_RATE: 1.0
      IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: iqscaffold-contact-service
      OTEL_RESOURCE_ATTRIBUTES: service.name=iqscaffold-contact-service,service.version=1.0.0,deployment.environment=dev

      # JVM Configuration
      JAVA_OPTS: >-
        -Xms256m
        -Xmx512m
        -XX:+UseG1GC
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Djava.security.egd=file:/dev/./urandom
    ports:
      - "8083:8083"
    depends_on:
      postgres-contact:
        condition: service_healthy
      redis-contact:
        condition: service_healthy
      rabbitmq-contact:
        condition: service_healthy
    networks:
      - contact-service-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://contact-service:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    volumes:
      - contact_logs:/app/logs
      - contact_tmp:/tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768Mi
        reservations:
          cpus: "0.25"
          memory: 384Mi

networks:
  contact-service-network:
    driver: bridge
    name: iqscaffold-contact-network-dev
    ipam:
      config:
        - subnet: 172.22.0.0/16

volumes:
  postgres_contact_data:
    name: iqscaffold_contact_postgres_data_dev
    driver: local
  redis_contact_data:
    name: iqscaffold_contact_redis_data_dev
    driver: local
  rabbitmq_contact_data:
    name: iqscaffold_contact_rabbitmq_data_dev
    driver: local
  contact_logs:
    name: iqscaffold_contact_logs_dev
    driver: local
  contact_tmp:
    name: iqscaffold_contact_tmp_dev
    driver: local
