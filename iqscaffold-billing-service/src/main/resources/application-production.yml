spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  # Liquibase Configuration
  # Disabled globally - migrations are run programmatically per schema via TenantLiquibaseRunner
  liquibase:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}

logging:
  level:
    root: WARN
    com.iqscaffold.billingservice: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    liquibase: WARN

iqscaffold:
  liquibase:
    systemChangeLog: classpath:db/changelog/system/master.xml
    tenantChangeLog: classpath:db/changelog/tenant/master.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,liquibase
  endpoint:
    health:
      show-details: never

  billing:
    security:
      rate-limiting:
        enabled: true
        requests-per-minute: 500
        burst-capacity: 1000
    integration:
      user-service:
        url: ${USER_SERVICE_URL}
      email-service:
        url: ${EMAIL_SERVICE_URL}
    payment:
      provider: ${PAYMENT_PROVIDER:stripe}
      stripe:
        api-key: ${STRIPE_API_KEY}
        webhook-secret: ${STRIPE_WEBHOOK_SECRET}
      paypal:
        client-id: ${PAYPAL_CLIENT_ID}
        client-secret: ${PAYPAL_CLIENT_SECRET}
