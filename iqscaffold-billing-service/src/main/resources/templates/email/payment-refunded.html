<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{email.payment.refunded.title}">Refund Processed</title>
</head>

<body>
    <h1 th:text="#{email.payment.refunded.title}">Refund Processed</h1>
    <p th:text="#{email.payment.refunded.greeting}">Hello,</p>
    <p th:text="#{email.payment.refunded.body}">We have processed a refund.</p>
    <p th:text="#{email.payment.refunded.amount(${amount}, ${currency})}">Amount: 10.00 USD</p>
    <p th:text="#{email.payment.refunded.paymentId(${paymentId})}">Payment ID: 123</p>
    <p th:text="#{email.payment.refunded.footer}">It may take days.</p>
</body>

</html>
