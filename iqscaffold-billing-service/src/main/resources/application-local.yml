spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/billing_db
    username: ${DB_USERNAME:billing_user}
    password: ${DB_PASSWORD:billing_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  # Liquibase Configuration
  # Disabled globally - migrations are run programmatically per schema via TenantLiquibaseRunner
  liquibase:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

logging:
  level:
    root: INFO
    com.iqscaffold.billingservice: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    liquibase: INFO

iqscaffold:
  liquibase:
    systemChangeLog: classpath:db/changelog/system/master.xml
    tenantChangeLog: classpath:db/changelog/tenant/master.xml

  billing:
    integration:
      user-service:
        url: http://localhost:8081
      email-service:
        url: http://localhost:8084
    payment:
      provider: stripe
      stripe:
        api-key: ${STRIPE_API_KEY:sk_test_dummy}
        webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_dummy}
