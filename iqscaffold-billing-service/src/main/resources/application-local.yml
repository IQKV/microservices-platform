spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/billing_db
    username: ${DB_USERNAME:billing_user}
    password: ${DB_PASSWORD:billing_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: BillingServiceHikariPool
      auto-commit: false
      leak-detection-threshold: 60000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate


logging:
  level:
    root: INFO
    com.iqscaffold.billingservice: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    liquibase: INFO

iqscaffold:
  billing:
    integration:
      email-service:
        url: http://localhost:8084
    payment:
      provider: stripe
      saas-mode: true
      stripe:
        api-key: ${STRIPE_API_KEY:sk_test_dummy}
        webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_dummy}
        client-id: ${STRIPE_CLIENT_ID:ca_test_dummy}
