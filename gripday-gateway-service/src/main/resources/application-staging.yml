# Staging Environment Configuration
# This configuration is optimized for staging with moderate logging and security

server:
  port: 8080

spring:
  # Redis Configuration - Staging Redis
  data:
    redis:
      host: ${GRIPDAY_CACHE_REDIS_HOST}
      port: ${GRIPDAY_CACHE_REDIS_PORT:6379}
      password: ${GRIPDAY_CACHE_REDIS_PASSWORD}
      database: ${GRIPDAY_CACHE_REDIS_DATABASE:1}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 5000ms

  # Cloud Gateway Configuration - Staging
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${gripday.gateway.routing.services.auth-service.uri}
          predicates:
            - Path=${gripday.gateway.routing.services.auth-service.path}
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenish-rate: ${gripday.gateway.rate-limiting.policies.default-requests-per-minute}
                redis-rate-limiter.burst-capacity: ${gripday.gateway.rate-limiting.policies.default-burst-capacity}
        - id: health-check
          uri: ${gripday.gateway.routing.services.auth-service.uri}
          predicates:
            - Path=/actuator/health
          filters:
            - StripPrefix=0
      discovery:
        locator:
          enabled: false

# Gripday Gateway Configuration - Staging Environment
gripday:
  # Cache Configuration - Redis
  cache:
    redis:
      host: ${GRIPDAY_CACHE_REDIS_HOST}
      port: ${GRIPDAY_CACHE_REDIS_PORT:6379}
      password: ${GRIPDAY_CACHE_REDIS_PASSWORD}
      database: ${GRIPDAY_CACHE_REDIS_DATABASE:1}
      timeout: PT3S
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: PT5S
      key-prefix: "gripday:gateway:staging"
      default-ttl: PT30M
      enable-statistics: true

  # Gateway Configuration
  gateway:
    routing:
      services:
        auth-service:
          uri: ${GRIPDAY_GATEWAY_ROUTING_AUTH_SERVICE_URI}
          path: /api/v1/auth/**
          enabled: true
          connect-timeout: 5000
          response-timeout: 30000
      enable-service-discovery: false
      load-balancing:
        strategy: round-robin
        enable-health-check: true
        health-check-interval: PT30S
    
    security:
      jwt:
        secret-key: ${GRIPDAY_GATEWAY_SECURITY_JWT_SECRET}
        access-token-expiry: PT15M
        refresh-token-expiry: P7D
        issuer: gripday-platform-staging
        audience: gripday-services-staging
        algorithm: RS256
      authentication:
        enabled: true
        auth-service-url: ${GRIPDAY_GATEWAY_SECURITY_AUTH_SERVICE_URL}
        token-validation-timeout: PT5S
        enable-user-context-propagation: true
      public-paths:
        - /api/v1/auth/login
        - /api/v1/auth/signup
        - /api/v1/auth/refresh
        - /actuator/health
        - /actuator/info
    
    rate-limiting:
      enabled: true
      redis:
        key-prefix: "gripday:gateway:rate-limit:staging"
        key-expiry: PT1M
      policies:
        default-requests-per-minute: 60
        default-burst-capacity: 100
        endpoints:
          "/api/v1/auth/login":
            requests-per-minute: 10
            burst-capacity: 20
            enable-tenant-quotas: true
          "/api/v1/auth/signup":
            requests-per-minute: 5
            burst-capacity: 10
            enable-tenant-quotas: true
      tenant-quotas:
        enabled: true
        default-tenant-requests-per-minute: 1000
        tenant-specific-quotas: {}
    
    circuit-breaker:
      enabled: true
      failure-rate-threshold: 50
      slow-call-rate-threshold: 50
      slow-call-duration-threshold: PT2S
      minimum-number-of-calls: 10
      wait-duration-in-open-state: PT30S
      sliding-window-size: 100
      sliding-window-type: COUNT_BASED
    
    cors:
      enabled: true
      allowed-origins:
        - ${GRIPDAY_GATEWAY_CORS_ALLOWED_ORIGINS:https://staging.gripday.com}
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Requested-With
        - X-Correlation-ID
        - X-Request-ID
        - X-Tenant-ID
      allow-credentials: true
      max-age: 3600
    
    transformation:
      request:
        enabled: true
        enable-header-enrichment: true
        enable-user-context-propagation: true
        enable-tenant-context-propagation: true
        headers-to-remove:
          - Authorization-Internal
          - X-Internal-Token
        additional-headers:
          X-Gateway-Version: "1.0.0-staging"
          X-Environment: "staging"
      response:
        enabled: true
        enable-security-headers: true
        enable-correlation-headers: true
        remove-internal-headers: true
        additional-headers-to-remove:
          - X-Internal-Service
          - X-Database-Query-Time
    
  # Observability Configuration - Staging
  observability:
    tracing:
      enabled: true
      service-name: ${spring.application.name}
      sampling-rate: 0.1  # 10% sampling for staging
      endpoint: ${GRIPDAY_OBSERVABILITY_TRACING_ENDPOINT}
      timeout: PT10S
      export-timeout: PT30S
      batch-size: 512
    metrics:
      enabled: true
      path: /actuator/prometheus
      prefix: gripday_gateway_staging
      include-host-tag: true
      include-application-tag: true
      include-environment-tag: true
      custom-tags:
        environment: staging
        service: gateway-service
      enabled-metrics:
        - gateway.requests
        - gateway.response.time
        - gateway.circuit.breaker
        - gateway.rate.limit
    logging:
      level: INFO
      format: json  # Structured logging for staging
      enable-request-logging: true
      enable-response-logging: false
      enable-correlation-id: true
      include-trace-id: true
      include-span-id: true
      include-user-id: true
      include-tenant-id: true
      correlation-id-header: X-Correlation-ID
      request-id-header: X-Request-ID
      tenant-id-header: X-Tenant-ID

# Logging Configuration - Staging
logging:
  level:
    org.gripday: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    reactor.netty: INFO
    io.lettuce: WARN
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%-5level","thread":"%thread","logger":"%logger{36}","correlationId":"%X{correlationId:-}","traceId":"%X{traceId:-}","spanId":"%X{spanId:-}","message":"%msg"}%n'

# Management Configuration - Staging
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 0.1

# SpringDoc Configuration - Staging
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    try-it-out-enabled: false  # Disabled for staging security