# Staging environment configuration
spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 1
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

logging:
  level:
    org.gripday.gatewayservice: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    reactor.netty: WARN
    io.github.resilience4j: INFO

management:
  tracing:
    sampling:
      probability: 0.1

gripday:
  gateway:
    routing:
      services:
        auth-service:
          uri: http://auth-service:8081
    security:
      jwt:
        secret-key: ${JWT_SECRET_KEY}
      authentication:
        auth-service-url: http://auth-service:8081
    observability:
      tracing:
        enabled: true
        sampling-rate: 0.1
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4317}
      metrics:
        enabled: true
      logging:
        level: INFO
        enable-request-logging: true
        enable-response-logging: false
        enable-correlation-id: true