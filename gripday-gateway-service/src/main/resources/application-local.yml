# Local development configuration
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

logging:
  level:
    org.gripday.gatewayservice: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    reactor.netty: INFO
    io.github.resilience4j: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0

gripday:
  gateway:
    security:
      jwt:
        secret-key: ${JWT_SECRET_KEY:local-development-secret-key-change-in-production}
    observability:
      tracing:
        enabled: true
        sampling-rate: 1.0
        endpoint: http://localhost:4317
      metrics:
        enabled: true
      logging:
        level: DEBUG
        enable-request-logging: true
        enable-response-logging: true
        enable-correlation-id: true