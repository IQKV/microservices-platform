server:
  port: 8080

spring:
  application:
    name: gripday-gateway-service
  profiles:
    active: local
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${gripday.gateway.routing.services.auth-service.uri}
          predicates:
            - Path=${gripday.gateway.routing.services.auth-service.path}
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenish-rate: ${gripday.gateway.rate-limiting.policies.default-requests-per-minute}
                redis-rate-limiter.burst-capacity: ${gripday.gateway.rate-limiting.policies.default-burst-capacity}
        - id: health-check
          uri: ${gripday.gateway.routing.services.auth-service.uri}
          predicates:
            - Path=/actuator/health
          filters:
            - StripPrefix=0

# Gripday Gateway Configuration
gripday:
  gateway:
    routing:
      services:
        auth-service:
          uri: http://localhost:8081
          path: /api/v1/auth/**
          enabled: true
          connect-timeout: 5000
          response-timeout: 30000
      enable-service-discovery: false
      load-balancing:
        strategy: round-robin
        enable-health-check: true
        health-check-interval: PT30S
    
    security:
      jwt:
        secret-key: ${JWT_SECRET_KEY:default-secret-key-change-in-production}
        access-token-expiry: PT15M
        refresh-token-expiry: P7D
        issuer: gripday-platform
        audience: gripday-services
      authentication:
        enabled: true
        auth-service-url: http://localhost:8081
        token-validation-timeout: PT5S
        enable-user-context-propagation: true
      public-paths:
        - /api/v1/auth/login
        - /api/v1/auth/signup
        - /api/v1/auth/refresh
        - /actuator/health
        - /actuator/info
    
    rate-limiting:
      enabled: true
      redis:
        key-prefix: "gripday:gateway:rate-limit"
        key-expiry: PT1M
      policies:
        default-requests-per-minute: 60
        default-burst-capacity: 100
        endpoints:
          "/api/v1/auth/login":
            requests-per-minute: 10
            burst-capacity: 20
            enable-tenant-quotas: true
          "/api/v1/auth/signup":
            requests-per-minute: 5
            burst-capacity: 10
            enable-tenant-quotas: true
      tenant-quotas:
        enabled: true
        default-tenant-requests-per-minute: 1000
        tenant-specific-quotas: {}
    
    circuit-breaker:
      enabled: true
      failure-rate-threshold: 50
      slow-call-rate-threshold: 50
      slow-call-duration-threshold: PT2S
      minimum-number-of-calls: 10
      wait-duration-in-open-state: PT30S
      sliding-window-size: 100
      sliding-window-type: COUNT_BASED
    
    cors:
      enabled: true
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
        - http://localhost:8080
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
      max-age: 3600
    
    transformation:
      request:
        enabled: true
        enable-header-enrichment: true
        enable-user-context-propagation: true
        enable-tenant-context-propagation: true
        headers-to-remove:
          - Authorization-Internal
          - X-Internal-Token
        additional-headers:
          X-Gateway-Version: "1.0.0"
      response:
        enabled: true
        enable-security-headers: true
        enable-correlation-headers: true
        remove-internal-headers: true
        additional-headers-to-remove:
          - X-Internal-Service
          - X-Database-Query-Time
    
  observability:
    tracing:
      enabled: true
      service-name: ${spring.application.name}
      sampling-rate: 1.0
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      timeout: PT10S
    metrics:
      enabled: true
      path: /actuator/prometheus
      prefix: gripday_gateway
      include-host-tag: true
      include-application-tag: true
      enabled-metrics:
        - gateway.requests
        - gateway.response.time
        - gateway.circuit.breaker
        - gateway.rate.limit
    logging:
      level: INFO
      enable-request-logging: true
      enable-response-logging: false
      enable-correlation-id: true
      include-trace-id: true
      include-span-id: true
      include-user-id: true
      include-tenant-id: true
      correlation-id-header: X-Correlation-ID
      request-id-header: X-Request-ID
      tenant-id-header: X-Tenant-ID

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 1.0