# Production environment configuration
spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 1
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5

logging:
  level:
    org.gripday.gatewayservice: WARN
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN
    reactor.netty: WARN
    io.github.resilience4j: WARN

management:
  tracing:
    sampling:
      probability: 0.01

gripday:
  gateway:
    routing:
      services:
        auth-service:
          uri: ${AUTH_SERVICE_URL}
    security:
      jwt:
        secret-key: ${JWT_SECRET_KEY}
      authentication:
        auth-service-url: ${AUTH_SERVICE_URL}
    observability:
      tracing:
        enabled: true
        sampling-rate: 0.01
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      metrics:
        enabled: true
      logging:
        level: WARN
        enable-request-logging: false
        enable-response-logging: false
        enable-correlation-id: true