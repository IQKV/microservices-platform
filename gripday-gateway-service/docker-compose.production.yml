version: '3.8'

services:
  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: gripday/gateway-service:production
    container_name: gripday-gateway-service-production
    env_file:
      - .env.production
    ports:
      - "8080:8080"
    depends_on:
      - redis
    networks:
      - gripday-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: gripday-redis-gateway-production
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data_gateway_production:/data
    networks:
      - gripday-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  redis_data_gateway_production:
    driver: local

networks:
  gripday-network:
    driver: bridge
    name: gripday-production-network
    external: true