version: '3.8'

services:
  # Redis for Gateway Service - Staging Environment
  redis-gateway:
    image: redis:7-alpine
    container_name: gripday-gateway-redis-staging
    environment:
      REDIS_PASSWORD: ${GRIPDAY_CACHE_REDIS_PASSWORD}
    ports:
      - "${REDIS_GATEWAY_PORT:-6380}:6379"
    volumes:
      - redis_gateway_data_staging:/data
      - ./scripts/redis-gateway-staging.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - gateway-network-staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${GRIPDAY_CACHE_REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=redis-gateway,environment=staging"
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${GRIPDAY_CACHE_REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-keepalive 300
      --timeout 0
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 384M

  # Gateway Service - Staging Environment
  gateway-service:
    build:
      context: ..
      dockerfile: gripday-gateway-service/Dockerfile
    image: gripday/gateway-service:staging
    container_name: gripday-gateway-service-staging
    env_file:
      - .env.staging
    environment:
      # Spring Configuration
      SPRING_PROFILES_ACTIVE: staging
      SPRING_APPLICATION_NAME: gripday-gateway-service
      
      # Redis Configuration
      GRIPDAY_CACHE_REDIS_HOST: redis-gateway
      GRIPDAY_CACHE_REDIS_PORT: 6379
      GRIPDAY_CACHE_REDIS_PASSWORD: ${GRIPDAY_CACHE_REDIS_PASSWORD}
      GRIPDAY_CACHE_REDIS_TIMEOUT: 3000ms
      GRIPDAY_CACHE_REDIS_DATABASE: 0
      
      # Gateway Configuration
      GRIPDAY_GATEWAY_AUTH_SERVICE_URL: ${GRIPDAY_GATEWAY_AUTH_SERVICE_URL}
      GRIPDAY_GATEWAY_CORS_ALLOWED_ORIGINS: ${GRIPDAY_GATEWAY_CORS_ALLOWED_ORIGINS}
      GRIPDAY_GATEWAY_CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      GRIPDAY_GATEWAY_CORS_ALLOWED_HEADERS: "*"
      GRIPDAY_GATEWAY_CORS_ALLOW_CREDENTIALS: true
      
      # Rate Limiting Configuration
      GRIPDAY_GATEWAY_RATE_LIMITING_ENABLED: true
      GRIPDAY_GATEWAY_RATE_LIMITING_REQUESTS_PER_MINUTE: ${GRIPDAY_GATEWAY_RATE_LIMITING_REQUESTS_PER_MINUTE:-200}
      GRIPDAY_GATEWAY_RATE_LIMITING_BURST_CAPACITY: ${GRIPDAY_GATEWAY_RATE_LIMITING_BURST_CAPACITY:-400}
      GRIPDAY_GATEWAY_RATE_LIMITING_REPLENISH_RATE: ${GRIPDAY_GATEWAY_RATE_LIMITING_REPLENISH_RATE:-100}
      
      # Circuit Breaker Configuration
      GRIPDAY_GATEWAY_CIRCUIT_BREAKER_ENABLED: true
      GRIPDAY_GATEWAY_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD: ${GRIPDAY_GATEWAY_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:-50}
      GRIPDAY_GATEWAY_CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE: ${GRIPDAY_GATEWAY_CIRCUIT_BREAKER_WAIT_DURATION:-30s}
      GRIPDAY_GATEWAY_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE: ${GRIPDAY_GATEWAY_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:-20}
      
      # Observability Configuration
      GRIPDAY_OBSERVABILITY_TRACING_ENABLED: true
      GRIPDAY_OBSERVABILITY_METRICS_ENABLED: true
      GRIPDAY_OBSERVABILITY_LOGGING_LEVEL: INFO
      
      # Reactive Configuration
      SPRING_WEBFLUX_MULTIPART_MAX_IN_MEMORY_SIZE: 2MB
      SPRING_WEBFLUX_MULTIPART_MAX_DISK_USAGE_PER_PART: 20MB
      SPRING_WEBFLUX_MULTIPART_MAX_PARTS: 256
      
      # JVM Configuration for staging reactive workloads
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -XX:+OptimizeStringConcat
        -XX:+UseCompressedOops
        -XX:+UseCompressedClassPointers
        -XX:+UnlockExperimentalVMOptions
        -Dreactor.netty.ioWorkerCount=8
        -Dreactor.netty.pool.maxConnections=1000
        -Dspring.reactor.netty.shutdown-quiet-period=2s
        -Djava.security.egd=file:/dev/./urandom
        -Dspring.profiles.active=staging
        -Dlogging.level.org.gripday=INFO
        -Dlogging.config=classpath:logback-spring.xml
    ports:
      - "${GATEWAY_SERVICE_PORT:-8080}:8080"
    depends_on:
      redis-gateway:
        condition: service_healthy
    networks:
      - gateway-network-staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=gateway-service,environment=staging"
    volumes:
      - gateway_logs_staging:/app/logs
      - gateway_tmp_staging:/app/tmp
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G
        reservations:
          cpus: '1.0'
          memory: 768M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

networks:
  gateway-network-staging:
    driver: bridge
    name: gripday-gateway-network-staging
    ipam:
      config:
        - subnet: 172.24.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-gateway-staging

volumes:
  redis_gateway_data_staging:
    name: gripday_gateway_redis_data_staging
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/redis-gateway-staging
  gateway_logs_staging:
    name: gripday_gateway_logs_staging
    driver: local
  gateway_tmp_staging:
    name: gripday_gateway_tmp_staging
    driver: local