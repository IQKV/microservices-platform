version: '3.8'

services:
  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: gripday/gateway-service:staging
    container_name: gripday-gateway-service-staging
    env_file:
      - .env.staging
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gripday-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: gripday-redis-gateway-staging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - redis_data_gateway_staging:/data
    networks:
      - gripday-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data_gateway_staging:
    driver: local

networks:
  gripday-network:
    driver: bridge
    name: gripday-staging-network
    external: true