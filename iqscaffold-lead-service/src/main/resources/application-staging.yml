spring:
  datasource:
    url: ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://staging-db:5432/iqscaffold_lead_staging}
    username: ${IQSCAFFOLD_DATABASE_USERNAME:iqscaffold_lead}
    password: ${IQSCAFFOLD_DATABASE_PASSWORD}
    hikari:
      pool-name: LeadServiceHikariPool-Staging
      maximum-pool-size: 15
      minimum-idle: 3

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.iqscaffold.leadservice: INFO
    org.hibernate.SQL: WARN

# Staging environment overrides for IQ Scaffold properties
iqscaffold:
  lead:
    scoring:
      enable-auto-scoring: true
      default-score: 0
      max-score: 100
      min-qualification-score: 60
    qualification:
      enable-auto-qualification: true
      require-email: true
      require-phone: true
      require-company: false
