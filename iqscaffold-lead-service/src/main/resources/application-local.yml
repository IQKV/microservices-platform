spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lead_db
    username: ${DB_USERNAME:lead_user}
    password: ${DB_PASSWORD:lead_pass}
    hikari:
      pool-name: LeadServiceHikariPool-Local
      leak-detection-threshold: 60000

  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG

# Local development overrides for IQ Scaffold properties
iqscaffold:
  lead:
    scoring:
      enable-auto-scoring: true
      default-score: 0
      max-score: 100
      min-qualification-score: 50
    qualification:
      enable-auto-qualification: false
      require-email: true
      require-phone: false
      require-company: false
