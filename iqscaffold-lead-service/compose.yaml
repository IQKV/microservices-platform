services:
  # PostgreSQL Database for Lead Service - Local Development
  postgres-lead:
    image: postgres:15.8-alpine
    container_name: iqscaffold-lead-postgres-dev
    environment:
      POSTGRES_DB: iqscaffold_lead_local
      POSTGRES_USER: iqscaffold_lead
      POSTGRES_PASSWORD: iqscaffold_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5435:5432"
    volumes:
      - postgres_lead_data:/var/lib/postgresql/data
    networks:
      - lead-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iqscaffold_lead -d iqscaffold_lead_local -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # Redis for Lead Service - Local Development
  redis-lead:
    image: redis:7.2-alpine
    container_name: iqscaffold-lead-redis-dev
    ports:
      - "6382:6379"
    volumes:
      - redis_lead_data:/data
    networks:
      - lead-service-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

  # RabbitMQ for Lead Service - Local Development
  rabbitmq-lead:
    image: rabbitmq:3.13-management-alpine
    container_name: iqscaffold-lead-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: iqscaffold
      RABBITMQ_DEFAULT_PASS: iqscaffold_password
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit log_levels [{connection,error},{default,info}] disk_free_limit 2147483648
    ports:
      - "5674:5672" # AMQP port
      - "15674:15672" # Management UI
    volumes:
      - rabbitmq_lead_data:/var/lib/rabbitmq
    networks:
      - lead-service-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Lead Service - Local Development
  lead-service:
    build:
      context: ..
      dockerfile: iqscaffold-lead-service/Dockerfile
      target: builder
    image: iqscaffold/iqscaffold-lead-service:dev
    container_name: iqscaffold-lead-service-dev
    environment:
      # Spring Configuration
      SPRING_PROFILES_ACTIVE: local
      SPRING_APPLICATION_NAME: iqscaffold-lead-service

      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-lead:5432/iqscaffold_lead_local
      SPRING_DATASOURCE_USERNAME: iqscaffold_lead
      SPRING_DATASOURCE_PASSWORD: iqscaffold_password

      # RabbitMQ Configuration
      SPRING_RABBITMQ_HOST: rabbitmq-lead
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: iqscaffold
      SPRING_RABBITMQ_PASSWORD: iqscaffold_password
      SPRING_RABBITMQ_VIRTUAL_HOST: /

      # JWT Configuration
      USER_SERVICE_URL: http://host.docker.internal:8081
      JWT_ISSUER: iqscaffold-user-service

      # Multi-tenancy Configuration
      IQSCAFFOLD_TENANT_ID_HEADER: X-Tenant-ID

      # Lead Configuration
      LEAD_ENABLE_AUTO_SCORING: true
      LEAD_ENABLE_AUTO_QUALIFICATION: false

      # Observability Configuration
      IQSCAFFOLD_OBSERVABILITY_TRACING_ENABLED: true
      IQSCAFFOLD_OBSERVABILITY_TRACING_SAMPLING_RATE: 1.0
      IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: iqscaffold-lead-service
      OTEL_RESOURCE_ATTRIBUTES: service.name=iqscaffold-lead-service,service.version=1.0.0,deployment.environment=dev

      # JVM Configuration
      JAVA_OPTS: >-
        -Xms256m
        -Xmx512m
        -XX:+UseG1GC
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Djava.security.egd=file:/dev/./urandom
    ports:
      - "8084:8084"
    depends_on:
      postgres-lead:
        condition: service_healthy
      redis-lead:
        condition: service_healthy
      rabbitmq-lead:
        condition: service_healthy
    networks:
      - lead-service-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://lead-service:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    volumes:
      - lead_logs:/app/logs
      - lead_tmp:/tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768Mi
        reservations:
          cpus: "0.25"
          memory: 384Mi

networks:
  lead-service-network:
    driver: bridge
    name: iqscaffold-lead-network-dev
    ipam:
      config:
        - subnet: 172.23.0.0/16

volumes:
  postgres_lead_data:
    name: iqscaffold_lead_postgres_data_dev
    driver: local
  redis_lead_data:
    name: iqscaffold_lead_redis_data_dev
    driver: local
  rabbitmq_lead_data:
    name: iqscaffold_lead_rabbitmq_data_dev
    driver: local
  lead_logs:
    name: iqscaffold_lead_logs_dev
    driver: local
  lead_tmp:
    name: iqscaffold_lead_tmp_dev
    driver: local
