# Local Development Environment Configuration
# This configuration is optimized for development with debug logging and relaxed security

server:
  port: 8080

spring:
  # Cloud Gateway Configuration - Development
  # Note: Routes are defined in main application.yml
  # Environment-specific overrides only
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

# IQ Scaffold Gateway Configuration - Local Environment
iqscaffold:
  # Cache Configuration - Redis
  cache:
    redis:
      key-prefix: "iqscaffold:gateway:local"
      enable-statistics: true

  # Gateway Configuration
  gateway:
    routing:
      # API prefix configuration - keep /api prefix in local development
      api-prefix:
        strip-count: 0  # Don't strip in local development
      services:
        user-service:
          connect-timeout: 10000  # Extended for development
          response-timeout: 60000  # Extended for development
    
    security:
      jwt:
        access-token-expiry: PT30M  # Extended for development
        refresh-token-expiry: P30D  # Extended for development
      authentication:
        token-validation-timeout: PT10S  # Extended for development
    
    rate-limiting:
      redis:
        key-prefix: "iqscaffold:gateway:rate-limit:local"
      policies:
        default-requests-per-minute: 120  # More lenient for development
        default-burst-capacity: 200
        endpoints:
          "/api/v1/auth/login":
            requests-per-minute: 20  # More lenient for development
            burst-capacity: 40
            enable-tenant-quotas: false  # Disabled for development
      tenant-quotas:
        enabled: false  # Disabled for development
    
    circuit-breaker:
      failure-rate-threshold: 70  # More lenient for development
      slow-call-rate-threshold: 70
      slow-call-duration-threshold: PT5S  # More lenient for development
      minimum-number-of-calls: 5  # Lower threshold for development
      wait-duration-in-open-state: PT10S  # Shorter for development
      sliding-window-size: 50
    
    transformation:
      request:
        additional-headers:
          X-Gateway-Version: "1.0.0-local"
          X-Environment: "local"
      response:
        enable-security-headers: false  # Relaxed for development

  observability:
    metrics:
      prefix: iqscaffold_gateway_local
      custom-tags:
        environment: local
    logging:
      level: DEBUG  # Verbose logging for development
      enable-response-logging: true  # Enabled for development debugging

# Logging Configuration - Development
logging:
  level:
    com.iqscaffold: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    reactor.netty: DEBUG
    io.lettuce: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"

# Management Configuration - Development
management:
  endpoints:
    web:
      exposure:
        include: "*"  # Expose all endpoints for development
  endpoint:
    health:
      show-details: always  # Always show health details in development

# SpringDoc Configuration - Development
springdoc:
  swagger-ui:
    try-it-out-enabled: true
