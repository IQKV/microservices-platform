# Production Environment Configuration
# This configuration is optimized for production with minimal logging and maximum security

server:
  port: 8080

spring:
  # Cloud Gateway Configuration - Production
  # Note: Routes are defined in main application.yml
  # Environment-specific overrides only
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

# IQ Scaffold Gateway Configuration - Production Environment
iqscaffold:
  # Cache Configuration - Redis
  cache:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD}
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 4
      key-prefix: "iqscaffold:gateway:production"
      default-ttl: PT15M

  # Gateway Configuration
  gateway:
    routing:
      # API prefix configuration - strip /api prefix in production (deployed on api.iqscaffold.com)
      api-prefix:
        prefix: ""  # No prefix in production (api.iqscaffold.com already indicates API)
      services:
        user-service:
          uri: ${IQSCAFFOLD_GATEWAY_ROUTING_USER_SERVICE_URI}
          openapi:
            enabled: false
    
    security:
      jwt:
        jwk-set-uri: ${USER_SERVICE_JWK_URI}
      authentication:
        user-service-url: ${IQSCAFFOLD_GATEWAY_SECURITY_USER_SERVICE_URL}
    
    rate-limiting:
      redis:
        key-prefix: "iqscaffold:gateway:rate-limit:production"
    
    cors:
      allowed-origins:
        - ${IQSCAFFOLD_GATEWAY_CORS_ALLOWED_ORIGINS}
    
    transformation:
      request:
        additional-headers:
          X-Gateway-Version: "1.0.0"
          X-Environment: "production"

  observability:
    tracing:
      sampling-rate: 0.01  # Minimal sampling for production
      endpoint: ${IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT}
      batch-size: 1024
    metrics:
      custom-tags:
        environment: production
    logging:
      level: WARN
      format: json  # JSON format for production
      enable-request-logging: false  # Disabled for performance
      include-user-id: false  # Disabled for privacy in production

# Logging Configuration - Production
logging:
  level:
    com.iqscaffold: WARN
    org.springframework.cloud.gateway: ERROR
    org.springframework.security: ERROR
    org.springframework.web: ERROR
    reactor.netty: ERROR
    io.lettuce: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"

# Management Configuration - Production
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 0.01  # Minimal sampling for production

# SpringDoc Configuration - Production
springdoc:
  api-docs:
    enabled: false  # Disabled in production
  swagger-ui:
    enabled: false  # Disabled in production
