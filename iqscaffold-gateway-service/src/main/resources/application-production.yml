# Production Environment Configuration
# This configuration is optimized for production with minimal logging and maximum security

server:
  port: 8080

spring:
  # Cloud Gateway Configuration - Production
  # Note: Routes are defined in main application.yml
  # Environment-specific overrides only
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

# IQ Scaffold Gateway Configuration - Production Environment
iqscaffold:
  # Cache Configuration - Redis
  cache:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST}
      port: ${IQSCAFFOLD_CACHE_REDIS_PORT:6379}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD}
      database: ${IQSCAFFOLD_CACHE_REDIS_DATABASE:0}
      timeout: PT2S
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 4
        max-wait: PT-1S
      key-prefix: "iqscaffold:gateway:production"
      default-ttl: PT15M
      enable-statistics: false

  # Gateway Configuration
  gateway:
    routing:
      # API prefix configuration - strip /api prefix in production (deployed on api.iqscaffold.com)
      api-prefix:
        enabled: true
        prefix: ""  # No prefix in production (api.iqscaffold.com already indicates API)
        strip-count: 0  # No stripping needed when prefix is empty
      services:
        user-service:
          uri: ${IQSCAFFOLD_GATEWAY_ROUTING_USER_SERVICE_URI}
          path: /v1/**
          enabled: true
          connect-timeout: 5000
          response-timeout: 30000
          openapi:
            enabled: false
            display-name: "User Service APIs"
            description: "Authentication and user management APIs"
            context-path: "user-service"
      enable-service-discovery: false
      load-balancing:
        strategy: round-robin
        enable-health-check: true
        health-check-interval: PT30S
    
    security:
      jwt:
        access-token-expiry: PT15M
        refresh-token-expiry: P7D
        issuer: iqscaffold-user-service
        audience: iqscaffold-services
        algorithm: RS256
        jwk-set-uri: ${USER_SERVICE_JWK_URI}
      authentication:
        enabled: true
        user-service-url: ${IQSCAFFOLD_GATEWAY_SECURITY_USER_SERVICE_URL}
        token-validation-timeout: PT5S
        enable-user-context-propagation: true
      public-paths:
        # JWK endpoint for public key distribution
        - /.well-known/jwks.json
    
    rate-limiting:
      enabled: true
      redis:
        key-prefix: "iqscaffold:gateway:rate-limit:production"
        key-expiry: PT1M
      # Note: Policies are defined in main application.yml
      # Overrides can be added here if needed
      tenant-quotas:
        enabled: true
        default-tenant-requests-per-minute: 1000
        tenant-specific-quotas: { }
    
    circuit-breaker:
      enabled: true
      failure-rate-threshold: 50
      slow-call-rate-threshold: 50
      slow-call-duration-threshold: PT2S
      minimum-number-of-calls: 10
      wait-duration-in-open-state: PT30S
      sliding-window-size: 100
      sliding-window-type: COUNT_BASED
    
    cors:
      enabled: true
      allowed-origins:
        - ${IQSCAFFOLD_GATEWAY_CORS_ALLOWED_ORIGINS}
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
      max-age: 3600
    
    transformation:
      request:
        enabled: true
        enable-header-enrichment: true
        enable-user-context-propagation: true
        enable-tenant-context-propagation: true
        headers-to-remove:
          - Authorization-Internal
          - X-Internal-Token
        additional-headers:
          X-Gateway-Version: "1.0.0"
          X-Environment: "production"
      response:
        enabled: true
        enable-security-headers: true
        enable-correlation-headers: true
        remove-internal-headers: true
        additional-headers-to-remove:
          - X-Internal-Service
          - X-Database-Query-Time

  observability:
    tracing:
      sampling-rate: 0.01  # Minimal sampling for production
      endpoint: ${IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT}
      batch-size: 1024
    metrics:
      custom-tags:
        environment: production
    logging:
      level: WARN
      format: json  # JSON format for production
      enable-request-logging: false  # Disabled for performance
      include-user-id: false  # Disabled for privacy in production

# Logging Configuration - Production
logging:
  level:
    com.iqscaffold: WARN
    org.springframework.cloud.gateway: ERROR
    org.springframework.security: ERROR
    org.springframework.web: ERROR
    reactor.netty: ERROR
    io.lettuce: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"

# Management Configuration - Production
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 0.01  # Minimal sampling for production

# SpringDoc Configuration - Production
springdoc:
  api-docs:
    enabled: false  # Disabled in production
  swagger-ui:
    enabled: false  # Disabled in production
