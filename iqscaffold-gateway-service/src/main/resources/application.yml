server:
  port: 8080

spring:
  application:
    name: iqscaffold-gateway-service
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: local,crm
  output:
    ansi:
      enabled: always
  data:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST:localhost}
      port: ${IQSCAFFOLD_CACHE_REDIS_PORT:6379}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD:}
      database: ${IQSCAFFOLD_CACHE_REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:


        - id: user-service-public-signup
          uri: ${iqscaffold.gateway.routing.services.user-service.uri}
          predicates:
            - Path=/api/v1/public/signup
          filters:
            - StripPrefix=${iqscaffold.gateway.routing.api-prefix.strip-count:0}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenish-rate: 3  # Strict rate limit for signup: 3 requests per minute
                redis-rate-limiter.burst-capacity: 5
        - id: user-service-auth
          uri: ${iqscaffold.gateway.routing.services.user-service.uri}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=${iqscaffold.gateway.routing.api-prefix.strip-count:0}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenish-rate: ${iqscaffold.gateway.rate-limiting.policies.default-requests-per-minute}
                redis-rate-limiter.burst-capacity: ${iqscaffold.gateway.rate-limiting.policies.default-burst-capacity}
        - id: user-service-profile
          uri: ${iqscaffold.gateway.routing.services.user-service.uri}
          predicates:
            - Path=/api/v1/users/me,/api/v1/users/me/**
          filters:
            - StripPrefix=${iqscaffold.gateway.routing.api-prefix.strip-count:0}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenish-rate: ${iqscaffold.gateway.rate-limiting.policies.default-requests-per-minute}
                redis-rate-limiter.burst-capacity: ${iqscaffold.gateway.rate-limiting.policies.default-burst-capacity}
        - id: user-service-admin
          uri: ${iqscaffold.gateway.routing.services.user-service.uri}
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - StripPrefix=${iqscaffold.gateway.routing.api-prefix.strip-count:0}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenish-rate: ${iqscaffold.gateway.rate-limiting.policies.default-requests-per-minute}
                redis-rate-limiter.burst-capacity: ${iqscaffold.gateway.rate-limiting.policies.default-burst-capacity}
        - id: user-service-jwks
          uri: ${iqscaffold.gateway.routing.services.user-service.uri}
          predicates:
            - Path=/.well-known/jwks.json
          filters:
            - StripPrefix=0
        - id: health-check
          uri: ${iqscaffold.gateway.routing.services.user-service.uri}
          predicates:
            - Path=/actuator/health
          filters:
            - StripPrefix=0

# IQ Scaffold Gateway Configuration
iqscaffold:
  # Internationalization configuration
  i18n:
    supported-locales:
      - en
      - es
      - fr
    default-locale: en
  
  # Platform Configuration - Extensible Feature and Authority Management
  platform:
    security:
      routeProtection:
        publicPaths:
          - "/.well-known/jwks.json"
          - "/api/v1/public/**"
          - "/api/v1/auth/login"
          - "/api/v1/auth/signup"
          - "/api/v1/auth/refresh"
          - "/api/v1/auth/validate"
          - "/api/v1/auth/health"
          - "/api/v1/auth/email/verify"
          - "/api/v1/auth/email/resend"
          - "/api/v1/auth/email/status"
          - "/api/v1/auth/password/forgot"
          - "/api/v1/auth/password/reset"
          - "/actuator/health"
          - "/actuator/info"
          - "/api/v1/docs"
          - "/swagger-ui/**"
          - "/api-docs/**"
          - "/billing-service/swagger-ui/**"
          - "/billing-service/api-docs/**"
          - "/lead-service/swagger-ui/**"
          - "/lead-service/api-docs/**"
          - "/pipeline-service/swagger-ui/**"
          - "/pipeline-service/api-docs/**"
          - "/contact-service/swagger-ui/**"
          - "/contact-service/api-docs/**"
          - "/actuator/prometheus"
          - "/api/v1/billing/webhooks/**"
          - "/api/v1/crm/webhooks/**"
          - "/api/v1/billing/subscription-plans/active"
          - "/api/v1/billing/subscription-plans"
        
        protectedRoutes:
          # CRM Routes
          "/api/*/crm/**": ["CRM_ACCESS", "ADMIN", "SUPER_ADMIN"]
          "/api/*/leads/**": ["CRM_ACCESS", "ADMIN", "SUPER_ADMIN"]
          "/api/*/contacts/**": ["CRM_ACCESS", "ADMIN", "SUPER_ADMIN"]
          "/api/*/pipeline/**": ["CRM_ACCESS", "ADMIN", "SUPER_ADMIN"]
          
          # Billing Routes
          "/api/*/billing/**": ["BILLING_ACCESS", "ADMIN", "SUPER_ADMIN"]
          "/api/*/payments/**": ["BILLING_ACCESS", "ADMIN", "SUPER_ADMIN"]
          "/api/*/subscriptions/**": ["BILLING_ACCESS", "ADMIN", "SUPER_ADMIN"]
          "/api/*/invoices/**": ["BILLING_ACCESS", "ADMIN", "SUPER_ADMIN"]
          
          # Admin Routes
          "/api/*/admin/**": ["ADMIN", "SUPER_ADMIN"]
          "/actuator/**": ["ADMIN", "SUPER_ADMIN"]
          
          # API Routes (general)
          "/api/**": ["API_ACCESS", "CRM_ACCESS", "BILLING_ACCESS", "USER", "ADMIN", "SUPER_ADMIN"]
      
      accessControl:
        enableFeatureValidation: true
        enableMicroserviceValidation: true
        enableRouteValidation: true
        bypassAuthorities: ["SUPER_ADMIN"]
  
  cache:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST:localhost}
      port: ${IQSCAFFOLD_CACHE_REDIS_PORT:6379}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD:}
      database: ${IQSCAFFOLD_CACHE_REDIS_DATABASE:0}
      timeout: PT2S
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: PT-1S
      key-prefix: "iqscaffold:gateway"
      default-ttl: PT1H
      enable-statistics: false
  
  gateway:
    routing:
      # API prefix configuration - allows stripping /api prefix when deployed on api.iqscaffold.com
      api-prefix:
        enabled: true
        prefix: /api
        strip-count: 0  # Number of path segments to strip (0 = no stripping, 1 = strip first segment)
      services:
        user-service:
          uri: ${IQSCAFFOLD_GATEWAY_ROUTING_USER_SERVICE_URI:http://localhost:8080}
          path: /v1/**
          enabled: true
          connect-timeout: 5000
          response-timeout: 30000
          openapi:
            enabled: true
            display-name: "User Service APIs"
            description: "Authentication and user management APIs"
            context-path: "user-service"
        billing-service:
          uri: ${IQSCAFFOLD_GATEWAY_ROUTING_BILLING_SERVICE_URI:http://localhost:8082}
          path: /v1/**
          enabled: true
          connect-timeout: 5000
          response-timeout: 30000
          openapi:
            enabled: true
            display-name: "Billing Service APIs"
            description: "Payments, subscriptions, invoicing, and feature management APIs"
            context-path: "billing-service"
      enable-service-discovery: false
      load-balancing:
        strategy: round-robin
        enable-health-check: true
        health-check-interval: PT30S
    
    security:
      jwt:
        access-token-expiry: PT15M
        refresh-token-expiry: P7D
        issuer: iqscaffold-user-service
        audience: iqscaffold-services
        algorithm: RS256
        jwk-set-uri: ${USER_SERVICE_JWK_URI:http://user-service:8080/.well-known/jwks.json}
      authentication:
        enabled: true
        user-service-url: ${IQSCAFFOLD_GATEWAY_SECURITY_USER_SERVICE_URL:http://user-service:8080}
        token-validation-timeout: PT5S
        enable-user-context-propagation: true
      public-paths:
        # JWK endpoint for public key distribution
        - /.well-known/jwks.json
        
        # Self-service provisioning endpoints (public)
        - /api/v1/public/**
        
        # Authentication endpoints (public)
        - /api/v1/auth/login
        - /api/v1/auth/signup
        - /api/v1/auth/refresh
        - /api/v1/auth/validate
        - /api/v1/auth/health
        
        # Email verification endpoints (public)
        - /api/v1/auth/email/verify
        - /api/v1/auth/email/resend
        - /api/v1/auth/email/status
        
        # Password reset endpoints (public)
        - /api/v1/auth/password/forgot
        - /api/v1/auth/password/reset
        
        # Actuator endpoints (public health checks)
        - /actuator/health
        - /actuator/info
        
        # API Documentation endpoints (public in development)
        - /api/v1/docs
        - /swagger-ui/**
        - /api-docs/**
        - /user-service/swagger-ui/**
        - /user-service/api-docs/**
        - /billing-service/swagger-ui/**
        - /billing-service/api-docs/**
        - /lead-service/swagger-ui/**
        - /lead-service/api-docs/**
        - /pipeline-service/swagger-ui/**
        - /pipeline-service/api-docs/**
        - /contact-service/swagger-ui/**
        - /contact-service/api-docs/**
        - /actuator/prometheus
        
        # Billing Service Webhooks (public - no authentication required)
        - /api/v1/billing/webhooks/**
        
        # Contact Service Webhooks (public - for external providers)
        - /api/v1/crm/webhooks/**
        
        # Billing Service OpenAPI Documentation (public)
        - /billing-service/v3/api-docs/**
        - /billing-service/swagger-resources/**
        - /billing-service/swagger-config/**
        - /billing-service/swagger-ui.html
        - /billing-service/webjars/**
        
        # CRM Services OpenAPI Documentation (public)
        - /lead-service/v3/api-docs/**
        - /lead-service/swagger-resources/**
        - /lead-service/swagger-config/**
        - /lead-service/swagger-ui.html
        - /lead-service/webjars/**
        - /pipeline-service/v3/api-docs/**
        - /pipeline-service/swagger-resources/**
        - /pipeline-service/swagger-config/**
        - /pipeline-service/swagger-ui.html
        - /pipeline-service/webjars/**
        - /contact-service/v3/api-docs/**
        - /contact-service/swagger-resources/**
        - /contact-service/swagger-config/**
        - /contact-service/swagger-ui.html
        - /contact-service/webjars/**
        
        # Billing Service Public Subscription Plans (for pricing pages)
        - /api/v1/billing/subscription-plans/active
        - /api/v1/billing/subscription-plans
        
        # Protected endpoints requiring authentication:
        # - /api/v1/billing/payments/** (requires Bearer token + USER role)
        # - /api/v1/billing/subscriptions/** (requires Bearer token + appropriate role)
        # - /api/v1/billing/invoices/** (requires Bearer token + billing access)
        # - /api/v1/billing/payouts/** (requires Bearer token + billing access)
        # - /api/v1/admin/billing/** (requires Bearer token + BILLING_ADMIN/TENANT_OWNER/SUPER_ADMIN role)
        # - /api/v1/auth/logout (requires Bearer token)
        # - /api/v1/auth/logout-all (requires Bearer token)
        # - /api/v1/users/me (requires Bearer token)
        # - /api/v1/users/me/password (requires Bearer token)
        # - /api/v1/admin/** (requires Bearer token + ADMIN role)
        # 
        # CRM endpoints requiring authentication:
        # - /api/v1/leads/** (requires Bearer token + USER role)
        # - /api/v1/leads/{leadId}/notes/** (requires Bearer token + USER role)
        # - /api/v1/leads/{leadId}/activities/** (requires Bearer token + USER role)
        # - /api/v1/pipeline/** (requires Bearer token + USER role)
        # - /api/v1/pipeline/follow-ups/** (requires Bearer token + USER role)
        # - /api/v1/pipeline/dashboard/** (requires Bearer token + USER role)
        # - /api/v1/contacts/** (requires Bearer token + USER role)
        # - /api/v1/companies/** (requires Bearer token + USER role)
        # - /api/v1/webhooks/** (Public - for external providers; management requires ADMIN role)
    
    rate-limiting:
      enabled: true
      redis:
        key-prefix: "iqscaffold:gateway:rate-limit"
        key-expiry: PT1M
      policies:
        default-requests-per-minute: 60
        default-burst-capacity: 100
        endpoints:
          "/api/v1/auth/login":
            requests-per-minute: 10
            burst-capacity: 20
            enable-tenant-quotas: true
          "/api/v1/auth/signup":
            requests-per-minute: 5
            burst-capacity: 10
            enable-tenant-quotas: true
          "/api/v1/auth/email/resend":
            requests-per-minute: 3
            burst-capacity: 5
            enable-tenant-quotas: true
          "/api/v1/auth/email/verify":
            requests-per-minute: 10
            burst-capacity: 15
            enable-tenant-quotas: true
          "/api/v1/auth/password/forgot":
            requests-per-minute: 3
            burst-capacity: 5
            enable-tenant-quotas: true
          "/api/v1/auth/password/reset":
            requests-per-minute: 5
            burst-capacity: 10
            enable-tenant-quotas: true
          "/api/v1/users/me":
            requests-per-minute: 100
            burst-capacity: 150
            enable-tenant-quotas: true
          "/api/v1/users/me/password":
            requests-per-minute: 5
            burst-capacity: 10
            enable-tenant-quotas: true
          "/api/v1/users/me/preferences":
            requests-per-minute: 100
            burst-capacity: 150
            enable-tenant-quotas: true
          "/api/v1/admin/users/**":
            requests-per-minute: 100
            burst-capacity: 150
            enable-tenant-quotas: true
          "/api/v1/admin/organizations/**":
            requests-per-minute: 100
            burst-capacity: 150
            enable-tenant-quotas: true
          "/api/v1/admin/organization-preferences/**":
            requests-per-minute: 100
            burst-capacity: 150
            enable-tenant-quotas: true
          "/api/v1/admin/tenants/**":
            requests-per-minute: 50
            burst-capacity: 75
            enable-tenant-quotas: true

          # Feature Management Endpoints
          "/api/v1/features/my-features":
            requests-per-minute: 100
            burst-capacity: 150
            enable-tenant-quotas: true
          "/api/v1/features/enabled":
            requests-per-minute: 200
            burst-capacity: 300
            enable-tenant-quotas: true

          # Billing Service Endpoints
          "/api/v1/billing/subscriptions":
            requests-per-minute: 40
            burst-capacity: 60
            enable-tenant-quotas: true
          "/api/v1/billing/subscriptions/**":
            requests-per-minute: 50
            burst-capacity: 75
            enable-tenant-quotas: true
          "/api/v1/billing/payments/**":
            requests-per-minute: 60
            burst-capacity: 100
            enable-tenant-quotas: true
          "/api/v1/billing/invoices/**":
            requests-per-minute: 40
            burst-capacity: 60
            enable-tenant-quotas: true
          "/api/v1/billing/payouts/**":
            requests-per-minute: 40
            burst-capacity: 60
            enable-tenant-quotas: true
          "/api/v1/billing/subscription-plans/**":
            requests-per-minute: 40
            burst-capacity: 60
            enable-tenant-quotas: true
          "/api/v1/admin/billing/**":
            requests-per-minute: 20
            burst-capacity: 30
            enable-tenant-quotas: true
          "/api/v1/billing/webhooks/**":
            requests-per-minute: 200
            burst-capacity: 500
            enable-tenant-quotas: false

      tenant-quotas:
        enabled: true
        default-tenant-requests-per-minute: 1000
        tenant-specific-quotas: { }
    
    circuit-breaker:
      enabled: true
      failure-rate-threshold: 50
      slow-call-rate-threshold: 50
      slow-call-duration-threshold: PT2S
      minimum-number-of-calls: 10
      wait-duration-in-open-state: PT30S
      sliding-window-size: 100
      sliding-window-type: COUNT_BASED
    
    cors:
      enabled: true
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
        - http://localhost:8080
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
      max-age: 3600
    
    transformation:
      request:
        enabled: true
        enable-header-enrichment: true
        enable-user-context-propagation: true
        enable-tenant-context-propagation: true
        headers-to-remove:
          - Authorization-Internal
          - X-Internal-Token
        additional-headers:
          X-Gateway-Version: "1.0.0"
      response:
        enabled: true
        enable-security-headers: true
        enable-correlation-headers: true
        remove-internal-headers: true
        additional-headers-to-remove:
          - X-Internal-Service
          - X-Database-Query-Time

  observability:
    tracing:
      enabled: true
      service-name: ${spring.application.name}
      sampling-rate: 1.0
      endpoint: ${IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT:http://localhost:4317}
      timeout: PT10S
      export-timeout: PT30S
      batch-size: 512
    metrics:
      enabled: true
      path: /actuator/prometheus
      prefix: iqscaffold_gateway
      include-host-tag: true
      include-application-tag: true
      include-environment-tag: true
      custom-tags:
        service: gateway-service
      enabled-metrics:
        - gateway.requests
        - gateway.response.time
        - gateway.circuit.breaker
        - gateway.rate.limit
    logging:
      level: INFO
      format: console
      enable-request-logging: true
      enable-response-logging: false
      enable-correlation-id: true
      include-trace-id: true
      include-span-id: true
      include-user-id: true
      include-tenant-id: true
      correlation-id-header: X-Correlation-ID
      request-id-header: X-Request-ID
      tenant-id-header: X-Tenant-ID

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls-primary-name: Gateway APIs
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      access: read_only
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true
