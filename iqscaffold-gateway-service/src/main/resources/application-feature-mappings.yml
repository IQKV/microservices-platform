# Feature Access Configuration for IQ Scaffold Gateway
# This configuration maps API endpoints to required features for subscription-based access control

iqscaffold:
  gateway:
    feature-access:
      enabled: true
      
      # Paths excluded from feature validation (public endpoints, health checks, etc.)
      excluded-paths:
        - "/actuator/**"
        - "/api/v1/public/**"
        - "/api/v1/auth/**"
        - "/api/v1/health/**"
        - "/swagger-ui/**"
        - "/v3/api-docs/**"
        - "/favicon.ico"
        - "/error"
      
      # Cache configuration for feature validation
      cache:
        ttl: PT15M  # 15 minutes
        max-size: 1000
        enable-statistics: true
      
      # Feature-to-endpoint mappings
      mappings:
        # Analytics Features
        - path-pattern: "/api/v1/analytics/**"
          required-features: ["advanced_analytics"]
          description: "Advanced analytics and reporting features"
        
        - path-pattern: "/api/v1/reports/advanced/**"
          required-features: ["advanced_analytics"]
          description: "Advanced reporting capabilities"
        
        - path-pattern: "/api/v1/dashboards/custom/**"
          required-features: ["advanced_analytics"]
          description: "Custom dashboard creation"
        
        # Data Export Features
        - path-pattern: "/api/v1/export/**"
          required-features: ["data_export"]
          description: "Data export in various formats"
        
        - path-pattern: "/api/v1/reports/export"
          methods: ["POST"]
          required-features: ["data_export"]
          description: "Report export functionality"
        
        # Integration Features
        - path-pattern: "/api/v1/integrations/**"
          required-features: ["third_party_integrations"]
          description: "Third-party service integrations"
        
        - path-pattern: "/api/v1/webhooks/**"
          required-features: ["third_party_integrations"]
          description: "Webhook management"
        
        - path-pattern: "/api/v1/api-keys/**"
          required-features: ["third_party_integrations"]
          description: "API key management for integrations"
        
        # Team Management Features (Limit-based)
        - path-pattern: "/api/v1/team/members"
          methods: ["POST"]
          required-features: ["max_team_members"]
          description: "Adding new team members (subject to plan limits)"
        
        - path-pattern: "/api/v1/users/invite"
          methods: ["POST"]
          required-features: ["max_team_members"]
          description: "User invitation (subject to plan limits)"
        
        # Storage Features (Quota-based)
        - path-pattern: "/api/v1/files/upload"
          methods: ["POST"]
          required-features: ["storage_quota"]
          description: "File upload (subject to storage quota)"
        
        - path-pattern: "/api/v1/documents/**"
          methods: ["POST", "PUT"]
          required-features: ["storage_quota"]
          description: "Document management (subject to storage quota)"
        
        # API Usage Features (Quota-based)
        - path-pattern: "/api/v1/external/**"
          required-features: ["api_calls_monthly"]
          description: "External API calls (subject to monthly quota)"
        
        # Security Features
        - path-pattern: "/api/v1/sso/**"
          required-features: ["sso_integration"]
          description: "Single Sign-On configuration"
        
        - path-pattern: "/api/v1/audit/**"
          required-features: ["audit_logging"]
          description: "Audit log access and management"
        
        - path-pattern: "/api/v1/compliance/**"
          required-features: ["audit_logging"]
          description: "Compliance reporting and audit trails"
        
        # Admin Features (Multiple requirements)
        - path-pattern: "/api/v1/admin/analytics/**"
          required-features: ["advanced_analytics", "audit_logging"]
          description: "Administrative analytics (requires multiple features)"
        
        - path-pattern: "/api/v1/admin/export/**"
          required-features: ["data_export", "audit_logging"]
          description: "Administrative data export with audit trail"
        
        # Support Features (Tier-based)
        - path-pattern: "/api/v1/support/priority/**"
          required-features: ["support_level"]
          description: "Priority support features (tier-dependent)"
        
        - path-pattern: "/api/v1/support/chat/**"
          required-features: ["support_level"]
          description: "Live chat support (tier-dependent)"
        
        # CRM Lead Management Features
        - path-pattern: "/api/v1/leads"
          methods: ["POST"]
          required-features: ["max_leads"]
          description: "Lead creation (subject to plan limits)"
        
        - path-pattern: "/api/v1/leads/**"
          methods: ["GET", "PUT", "PATCH"]
          required-features: ["lead_management"]
          description: "Lead management operations"
        
        - path-pattern: "/api/v1/leads/*/activities/**"
          required-features: ["lead_management"]
          description: "Lead activity tracking"
        
        - path-pattern: "/api/v1/leads/*/notes/**"
          required-features: ["lead_management"]
          description: "Lead notes management"
        
        - path-pattern: "/api/v1/leads/export"
          methods: ["POST"]
          required-features: ["data_export", "lead_management"]
          description: "Lead data export"
        
        # CRM Contact Management Features
        - path-pattern: "/api/v1/contacts"
          methods: ["POST"]
          required-features: ["max_contacts"]
          description: "Contact creation (subject to plan limits)"
        
        - path-pattern: "/api/v1/contacts/**"
          methods: ["GET", "PUT", "PATCH"]
          required-features: ["contact_management"]
          description: "Contact management operations"
        
        - path-pattern: "/api/v1/companies"
          methods: ["POST"]
          required-features: ["max_companies"]
          description: "Company creation (subject to plan limits)"
        
        - path-pattern: "/api/v1/companies/**"
          methods: ["GET", "PUT", "PATCH"]
          required-features: ["contact_management"]
          description: "Company management operations"
        
        - path-pattern: "/api/v1/contacts/export"
          methods: ["POST"]
          required-features: ["data_export", "contact_management"]
          description: "Contact data export"
        
        # CRM Pipeline Management Features
        - path-pattern: "/api/v1/pipeline/stages"
          methods: ["POST"]
          required-features: ["max_pipeline_stages"]
          description: "Pipeline stage creation (subject to plan limits)"
        
        - path-pattern: "/api/v1/pipeline/**"
          methods: ["GET", "PUT", "PATCH"]
          required-features: ["pipeline_management"]
          description: "Pipeline management operations"
        
        - path-pattern: "/api/v1/pipeline/dashboard/**"
          required-features: ["advanced_analytics", "pipeline_management"]
          description: "Advanced pipeline analytics dashboard"
        
        - path-pattern: "/api/v1/pipeline/follow-ups/**"
          required-features: ["pipeline_management"]
          description: "Follow-up management"
        
        - path-pattern: "/api/v1/pipeline/export"
          methods: ["POST"]
          required-features: ["data_export", "pipeline_management"]
          description: "Pipeline data export"
        
        # CRM Integration Features
        - path-pattern: "/api/v1/crm/webhooks/**"
          required-features: ["third_party_integrations"]
          description: "CRM webhook management for integrations"

    # Request transformation configuration
    transformation:
      request:
        enabled: true
        enable-header-enrichment: true
        enable-user-context-propagation: true
        enable-tenant-context-propagation: true
        enable-feature-context-propagation: true
        headers-to-remove:
          - "Authorization-Internal"
          - "X-Internal-Token"
        additional-headers: {}
      
      response:
        enabled: true
        enable-security-headers: true
        enable-correlation-headers: true
        remove-internal-headers: true
        additional-headers-to-remove:
          - "X-Internal-Service"
          - "X-Database-Query-Time"