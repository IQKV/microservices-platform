server:
  port: 0  # Random port for tests

spring:
  application:
    name: iqscaffold-gateway-service-test
  main:
    allow-bean-definition-overriding: true
    web-application-type: none  # Disable web application for basic tests
  cloud:
    gateway:
      enabled: false  # Disable gateway for basic tests
    loadbalancer:
      enabled: false  # Disable load balancer
  data:
    redis:
      repositories:
        enabled: false  # Disable Redis repositories

# Minimal IQ Scaffold Gateway Test Configuration
iqscaffold:
  observability:
    tracing:
      enabled: false  # Disabled for unit tests
    metrics:
      enabled: false  # Disabled for unit tests
    logging:
      level: DEBUG
      format: console
      enable-request-logging: false
      enable-response-logging: false
      enable-correlation-id: false
      include-trace-id: false
      include-span-id: false

# Logging Configuration
logging:
  level:
    com.iqscaffold: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    reactor.netty: WARN

# Management Configuration
management:
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: false
  tracing:
    sampling:
      probability: 0.0
