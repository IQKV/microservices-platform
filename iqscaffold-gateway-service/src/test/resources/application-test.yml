server:
  port: 0  # Random port for tests

spring:
  application:
    name: iqscaffold-gateway-service-test
  main:
    allow-bean-definition-overriding: true
    web-application-type: reactive  # Enable reactive web for gateway tests
  cloud:
    gateway:
      enabled: true  # Enable gateway for route tests
    loadbalancer:
      enabled: false  # Disable load balancer
  data:
    redis:
      repositories:
        enabled: false  # Disable Redis repositories

# Minimal IQ Scaffold Gateway Test Configuration
iqscaffold:
  cache:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0
      timeout: PT5S
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: PT2S
      key-prefix: "iqscaffold:test:"
      default-ttl: PT1H
      enable-statistics: false
  gateway:
    routing:
      api-prefix:
        enabled: true
        prefix: "/api"
        strip-count: 0
      services:
        billing-service:
          uri: "http://billing-service:8080"
          path: "/api/v1/billing/**"
          enabled: true
          connect-timeout: 5000
          response-timeout: 30000
          openapi:
            enabled: false
            display-name: "Billing Service"
            description: "Billing and subscription management"
            context-path: "/billing"
      load-balancing:
        strategy: "round-robin"
        enable-health-check: false
        health-check-interval: PT30S
    security:
      jwt:
        access-token-expiry: PT15M
        refresh-token-expiry: P7D
        issuer: "iqscaffold-test"
        audience: "iqscaffold-api"
        algorithm: "RS256"
        jwk-set-uri: "http://user-service:8080/api/v1/auth/.well-known/jwks.json"
      authentication:
        enabled: false
        user-service-url: "http://user-service:8080"
        token-validation-timeout: PT5S
        enable-user-context-propagation: false
      public-paths:
        - "/actuator/**"
        - "/api/v1/auth/**"
    rate-limiting:
      enabled: false
      redis:
        key-prefix: "rate_limit:test:"
        key-expiry: PT1M
      policies:
        default-requests-per-minute: 1000
        default-burst-capacity: 2000
        endpoints: {}
      tenant-quotas:
        enabled: false
        default-tenant-requests-per-minute: 5000
        tenant-specific-quotas: {}
    circuit-breaker:
      enabled: true
      failure-rate-threshold: 50
      slow-call-rate-threshold: 50
      slow-call-duration-threshold: PT2S
      minimum-number-of-calls: 10
      wait-duration-in-open-state: PT10S
      sliding-window-size: 100
      sliding-window-type: "COUNT_BASED"
    cors:
      enabled: false
      allowed-origins: []
      allowed-methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      allowed-headers: ["*"]
      allow-credentials: false
      max-age: 3600
    transformation:
      request:
        enabled: false
        enable-header-enrichment: false
        enable-user-context-propagation: false
        enable-tenant-context-propagation: false
        enable-feature-context-propagation: false
        headers-to-remove: []
        additional-headers: {}
      response:
        enabled: false
        enable-security-headers: false
        enable-correlation-headers: false
        remove-internal-headers: false
        additional-headers-to-remove: []
    feature-access:
      enabled: false
      excluded-paths:
        - "/actuator/**"
        - "/api/v1/auth/**"
        - "/api/v1/billing/webhooks/**"
      mappings: []
      cache:
        ttl: PT5M
        max-size: 1000
        enable-statistics: false
  i18n:
    supported-locales: ["en", "es", "fr"]
    default-locale: "en"
  observability:
    tracing:
      enabled: false  # Disabled for unit tests
      service-name: "iqscaffold-gateway-test"
      sampling-rate: 0.0
      endpoint: "http://localhost:4318/v1/traces"
      timeout: PT10S
      export-timeout: PT2S
      batch-size: 512
    metrics:
      enabled: false  # Disabled for unit tests
      path: "/actuator/prometheus"
      prefix: "iqscaffold_gateway"
      include-host-tag: false
      include-application-tag: false
      include-environment-tag: false
      custom-tags: {}
      enabled-metrics: []
    logging:
      level: DEBUG
      format: console
      enable-request-logging: false
      enable-response-logging: false
      enable-correlation-id: false
      include-trace-id: false
      include-span-id: false
      include-user-id: false
      include-tenant-id: false
      correlation-id-header: "X-Correlation-ID"
      request-id-header: "X-Request-ID"
      tenant-id-header: "X-Tenant-ID"

# Logging Configuration
logging:
  level:
    com.iqscaffold: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    reactor.netty: WARN

# Management Configuration
management:
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: false
  tracing:
    sampling:
      probability: 0.0
