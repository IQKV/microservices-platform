spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true
        # Enable statistics for testing entity graph performance
        generate_statistics: true
        # Disable second level cache for cleaner testing
        cache:
          use_second_level_cache: false
          use_query_cache: false
        # Disable multi-tenancy for tests
        multiTenancy: NONE
    open-in-view: false

  # Disable Redis for tests
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      
  # Disable RabbitMQ for tests
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    
  # Disable session management for tests
  session:
    store-type: none

# Application properties for tests
iqscaffold:
  auth:
    jwt:
      issuer: test-issuer
      audience: test-audience
      expiration: 3600
      refresh-expiration: 86400
      algorithm: RS256
      key-rotation-interval: 86400
  database:
    tenant:
      default-schema: public
      schema-prefix: tenant_
  cache:
    redis:
      enabled: false
  messaging:
    rabbitmq:
      enabled: false

# Logging configuration for entity graph testing
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.stat: DEBUG
    com.iqscaffold.userservice: DEBUG