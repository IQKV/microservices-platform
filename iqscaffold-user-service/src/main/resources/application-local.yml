# Local Development Environment Configuration
# This configuration is optimized for development with debug logging and relaxed security

server :
  port : 8080

spring :
  # Database Configuration - Local PostgreSQL
  datasource :
    url : ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://localhost:5432/iqscaffold_user_local}
    username : ${IQSCAFFOLD_DATABASE_USERNAME:iqscaffold_user}
    password : ${IQSCAFFOLD_DATABASE_PASSWORD:iqscaffold_password}
    driver-class-name : org.postgresql.Driver
    hikari :
      maximum-pool-size : 10
      minimum-idle : 2
      connection-timeout : 20000
      idle-timeout : 300000
      max-lifetime : 1200000
      leak-detection-threshold : 60000

  # JPA Configuration - Development Settings
  jpa :
    hibernate :
      ddl-auto : validate
    show-sql : true
    properties :
      hibernate :
        dialect : org.hibernate.dialect.PostgreSQLDialect
        format_sql : true
        use_sql_comments : true
        multiTenancy : SCHEMA
        generate_statistics : true
        jdbc :
          batch_size : 20
        order_inserts : true
        order_updates : true
    open-in-view : false

  # Redis Configuration - Local Redis
  data :
    redis :
      host : ${IQSCAFFOLD_CACHE_REDIS_HOST:localhost}
      port : ${IQSCAFFOLD_CACHE_REDIS_PORT:6379}
      password : ${IQSCAFFOLD_CACHE_REDIS_PASSWORD:}
      database : ${IQSCAFFOLD_CACHE_REDIS_DATABASE:0}
      timeout : 2000ms
      lettuce :
        pool :
          max-active : 8
          max-idle : 8
          min-idle : 0
          max-wait : -1ms

  # Liquibase Configuration
  # Disabled globally - migrations are run programmatically per schema via TenantLiquibaseRunner
  liquibase :
    enabled : false

# IQ Scaffold Configuration - Local Environment
iqscaffold :
  # Database Configuration
  database :
    url : ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://localhost:5432/iqscaffold_user_local}
    username : ${IQSCAFFOLD_DATABASE_USERNAME:iqscaffold_user}
    password : ${IQSCAFFOLD_DATABASE_PASSWORD:iqscaffold_password}
    pool :
      maximum-size : 10
      minimum-idle : 2
      connection-timeout : PT20S
      idle-timeout : PT5M
      max-lifetime : PT20M

  # Cache Configuration - Redis
  cache :
    redis :
      host : ${IQSCAFFOLD_CACHE_REDIS_HOST:localhost}
      port : ${IQSCAFFOLD_CACHE_REDIS_PORT:6379}
      password : ${IQSCAFFOLD_CACHE_REDIS_PASSWORD:}
      database : ${IQSCAFFOLD_CACHE_REDIS_DATABASE:0}
      timeout : PT2S
      pool :
        max-active : 8
        max-idle : 8
        min-idle : 0
        max-wait : PT-1S
      key-prefix : "iqscaffold:auth:local"
      default-ttl : PT1H
      enable-statistics : true

  # Authentication Configuration
  auth :
    jwt :
      secret-key : ${IQSCAFFOLD_AUTH_JWT_SECRET:local-development-secret-key-not-for-production-use}
      access-token-expiry : PT30M  # Extended for development
      refresh-token-expiry : P30D  # Extended for development
      issuer : iqscaffold-user-service-local
      audience : iqscaffold-services-local
      algorithm : HS256

  # Email Configuration - Local Development
  email :
    smtp :
      host : ${SMTP_HOST:localhost}
      port : ${SMTP_PORT:1025}  # MailHog default port for local development
      username : ${SMTP_USERNAME:}
      password : ${SMTP_PASSWORD:}
      auth : false  # Disabled for local MailHog
      starttls : false  # Disabled for local development
      timeout : PT30S
    sender :
      from-email : ${EMAIL_FROM_EMAIL:noreply@iqscaffold.local}
      from-name : ${EMAIL_FROM_NAME:IQ Scaffold Platform (Local)}
      base-url : ${APP_BASE_URL:http://localhost:3000}
    verification :
      token-expiry : PT24H
      rate-limit : 10  # More lenient for development
    templates :
      verification-subject : "[LOCAL] Verify your IQ Scaffold account"
      verification-template : "email/user-registration/email-verification.html"
      password-reset-subject : "[LOCAL] Reset your IQ Scaffold password"
      password-reset-template : "email/password-reset/initiate.html"
      password-reset-confirmed-subject : "[LOCAL] Password Reset Successful - IQ Scaffold"
      password-reset-confirmed-template : "email/password-reset/confirmed.html"
      registration-confirmed-subject : "[LOCAL] Welcome to IQ Scaffold - Email Verified!"
      registration-confirmed-template : "email/user-registration/email-confirmed.html"
  
  security :
    password :
      encoder-strength : 10  # Lower for faster development
      require-special-chars : false  # Relaxed for development
      min-length : 6  # Relaxed for development
    rate-limiting :
      login-attempts : 10  # More lenient for development
      lockout-duration : PT5M  # Shorter lockout for development
    session :
      timeout : PT8H  # Extended for development
      concurrent-sessions : 5
  
  oauth2 :
    enabled : false  # Disabled for local development
    providers : { }

  # Observability Configuration - Development
  observability :
    tracing :
      enabled : true
      service-name : ${spring.application.name}
      sampling-rate : 1.0  # Full sampling for development
      endpoint : ${IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT:http://localhost:4317}
      timeout : PT10S
      export-timeout : PT30S
      batch-size : 512
    metrics :
      enabled : true
      path : /actuator/prometheus
      prefix : iqscaffold_user_local
      include-host-tag : true
      include-application-tag : true
      include-environment-tag : true
      custom-tags :
        environment : local
        service : user-service
    logging :
      level : DEBUG  # Verbose logging for development
      format : console  # Human-readable format
      include-correlation-id : true
      include-trace-id : true
      include-span-id : true
      include-user-id : true
      include-tenant-id : true
      correlation-id-header : X-Correlation-ID
      request-id-header : X-Request-ID
      tenant-id-header : X-Tenant-ID
      enable-sql-logging : true
      enable-security-events : true
      enable-performance-logging : true
  
  tenant-id-header : X-Tenant-ID
  
  tenancy :
    schema :
      prefix : tenant_
      default : public
  
  liquibase :
    systemChangeLog : classpath:db/changelog/system/master.xml
    tenantChangeLog : classpath:db/changelog/tenant/master.xml
    # System changelog runs once on startup for public schema (tenants table, etc.)
    # Tenant changelog runs per-tenant schema during tenant provisioning

# Logging Configuration - Development
logging :
  level :
    com.iqscaffold : DEBUG
    org.springframework.security : DEBUG
    org.springframework.web : DEBUG
    org.hibernate.SQL : DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder : TRACE
    liquibase : INFO
    com.zaxxer.hikari : DEBUG
  pattern :
    console : "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"
    file : "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"

# Management Configuration - Development
management :
  endpoints :
    web :
      exposure :
        include : "*"  # Expose all endpoints for development
  endpoint :
    health :
      show-details : always  # Always show health details in development
    liquibase :
      access : read_only
    prometheus :
      access : read_only
  metrics :
    distribution :
      percentiles-histogram :
        http.server.requests : true
      percentiles :
        http.server.requests : 0.5,0.95,0.99
  tracing :
    sampling :
      probability : 1.0  # Full tracing in development
  prometheus :
    metrics :
      export :
        enabled : true

# SpringDoc Configuration - Development
springdoc :
  api-docs :
    enabled : true
  swagger-ui :
    enabled : true
    try-it-out-enabled : true
    operations-sorter : alpha
    tags-sorter : alpha
    filter : true
    display-request-duration : true
    display-operation-id : true
