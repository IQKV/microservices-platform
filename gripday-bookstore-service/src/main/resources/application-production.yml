# ============================================================================
# Gripday Bookstore Service - Production Configuration
# ============================================================================
# Profile: production
# Purpose: Production deployment
#
# Environment Variables Required:
#   - DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
#   - REDIS_HOST, REDIS_PORT, REDIS_PASSWORD
#   - JWT_ISSUER_URI, JWT_JWK_SET_URI
#   - CORS_ALLOWED_ORIGINS
#   - SERVER_PORT (optional, defaults to 8081)
#
# Security Considerations:
#   - All credentials via environment variables
#   - Minimal logging (WARN level)
#   - Restricted CORS origins
#   - Limited actuator exposure
#   - Connection leak detection enabled
#
# Usage:
#   java -jar bookstore-service.jar --spring.profiles.active=production
# ============================================================================

spring :
  # ============================================================================
  # Database Configuration - Production PostgreSQL
  # ============================================================================
  datasource :
    url : jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username : ${DB_USERNAME}
    password : ${DB_PASSWORD}
    hikari :
      maximum-pool-size : 20
      minimum-idle : 5
      connection-timeout : 30000
      idle-timeout : 600000
      max-lifetime : 1800000
      leak-detection-threshold : 60000  # Detect connection leaks
      connection-test-query : SELECT 1  # Validate connections
  
  # ============================================================================
  # JPA Configuration - Production
  # ============================================================================
  jpa :
    open-in-view : false
    hibernate :
      ddl-auto : validate
    show-sql : false
    properties :
      hibernate :
        dialect : org.hibernate.dialect.PostgreSQLDialect
        format_sql : true
        jdbc :
          batch_size : 20
        order_inserts : true
        order_updates : true
  
  # ============================================================================
  # Liquibase Configuration - Production
  # ============================================================================
  liquibase :
    change-log : classpath:db/changelog/master.xml
    enabled : true
  
  # ============================================================================
  # Redis Configuration - Production Redis
  # ============================================================================
  data :
    redis :
      host : ${REDIS_HOST}
      port : ${REDIS_PORT:6379}
      password : ${REDIS_PASSWORD}
      timeout : 5000ms
      lettuce :
        pool :
          max-active : 32
          max-idle : 16
          min-idle : 4
        shutdown-timeout : 100ms
  
  cache :
    type : redis
    redis :
      time-to-live : 900000  # 15 minutes for production
      cache-null-values : false
  
  # ============================================================================
  # Security Configuration - Production User Service
  # ============================================================================
  security :
    oauth2 :
      resourceserver :
        jwt :
          issuer-uri : ${JWT_ISSUER_URI}
          jwk-set-uri : ${JWT_JWK_SET_URI}

# ============================================================================
# Server Configuration - Production
# ============================================================================
server :
  port : ${SERVER_PORT:8081}
  servlet :
    context-path : /
  error :
    include-message : always
    include-binding-errors : always
  shutdown : graceful
  
  # Graceful shutdown timeout
  lifecycle :
    timeout-per-shutdown-phase : 30s
  
  # Compression for better performance
  compression :
    enabled : true
    mime-types : application/json,application/xml,text/html,text/xml,text/plain
    min-response-size : 1024

# ============================================================================
# Logging Configuration - Production (Minimal)
# ============================================================================
# Only WARN and ERROR logs for application code
# AUDIT logs always enabled for security compliance
# ============================================================================
logging :
  level :
    root : WARN
    org.gripday.bookstore : WARN
    org.springframework : WARN
    org.springframework.security : WARN
    org.springframework.cache : WARN
    org.hibernate : WARN
    AUDIT : INFO  # Always log security events
  pattern :
    console : "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} [%thread] %-5level [%X{correlationId}] [%X{userId}:%X{username}] %logger{36} - %msg%n"

# ============================================================================
# Actuator Configuration - Minimal Exposure for Security
# ============================================================================
management :
  endpoints :
    web :
      exposure :
        include : health,info,metrics,prometheus  # Only essential endpoints
      base-path : /actuator
  endpoint :
    health :
      show-details : never  # Hide internal details
      show-components : never
      probes :
        enabled : true
    metrics :
      enabled : true
    prometheus :
      enabled : true
  health :
    defaults :
      enabled : true
    db :
      enabled : true
    redis :
      enabled : true
    diskspace :
      enabled : true
  metrics :
    distribution :
      percentiles-histogram :
        "[http.server.requests]" : true
        "[bookstore.books.search.duration]" : true
        "[bookstore.books.creation.duration]" : true
        "[bookstore.inventory.update.duration]" : true
    tags :
      application : bookstore-service
      environment : production
  prometheus :
    metrics :
      export :
        enabled : true
        step : 60s
        descriptions : true

# ============================================================================
# OpenAPI / Swagger Documentation - Production (Disabled)
# ============================================================================
springdoc :
  api-docs :
    enabled : false
    path : /api-docs
  swagger-ui :
    enabled : false
    path : /swagger-ui.html
    operationsSorter : method
    tagsSorter : alpha
    tryItOutEnabled : false
    filter : true
    displayRequestDuration : true
    displayOperationId : false
    defaultModelsExpandDepth : 1
    defaultModelExpandDepth : 1
    docExpansion : none
  show-actuator : false

# ============================================================================
# CORS Configuration - Production Frontend Only
# ============================================================================
gripday :
  bookstore :
    cors :
      allowed-origins : ${CORS_ALLOWED_ORIGINS:https://bookstore.gripday.com}
      allowed-methods : "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers : "Authorization,Content-Type,X-Correlation-ID,X-Tenant-ID"
      allow-credentials : true
      max-age : 3600
