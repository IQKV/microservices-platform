spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  liquibase:
    enabled: false
  
  data:
    redis:
      host: localhost
      port: 6370  # Different port for test
  
  cache:
    type: simple
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: # Disable JWT for tests

eureka:
  client:
    enabled: false

logging:
  level:
    org.gripday.bookstore: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG