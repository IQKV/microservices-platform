version: "3.8"

services:
  bookstore-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstore-service-staging
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=staging
      - DB_HOST=${DB_HOST:-bookstore-db-staging}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-bookstore_db}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-bookstore-redis-staging}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_ISSUER_URI=${JWT_ISSUER_URI}
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms512m -Xmx1g
    networks:
      - gripday-staging-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=bookstore,environment=staging"
    volumes:
      - bookstore_staging_logs:/app/logs

volumes:
  bookstore_staging_logs:

networks:
  gripday-staging-network:
    external: true
