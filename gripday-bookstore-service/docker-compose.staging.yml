version: '3.8'

services:
  bookstore-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstore-service-staging
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=staging
      - DB_HOST=${DB_HOST:-bookstore-db-staging}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-bookstore_db}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-bookstore-redis-staging}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_ISSUER_URI=${JWT_ISSUER_URI}
    networks:
      - gripday-staging-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gripday-staging-network:
    external: true