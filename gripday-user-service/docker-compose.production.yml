version: "3.8"

services:
  # PostgreSQL Database for User Service - Production Environment
  postgres-user:
    image: postgres:15.8-alpine
    container_name: gripday-user-postgres-production
    environment:
      POSTGRES_DB: gripday_user_production
      POSTGRES_USER: ${GRIPDAY_DATABASE_USERNAME:-gripday_user}
      POSTGRES_PASSWORD: ${GRIPDAY_DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_user_data_production:/var/lib/postgresql/data
      - ./scripts/init-user-db.sql:/docker-entrypoint-initdb.d/01-init-user-db.sql:ro
      - ./scripts/init-user-schema.sql:/docker-entrypoint-initdb.d/02-init-user-schema.sql:ro
      - ./scripts/postgres-production.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - auth-network-production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GRIPDAY_DATABASE_USERNAME:-gripday_user} -d gripday_user_production -h localhost"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service=postgres-user,environment=production"
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c shared_preload_libraries=pg_stat_statements,pg_buffercache
      -c pg_stat_statements.track=all
      -c max_connections=300
      -c shared_buffers=1GB
      -c effective_cache_size=4GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c min_wal_size=4GB
      -c max_wal_size=16GB
      -c log_statement=ddl
      -c log_duration=on
      -c log_min_duration_statement=5000
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "2.0"
          memory: 3G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # Redis for User Service - Production Environment
  redis-user:
    image: redis:7.2-alpine
    container_name: gripday-user-redis-production
    environment:
      REDIS_PASSWORD: ${GRIPDAY_CACHE_REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_user_data_production:/data
      - ./scripts/redis-production.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - auth-network-production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${GRIPDAY_CACHE_REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service=redis-user,environment=production"
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${GRIPDAY_CACHE_REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-keepalive 300
      --timeout 0
      --tcp-backlog 511
      --databases 16
      --stop-writes-on-bgsave-error yes
      --rdbcompression yes
      --rdbchecksum yes
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "1.0"
          memory: 1.5G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s

  # User Service - Production Environment
  user-service:
    build:
      context: ..
      dockerfile: gripday-user-service/Dockerfile
    image: gripday/user-service:production
    container_name: gripday-user-service-production
    env_file:
      - .env.production
    environment:
      # Spring Configuration
      SPRING_PROFILES_ACTIVE: production
      SPRING_APPLICATION_NAME: gripday-user-service

      # Database Configuration
      GRIPDAY_DATABASE_URL: jdbc:postgresql://postgres-user:5432/gripday_user_production
      GRIPDAY_DATABASE_USERNAME: ${GRIPDAY_DATABASE_USERNAME:-gripday_user}
      GRIPDAY_DATABASE_PASSWORD: ${GRIPDAY_DATABASE_PASSWORD}

      # Redis Configuration
      GRIPDAY_CACHE_REDIS_HOST: redis-user
      GRIPDAY_CACHE_REDIS_PORT: 6379
      GRIPDAY_CACHE_REDIS_PASSWORD: ${GRIPDAY_CACHE_REDIS_PASSWORD}
      GRIPDAY_CACHE_REDIS_DATABASE: 0

      # JWT Configuration
      GRIPDAY_AUTH_JWT_SECRET: ${GRIPDAY_AUTH_JWT_SECRET}
      GRIPDAY_AUTH_JWT_ISSUER: gripday-user-service

      # Email Configuration
      SMTP_HOST: smtp.sendgrid.net
      SMTP_PORT: 587
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM_EMAIL: noreply@gripday.com
      EMAIL_FROM_NAME: Gripday Platform
      APP_BASE_URL: https://gripday.com

      # OAuth2 Configuration
      GRIPDAY_AUTH_OAUTH2_GOOGLE_ENABLED: true
      GRIPDAY_AUTH_OAUTH2_GOOGLE_CLIENT_ID: ${GRIPDAY_AUTH_OAUTH2_GOOGLE_CLIENT_ID}
      GRIPDAY_AUTH_OAUTH2_GOOGLE_CLIENT_SECRET: ${GRIPDAY_AUTH_OAUTH2_GOOGLE_CLIENT_SECRET}

      # Observability Configuration
      GRIPDAY_OBSERVABILITY_TRACING_ENABLED: true
      GRIPDAY_OBSERVABILITY_TRACING_SAMPLING_RATE: 0.1
      GRIPDAY_OBSERVABILITY_TRACING_ENDPOINT: http://jaeger-collector.observability:14268/api/traces
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4317
      OTEL_SERVICE_NAME: gripday-user-service
      OTEL_RESOURCE_ATTRIBUTES: service.name=gripday-user-service,service.version=1.0.0,deployment.environment=production

      # JVM Configuration for production
      JAVA_OPTS: >-
        -Xms512m
        -Xmx1024m
        -XX:+UseG1GC
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
        -XX:+UseStringDeduplication
        -XX:+ParallelRefProcEnabled
        -Djava.security.egd=file:/dev/./urandom
    ports:
      - "${USER_SERVICE_PORT:-8080}:8080"
      - "${JMX_PORT:-9999}:9999" # JMX monitoring port
    depends_on:
      postgres-user:
        condition: service_healthy
      redis-user:
        condition: service_healthy
    networks:
      - auth-network-production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
        labels: "service=user-service,environment=production"
    volumes:
      - auth_logs_production:/app/logs
      - auth_tmp_production:/app/tmp
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "2.0"
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

networks:
  auth-network-production:
    driver: bridge
    name: gripday-user-network-production
    ipam:
      config:
        - subnet: 172.22.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-auth-production
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

volumes:
  postgres_user_data_production:
    name: gripday_user_postgres_data_production
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/opt/gripday/data}/postgres-production
  redis_user_data_production:
    name: gripday_user_redis_data_production
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/opt/gripday/data}/redis-production
  auth_logs_production:
    name: gripday_user_logs_production
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_PATH:-/opt/gripday/logs}/auth-production
  auth_tmp_production:
    name: gripday_user_tmp_production
    driver: local
