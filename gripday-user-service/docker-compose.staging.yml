version: "3.8"

services:
  # PostgreSQL Database for User Service - Staging Environment
  postgres-user:
    image: postgres:15-alpine
    container_name: gripday-user-postgres-staging
    environment:
      POSTGRES_DB: ${GRIPDAY_DATABASE_NAME:-gripday_user}
      POSTGRES_USER: ${GRIPDAY_DATABASE_USERNAME:-gripday_user}
      POSTGRES_PASSWORD: ${GRIPDAY_DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_auth_data_staging:/var/lib/postgresql/data
      - ./scripts/init-user-db.sql:/docker-entrypoint-initdb.d/01-init-user-db.sql:ro
      - ./scripts/init-user-schema.sql:/docker-entrypoint-initdb.d/02-init-user-schema.sql:ro
      - ./scripts/postgres-staging.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - auth-network-staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GRIPDAY_DATABASE_USERNAME:-gripday_user} -d ${GRIPDAY_DATABASE_NAME:-gripday_user} -h localhost"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=postgres-user,environment=staging"
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=2GB
      -c max_wal_size=8GB
      -c log_statement=all
      -c log_duration=on
      -c log_min_duration_statement=1000
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "1.0"
          memory: 1.5G

  # Redis for User Service - Staging Environment
  redis-user:
    image: redis:7-alpine
    container_name: gripday-user-redis-staging
    environment:
      REDIS_PASSWORD: ${GRIPDAY_CACHE_REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_auth_data_staging:/data
      - ./scripts/redis-staging.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - auth-network-staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${GRIPDAY_CACHE_REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=redis-user,environment=staging"
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${GRIPDAY_CACHE_REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-keepalive 300
      --timeout 0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G
        reservations:
          cpus: "0.5"
          memory: 768M

  # User Service - Staging Environment
  user-service:
    build:
      context: ..
      dockerfile: gripday-user-service/Dockerfile
    image: gripday/user-service:staging
    container_name: gripday-user-service-staging
    env_file:
      - .env.staging
    environment:
      # Spring Configuration
      SPRING_PROFILES_ACTIVE: staging
      SPRING_APPLICATION_NAME: gripday-user-service

      # Database Configuration
      GRIPDAY_DATABASE_URL: jdbc:postgresql://postgres-user:5432/${GRIPDAY_DATABASE_NAME:-gripday_user}
      GRIPDAY_DATABASE_USERNAME: ${GRIPDAY_DATABASE_USERNAME:-gripday_user}
      GRIPDAY_DATABASE_PASSWORD: ${GRIPDAY_DATABASE_PASSWORD}
      GRIPDAY_DATABASE_DRIVER_CLASS_NAME: org.postgresql.Driver
      GRIPDAY_DATABASE_JPA_HIBERNATE_DDL_AUTO: validate
      GRIPDAY_DATABASE_JPA_SHOW_SQL: false

      # Redis Configuration
      GRIPDAY_CACHE_REDIS_HOST: redis-user
      GRIPDAY_CACHE_REDIS_PORT: 6379
      GRIPDAY_CACHE_REDIS_PASSWORD: ${GRIPDAY_CACHE_REDIS_PASSWORD}
      GRIPDAY_CACHE_REDIS_TIMEOUT: 3000ms
      GRIPDAY_CACHE_REDIS_DATABASE: 0

      # JWT Configuration
      GRIPDAY_AUTH_JWT_SECRET: ${GRIPDAY_AUTH_JWT_SECRET}
      GRIPDAY_AUTH_JWT_EXPIRATION: ${GRIPDAY_AUTH_JWT_EXPIRATION:-900}
      GRIPDAY_AUTH_JWT_REFRESH_EXPIRATION: ${GRIPDAY_AUTH_JWT_REFRESH_EXPIRATION:-604800}
      GRIPDAY_AUTH_JWT_ISSUER: gripday-user-service

      # Security Configuration
      GRIPDAY_AUTH_RATE_LIMIT_ENABLED: true
      GRIPDAY_AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE: ${GRIPDAY_AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE:-100}
      GRIPDAY_AUTH_ACCOUNT_LOCKOUT_ENABLED: true
      GRIPDAY_AUTH_ACCOUNT_LOCKOUT_MAX_ATTEMPTS: ${GRIPDAY_AUTH_ACCOUNT_LOCKOUT_MAX_ATTEMPTS:-5}
      GRIPDAY_AUTH_ACCOUNT_LOCKOUT_DURATION: ${GRIPDAY_AUTH_ACCOUNT_LOCKOUT_DURATION:-900}

      # Observability Configuration
      GRIPDAY_OBSERVABILITY_TRACING_ENABLED: true
      GRIPDAY_OBSERVABILITY_METRICS_ENABLED: true
      GRIPDAY_OBSERVABILITY_LOGGING_LEVEL: INFO

      # JVM Configuration for staging
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -XX:+OptimizeStringConcat
        -XX:+UseCompressedOops
        -XX:+UseCompressedClassPointers
        -Djava.security.egd=file:/dev/./urandom
        -Dspring.profiles.active=staging
        -Dlogging.level.org.gripday=INFO
        -Dlogging.config=classpath:logback-spring.xml
    ports:
      - "${USER_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres-user:
        condition: service_healthy
      redis-user:
        condition: service_healthy
    networks:
      - auth-network-staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=user-service,environment=staging"
    volumes:
      - auth_logs_staging:/app/logs
      - auth_tmp_staging:/app/tmp
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

networks:
  auth-network-staging:
    driver: bridge
    name: gripday-user-network-staging
    ipam:
      config:
        - subnet: 172.21.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-auth-staging

volumes:
  postgres_auth_data_staging:
    name: gripday_user_postgres_data_staging
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/postgres-staging
  redis_auth_data_staging:
    name: gripday_user_redis_data_staging
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/redis-staging
  auth_logs_staging:
    name: gripday_user_logs_staging
    driver: local
  auth_tmp_staging:
    name: gripday_user_tmp_staging
    driver: local
