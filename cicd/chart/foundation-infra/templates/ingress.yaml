{{- if and .Values.minio.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "foundation-infra.fullname" . }}-minio-api
  labels:
    {{- include "foundation-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.minio.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.hosts.minio.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-minio
                port:
                  name: minio-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "foundation-infra.fullname" . }}-minio-console
  labels:
    {{- include "foundation-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-console-ingress
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # MinIO console requires WebSocket support for live updates.
    # nginx must forward the Upgrade/Connection headers and use HTTP/1.1
    # (HTTP/2 does not support the protocol upgrade mechanism).
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: {{ .Release.Name }}-minio
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.minioConsole.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.hosts.minioConsole.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-minio
                port:
                  name: minio-console
{{- end }}
{{- end }}
