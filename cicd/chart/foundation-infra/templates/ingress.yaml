{{- if .Values.ingress.enabled }}
{{- if .Values.dbgate.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "foundation-infra.fullname" . }}-dbgate
  labels:
    {{- include "foundation-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: dbgate-ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.dbgate.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.hosts.dbgate.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "foundation-infra.fullname" . }}-dbgate
                port:
                  number: {{ .Values.dbgate.service.port }}
---
{{- end }}
