{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "foundation-billing-service.fullname" . }}
  labels:
    {{- include "foundation-billing-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "foundation-billing-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
{{- end }}
