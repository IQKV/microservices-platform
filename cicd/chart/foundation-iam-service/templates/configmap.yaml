apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "foundation-iam-service.fullname" . }}-config
  labels:
    {{- include "foundation-iam-service.labels" . | nindent 4 }}
data:
  # Spring Profile Configuration
  SPRING_PROFILES_ACTIVE: {{ .Values.app.springBoot.profiles.active | quote }}

  # Database Configuration (maps to iqkv.db.* in application.yml)
  DB_HOST: {{ .Values.infraServices.postgresql.host | quote }}
  DB_PORT: {{ .Values.infraServices.postgresql.port | toString | quote }}
  DB_NAME: {{ .Values.infraServices.postgresql.database | quote }}
  DB_USERNAME: {{ .Values.infraServices.postgresql.username | quote }}

  # RabbitMQ Configuration (maps to iqkv.rabbitmq.* in application.yml)
  RABBITMQ_HOST: {{ .Values.infraServices.rabbitmq.host | quote }}
  RABBITMQ_PORT: {{ .Values.infraServices.rabbitmq.port | toString | quote }}
  RABBITMQ_USERNAME: {{ .Values.infraServices.rabbitmq.username | quote }}

  # Object Storage / MinIO Configuration (maps to iqkv.objectstorage.* in application.yml)
  OBJECTSTORAGE_ENDPOINT: {{ .Values.infraServices.objectstorage.endpoint | quote }}
  OBJECTSTORAGE_PUBLIC_ENDPOINT: {{ .Values.infraServices.objectstorage.publicEndpoint | default "" | quote }}
  OBJECTSTORAGE_BUCKET_NAME: {{ .Values.infraServices.objectstorage.bucketName | quote }}
  OBJECTSTORAGE_REGION: {{ .Values.infraServices.objectstorage.region | quote }}
  OBJECTSTORAGE_SSL: {{ .Values.infraServices.objectstorage.ssl | toString | quote }}
  {{- with .Values.infraServices.objectstorage.upload }}
  OBJECTSTORAGE_UPLOAD_MAX_FILE_SIZE_BYTES: {{ printf "%.0f" .maxFileSizeBytes | quote }}
  OBJECTSTORAGE_UPLOAD_PRESIGNED_URL_EXPIRATION_MINUTES: {{ .presignedUrlExpirationMinutes | toString | quote }}
  OBJECTSTORAGE_UPLOAD_ALLOWED_MIME_TYPES: {{ .allowedMimeTypes | quote }}
  {{- end }}

  # Mail Configuration (maps to iqkv.mail.* in application.yml)
  MAIL_HOST: {{ .Values.config.mail.host | quote }}
  MAIL_PORT: {{ .Values.config.mail.port | toString | quote }}
  MAIL_FROM: {{ .Values.config.mail.from | quote }}
  MAIL_FROM_NAME: {{ .Values.config.mail.fromName | default "IQ Key Value" | quote }}
  MAIL_REPLY_TO: {{ .Values.config.mail.replyTo | default "" | quote }}

  # JWT RSA Key Paths (maps to iqkv.auth.jwt.* in application.yml)
  JWT_PRIVATE_KEY_PATH: {{ .Values.config.jwt.privateKeyPath | quote }}
  JWT_PUBLIC_KEY_PATH: {{ .Values.config.jwt.publicKeyPath | quote }}
  JWT_ISSUER: {{ .Values.config.jwt.issuer | default "foundation-iam-service" | quote }}

  # Billing Service Configuration (maps to iqkv.billing.* in application.yml)
  BILLING_SERVICE_URI: {{ .Values.config.billing.serviceUri | quote }}
  PLAN_CATALOG_REFRESH_INTERVAL: {{ .Values.config.billing.planCatalogRefreshInterval | quote }}

  # Application Base URL (used in email notification links)
  APP_BASE_URL: {{ .Values.config.appBaseUrl | quote }}

  # Platform rollout mode — must be identical across IAM, Billing, and Gateway
  # Maps to iqkv.platform.rollout-mode in application.yml
  # Valid values: MULTI_TENANT | SINGLE_TENANT
  ROLLOUT_MODE: {{ .Values.platform.rolloutMode | default "MULTI_TENANT" | quote }}

  {{- if .Values.platform.defaultTenantKey }}
  # Default tenant key — required when ROLLOUT_MODE=SINGLE_TENANT
  # Must be a valid NanoID (8 chars, [a-z0-9])
  # Maps to iqkv.tenancy.default-tenant-key in application.yml
  DEFAULT_TENANT_KEY: {{ .Values.platform.defaultTenantKey | quote }}
  {{- end }}

  # Default tenant name — display name for the default tenant in SINGLE_TENANT mode
  # Maps to iqkv.tenancy.default-tenant-name in application.yml
  DEFAULT_TENANT_NAME: {{ .Values.platform.defaultTenantName | default "Acme Corp." | quote }}

  # Helm release info
  HELM_RELEASE_NAME: {{ .Release.Name | quote }}
