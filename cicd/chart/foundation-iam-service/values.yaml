# iQ Key Value IAM Service - Default Configuration
# Base configuration with sensible defaults for all environments

# Global settings
global:
  storageClass: "local-path"
  imageRegistry: ""

# Application Configuration
app:
  name: foundation-iam-service
  version: "0.3.0"
  environment: "sit"
  namespace: "default"

  # Spring Boot Application Settings
  springBoot:
    profiles:
      active: sit
    server:
      port: 8080
    management:
      port: 8081

# Image Configuration
image:
  repository: iqkv/foundation-iam-service
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: know-how-download-auth

# Deployment Configuration
replicaCount: 1

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Configuration
podAnnotations: {}
podLabels: {}

# Security Context (shared defaults)
podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Service Configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Management Service (Actuator endpoints) — exposes port 8081 directly
managementService:
  enabled: true
  type: ClusterIP
  port: 8081
  targetPort: 8081
  annotations: {}

# Management HTTP Service — exposes Actuator on port 80 so callers can use
# a plain http:// URL without a port number (e.g. http://foundation-iam-service-management-http)
managementHttpService:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8081
  annotations: {}

# Ingress Configuration
ingress:
  enabled: false
  className: "nginx"
  tls:
    enabled: false
    secretName: ""
    certManager:
      enabled: false
      issuer: "letsencrypt-production"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: iam-service.local
      paths:
        - path: /
          pathType: Prefix

# Resource Configuration
resources:
  limits:
    memory: 768Mi
    cpu: 500m
  requests:
    memory: 512Mi
    cpu: 200m

# JVM Configuration
jvm:
  maxRAMPercentage: "70.0"
  initialRAMPercentage: "50.0"
  minRAMPercentage: "50.0"
  gcAlgorithm: "G1GC"
  maxGCPauseMillis: "200"
  additionalOpts: ""

# Autoscaling Configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Node Selection
nodeSelector: {}
tolerations: []
affinity: {}

# Health Checks
healthcheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8081
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8081
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 5

# External Infrastructure Configuration
infraServices:
  # PostgreSQL Configuration
  postgresql:
    host: "foundation-infra-postgresql.iqkv-sit-env.svc.cluster.local"
    port: 5432
    database: "iqkv_iam"
    username: "svc_iam_sit_dba"
    password: ""  # Must be overridden via --set-string infraServices.postgresql.password in pipeline

  # RabbitMQ Configuration
  rabbitmq:
    host: "foundation-infra-rabbitmq.iqkv-sit-env.svc.cluster.local"
    port: 5672
    username: "svc_infra_sit_rmq"
    password: ""  # Must be overridden via --set-string infraServices.rabbitmq.password in pipeline

  # Redis Configuration
  redis:
    host: "foundation-infra-redis.iqkv-sit-env.svc.cluster.local"
    port: 6379
    password: ""  # Override when Redis auth is enabled
    database: 0
    timeout: "PT2S"

  # MinIO / S3-compatible Object Storage Configuration
  # Points to the MinIO service deployed by foundation-infra Helm chart
  objectstorage:
    endpoint: "http://foundation-infra-minio.iqkv-sit-env.svc.cluster.local"
    accessKey: "iqkv"          # Override via --set-string infraServices.objectstorage.accessKey=xxx
    secretKey: "iqkv_password" # Override via --set-string infraServices.objectstorage.secretKey=xxx
    bucketName: "iqkv-iam-assets"
    region: "us-east-1"
    ssl: false
    # Public URL reachable by browser clients for presigned PUT uploads.
    # When set, rewrites the internal cluster hostname in presigned URLs.
    publicEndpoint: ""
    upload:
      maxFileSizeBytes: 5242880      # 5 MB
      presignedUrlExpirationMinutes: 60
      allowedMimeTypes: "image/jpeg,image/png,image/webp,image/gif"

# Application Configuration (only externalized values)
config:
  # JWT RSA Key Configuration
  jwt:
    privateKeyPath: "classpath:keys/private.pem"  # Override for production
    publicKeyPath: "classpath:keys/public.pem"    # Override for production
    issuer: "foundation-iam-service"

  # Billing Service Configuration
  billing:
    serviceUri: "http://foundation-billing-service"  # Maps to iqkv.billing.service-url
    planRefreshInterval: "PT10M"                    # Maps to iqkv.billing.plan-catalog-refresh-interval

  # Email / SMTP Configuration
  mail:
    host: "smtp.example.com"
    port: 587
    username: ""   # Override via --set config.mail.username=xxx
    password: ""   # Override via --set config.mail.password=xxx
    from: "noreply@iqkv.dev"
    fromName: "iQ Key Value"
    replyTo: ""

  # Application base URL (used in email links)
  appBaseUrl: "https://app.iqkv.site"

  # OAuth2 / OIDC Configuration
  oauth2:
    enabledProviders: "google,github"
    baseUrl: "http://localhost:8080"
    postLoginRedirectUri: "https://app.iqkv.site/auth/callback"
    autoProvisionUsers: true
    stateTtl: "PT10M"
    stateTtlMax: "PT15M"
    autoLink:
      enabled: true
    providers:
      google:
        clientId: ""
        clientSecret: ""  # Override via --set-string config.oauth2.providers.google.clientSecret=xxx
      github:
        clientId: ""
        clientSecret: ""  # Override via --set-string config.oauth2.providers.github.clientSecret=xxx
      microsoft:
        clientId: ""
        clientSecret: ""  # Override via --set-string config.oauth2.providers.microsoft.clientSecret=xxx
        tenantId: "common"
    encryptionKey: ""  # Override via --set-string config.oauth2.encryptionKey=xxx

# Monitoring Configuration
monitoring:
  serviceMonitor:
    enabled: false
    namespace: monitoring
    labels:
      release: prometheus-stack
    interval: 30s
    scrapeTimeout: 10s
    path: /actuator/prometheus

  prometheusRule:
    enabled: false
    namespace: monitoring
    labels:
      release: prometheus-stack
    rules:
      - alert: IamServiceDown
        expr: up{job=~"foundation-iam-service.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "IAM Service is down"
          description: "IAM Service has been down for more than 2 minutes"

      - alert: IamServiceHighMemory
        expr: container_memory_usage_bytes{pod=~".*foundation-iam-service.*"} / container_spec_memory_limit_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "IAM Service high memory usage"
          description: "IAM Service memory usage is above 85% for more than 5 minutes"

      - alert: IamServiceHighCPU
        expr: rate(container_cpu_usage_seconds_total{pod=~".*foundation-iam-service.*"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "IAM Service high CPU usage"
          description: "IAM Service CPU usage is above 80% for more than 5 minutes"

      - alert: IamServiceHighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5..", job=~"foundation-iam-service.*"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "IAM Service high error rate"
          description: "IAM Service is experiencing high 5xx error rate (>5%) for more than 5 minutes"

      - alert: IamServiceSlowResponses
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{job=~"foundation-iam-service.*"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "IAM Service slow responses"
          description: "IAM Service p95 response time is above 2 seconds for more than 5 minutes"

# Network Policies
networkPolicy:
  enabled: false

# Platform Rollout Mode Configuration
# IMPORTANT: This value must be identical across foundation-iam-service,
# foundation-billing-service, and foundation-gateway-service.
# Mixed modes are a hard deployment error (spec section 13, 14.1 R1).
#
# Valid values for rolloutMode: MULTI_TENANT | SINGLE_TENANT
# Default: MULTI_TENANT
platform:
  rolloutMode: "MULTI_TENANT"
  defaultTenantKey: ""   # Required for SINGLE_TENANT mode — NanoID format [a-z0-9]{8}
  defaultTenantName: "Acme Corp."  # Display name for the default tenant

# K3s specific configurations
k3s:
  useLocalPath: true
  disableResourceQuotas: true
  tolerateAllTaints: false
