# UAT Environment Configuration

# Application Configuration
app:
  environment: "uat"
  springBoot:
    profiles:
      active: uat

# Staging external services (in staging namespace)
infraServices:
  postgresql:
    host: "foundation-infra-postgresql.iqkv-uat-env.svc.cluster.local"
    database: "iqkv_iam"
    username: "svc_iam_uat_dba"
    password: ""  # Must be overridden via --set-string infraServices.postgresql.password in pipeline

  rabbitmq:
    host: "foundation-infra-rabbitmq.iqkv-uat-env.svc.cluster.local"
    username: "svc_infra_uat_rmq"
    password: ""  # Must be overridden via --set-string infraServices.rabbitmq.password in pipeline

  redis:
    host: "foundation-infra-redis.iqkv-uat-env.svc.cluster.local"
    password: ""

  objectstorage:
    endpoint: "http://foundation-infra-minio.iqkv-uat-env.svc.cluster.local"
    accessKey: "iqkv"          # Override via --set-string infraServices.objectstorage.accessKey=xxx
    secretKey: "iqkv_password" # Override via --set-string infraServices.objectstorage.secretKey=xxx
    bucketName: "iqkv-iam-assets"
    region: "us-east-1"
    ssl: false
    publicEndpoint: "http://minio-uat.iqkv.site"

# Staging environment resources (production-like)
resources:
  limits:
    memory: 1Gi
    cpu: 1000m
  requests:
    memory: 512Mi
    cpu: 500m

config:
  jwt:
    privateKeyPath: "classpath:keys/private.pem"
    publicKeyPath: "classpath:keys/public.pem"

  billing:
    serviceUri: "http://foundation-billing-service.iqkv-uat-env.svc.cluster.local:8080"

  mail:
    host: "foundation-infra-mailhog.iqkv-uat-env.svc.cluster.local"
    port: 1025
    username: ""
    password: ""
    from: "noreply@iqkv.dev"
    fromName: "IQ Key Value"

  appBaseUrl: "https://app.iqkv.site"
  oauth2:
    postLoginRedirectUri: "https://app.iqkv.site/auth/callback"

# Enable monitoring in staging
monitoring:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true

# Platform rollout mode — must match foundation-billing-service and foundation-gateway-service
platform:
  rolloutMode: "MULTI_TENANT"
  defaultTenantKey: ""  # Set to a valid NanoID when switching to SINGLE_TENANT
  defaultTenantName: "Acme Corp."
