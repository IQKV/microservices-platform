apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "foundation-ui-saas-landing-kit.fullname" . }}-config
  labels:
    {{- include "foundation-ui-saas-landing-kit.labels" . | nindent 4 }}
data:
  {{- if .Values.app.nginx.customConfig.siteConf }}
  # Nginx site configuration (mounted to /usr/share/nginx/site.conf)
  site.conf: |
    {{- include "foundation-ui-saas-landing-kit.siteConfig" . | nindent 4 }}
  {{- end }}

  {{- if .Values.app.nginx.customConfig.contentSecurityPolicyConf }}
  # Content Security Policy configuration (mounted to /usr/share/nginx/content-security-policy.conf)
  content-security-policy.conf: |
{{- .Values.app.nginx.customConfig.contentSecurityPolicyConf | nindent 4 }}
  {{- end }}

  {{- if .Values.app.nginx.customConfig.securityConf }}
  # Security headers configuration (mounted to /usr/share/nginx/security.conf)
  security.conf: |
    {{- include "foundation-ui-saas-landing-kit.securityConfig" . | nindent 4 }}
  {{- end }}
