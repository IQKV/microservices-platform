# IQ Key Value SaaS Landing Kit - Production Environment Configuration
# Production-ready configuration with high availability and security

# Image Configuration
image:
  repository: know-how.download/iqkv/foundation-ui-saas-landing-kit
  tag: "latest"
  pullPolicy: Always

# Deployment Configuration
replicaCount: 3

# Resource Configuration (Production)
resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    memory: 256Mi
    cpu: 250m

# Runtime Environment Variables (Production)
app:
  environment: "prd"

  # Nginx Configuration (Production)
  nginx:
    port: 8080
    customConfig:
      # Production site configuration
      siteConf: |
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Metrics endpoint for monitoring
        location /metrics {
            access_log off;
            return 200 "# Nginx metrics placeholder\n";
            add_header Content-Type text/plain;
        }

        # Security.txt for responsible disclosure
        location /.well-known/security.txt {
            return 200 "Contact: noreply@iqkv.dev\nExpires: 2025-12-31T23:59:59.000Z\n";
            add_header Content-Type text/plain;
        }


      # Strict CSP for production static landing page
      contentSecurityPolicyConf: |
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

      # Production security headers
      securityConf: |
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(), geolocation=(), camera=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

# Ingress Configuration (Production)
ingress:
  enabled: true
  className: "nginx"
  tls:
    enabled: true
    certManager:
      enabled: true
      issuer: "letsencrypt-production"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Force HTTPS redirect
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: iqkv.site
      paths:
        - path: /
          pathType: Prefix

# Autoscaling Configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# Monitoring Configuration
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
  prometheusRule:
    enabled: true

# Health Checks (Production)
healthcheck:
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Node Selection and Affinity (Production)
nodeSelector:
  kubernetes.io/arch: amd64

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - foundation-ui-saas-landing-kit
          topologyKey: kubernetes.io/hostname

# Security Context (Production hardening)
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  seccompProfile:
    type: RuntimeDefault
