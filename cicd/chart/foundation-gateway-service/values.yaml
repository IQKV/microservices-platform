# IQ Key Value Gateway Service - Default Configuration
# Base configuration with sensible defaults for all environments

# Global settings
global:
  storageClass: "local-path"
  imageRegistry: ""

# Application Configuration
app:
  name: foundation-gateway-service
  version: "1.0.0"
  environment: "sit"
  namespace: "default"

  # Spring Boot Application Settings
  springBoot:
    profiles:
      active: "sit"
    server:
      port: 8080
    management:
      port: 8081

# Image Configuration
image:
  repository: know-how.download/iqkv/foundation-gateway-service
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: know-how-download-auth

# Deployment Configuration
replicaCount: 1

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Configuration
podAnnotations: {}
podLabels: {}

# Security Context (shared defaults)
podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Service Configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Management Service (Actuator endpoints)
managementService:
  enabled: true
  type: ClusterIP
  port: 8081
  targetPort: 8081
  annotations: {}

# Ingress Configuration
ingress:
  enabled: false
  className: "nginx"
  tls:
    enabled: false
    secretName: ""
    certManager:
      enabled: false
      issuer: "letsencrypt-production"
  annotations:
    # DO NOT use rewrite-target - it breaks API paths!
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: gateway.local
      paths:
        - path: /
          pathType: Prefix

# Resource Configuration
resources:
  limits:
    memory: 1Gi
    cpu: 1000m
  requests:
    memory: 512Mi
    cpu: 500m

# JVM Configuration
# Tunable JVM options for containerized reactive Java applications (Spring WebFlux)
jvm:
  maxRAMPercentage: "70.0"
  initialRAMPercentage: "50.0"
  minRAMPercentage: "50.0"
  gcAlgorithm: "G1GC"
  maxGCPauseMillis: "200"
  reactorNettyIoWorkerCount: "4"
  reactorNettyMaxConnections: "500"
  additionalOpts: ""

# Autoscaling Configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Node Selection
nodeSelector: {}
tolerations: []
affinity: {}

# Health Checks
healthcheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8081
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8081
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 5

# Application Configuration (externalized values)
config:
  # IAM Service URI — used for JWT JWKS validation and routing
  # Maps to env var IAM_SERVICE_URI consumed by application.yml
  iamServiceUri: "http://foundation-iam-service"

  # IAM Management Service URI — points to the management-http Service (port 80 → 8081)
  # Maps to env var IQKV_IAM_SERVICE_URL consumed by application.yml
  iamManagementServiceUri: "http://foundation-iam-service-management-http"

  # Billing Service URI — used for routing billing API and webhook requests
  # Maps to env var BILLING_SERVICE_URI consumed by application.yml
  billingServiceUri: "http://foundation-billing-service"

  # Audit Service URI — used for routing audit API requests
  # Maps to env var AUDIT_SERVICE_URI consumed by application.yml
  auditServiceUri: "http://foundation-audit-service"

  # CORS allowed origins
  # Maps to env var CORS_ALLOWED_ORIGINS consumed by application.yml
  cors:
    allowedOrigins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "http://localhost:8080"

# Monitoring Configuration
monitoring:
  serviceMonitor:
    enabled: false
    namespace: monitoring
    labels:
      release: prometheus-stack
    interval: 30s
    scrapeTimeout: 10s
    path: /actuator/prometheus

  prometheusRule:
    enabled: false
    namespace: monitoring
    labels:
      release: prometheus-stack
    rules:
      - alert: GatewayServiceDown
        expr: up{job="foundation-gateway-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Gateway Service is down"
          description: "Gateway Service has been down for more than 1 minute"

      - alert: GatewayServiceHighMemory
        expr: container_memory_usage_bytes{pod=~".*foundation-gateway-service.*"} / container_spec_memory_limit_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway Service high memory usage"
          description: "Gateway Service memory usage is above 80%"

      - alert: GatewayServiceHighLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job="foundation-gateway-service"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway Service high latency"
          description: "Gateway Service 95th percentile latency is above 2 seconds"

# Network Policies
networkPolicy:
  enabled: false

# Platform Rollout Mode Configuration
# IMPORTANT: This value must be identical across foundation-iam-service,
# foundation-billing-service, and foundation-gateway-service.
# Mixed modes are a hard deployment error (spec section 13, 14.1 R1).
#
# Valid values: MULTI_TENANT | SINGLE_TENANT
# Default: MULTI_TENANT
platform:
  rolloutMode: "MULTI_TENANT"
  defaultTenantKey:
    "" # Required for SINGLE_TENANT mode — NanoID format [a-z0-9]{8}
    # Must match iqkv.tenancy.default-tenant-key in IAM service

# Infrastructure Services Configuration
# Controls which downstream services are enabled and their connection details
infraServices:
  userService:
    url: "http://foundation-iam-service"

  billingService:
    enabled: false
    url: "http://foundation-billing-service"

# K3s specific configurations
k3s:
  useLocalPath: true
  disableResourceQuotas: true
  tolerateAllTaints: false
