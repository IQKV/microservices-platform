# IQ Key Value Admin Dashboard UI - Test Environment Configuration
# Overrides for local development and testing

# Image Configuration
image:
  repository: iqkv/foundation-ui-platform-admin
  tag: "latest"
  pullPolicy: Always

# Resource Configuration (Lower for development)
resources:
  limits:
    memory: 256Mi
    cpu: 250m
  requests:
    memory: 128Mi
    cpu: 100m

# Health Checks (Faster for development)
healthcheck:
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5

# Runtime Environment Variables (Test endpoints)
app:
  environment: "sit"

  # Nginx Configuration (Test)
  nginx:
    port: 8080
    customConfig:
      # Override site.conf to add health check, dev endpoints, and SPA routing
      # Override site.conf to add development-specific endpoints
      # Note: SPA routing is already handled by the base nginx container's default.conf
      siteConf: |
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Test-specific endpoints
        location /api/dev {
            return 200 "Test API endpoint\n";
            add_header Content-Type text/plain;
        }

      # CSP configured for iqkv.site domains (development)
      contentSecurityPolicyConf: |
        # CSP for development React SPA with iqkv.site domains and Stripe/Lemon Squeezy integration
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://app.lemonsqueezy.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.iqkv.site https://iqkv.site wss://*.iqkv.site https://api.stripe.com https://api.lemonsqueezy.com; frame-src 'self' https://*.iqkv.site https://iqkv.site https://js.stripe.com https://hooks.stripe.com https://app.lemonsqueezy.com; object-src 'none'; base-uri 'self';" always;

      # Use base image security headers (sufficient for development)
      securityConf: ""

  env:
    # API Configuration - Points to gateway service in same namespace
    apiServerUrl: "https://api.iqkv.site/api"

    # Test Configuration
    enableMsw: "false"
    logLevel: "debug"
    demoMode: "true"

# Ingress Configuration (Test)
ingress:
  enabled: true
  className: "nginx"
  tls:
    enabled: false
    certManager:
      enabled: false
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # SPA routing support - use upstream-hash-by for consistent routing
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
    # WebSocket support for real-time features (e.g. notifications, live updates)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/websocket-services: foundation-ui-platform-admin
    # CORS is handled by the API backend, not the frontend ingress
  hosts:
    - host: admin.iqkv.site
      paths:
        - path: /
          pathType: Prefix

# Monitoring (Disabled for development)
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false

# Autoscaling (Disabled for development)
autoscaling:
  enabled: false
