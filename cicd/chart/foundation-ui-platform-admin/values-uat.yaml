# iQ Key Value Admin Dashboard UI - UAT Environment Configuration
# Staging configuration for pre-production testing

# Image Configuration
image:
  repository: iqkv/foundation-ui-platform-admin
  tag: "latest"
  pullPolicy: Always

# Deployment Configuration
replicaCount: 2

# Resource Configuration (Staging)
resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    memory: 256Mi
    cpu: 250m

# Runtime Environment Variables (Staging endpoints)
app:
  environment: "uat"

  # Nginx Configuration (Staging)
  nginx:
    port: 8080
    customConfig:
      # Override site.conf for staging-specific endpoints and SPA routing
      # Override site.conf to add staging-specific endpoints
      # Note: SPA routing is already handled by the base nginx container's default.conf
      siteConf: |
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Staging-specific endpoints
        location /api/staging {
            return 200 "Staging API endpoint\n";
            add_header Content-Type text/plain;
        }

      # CSP configured for iqkv.site domains (staging)
      contentSecurityPolicyConf: |
        # CSP for staging React SPA with iqkv.site domains and Stripe/Lemon Squeezy integration
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://app.lemonsqueezy.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.iqkv.site https://iqkv.site wss://*.iqkv.site https://api.stripe.com https://api.lemonsqueezy.com; frame-src 'self' https://*.iqkv.site https://iqkv.site https://js.stripe.com https://hooks.stripe.com https://app.lemonsqueezy.com; object-src 'none'; base-uri 'self';" always;

      # Add some security headers for staging
      securityConf: |
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

  env:
    # API Configuration - Points to staging gateway service
    apiServerUrl: "https://api.iqkv.site/api"

    # Staging Configuration
    enableMsw: "false"
    logLevel: "info"
    demoMode: "false"

# Ingress Configuration (Staging)
ingress:
  enabled: true
  className: "nginx"
  tls:
    enabled: true
    certManager:
      enabled: true
      issuer: "letsencrypt-staging"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # SPA routing support - use upstream-hash-by for consistent routing
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
    # WebSocket support for real-time features (e.g. notifications, live updates)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/websocket-services: foundation-ui-platform-admin
    # CORS is handled by the API backend, not the frontend ingress
  hosts:
    - host: admin.iqkv.site
      paths:
        - path: /
          pathType: Prefix

# Autoscaling Configuration (Basic for staging)
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Monitoring Configuration (Basic for staging)
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRule:
    enabled: true

# Health Checks (Staging)
healthcheck:
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Pod Disruption Budget (Basic for staging)
podDisruptionBudget:
  enabled: true
  minAvailable: 1
