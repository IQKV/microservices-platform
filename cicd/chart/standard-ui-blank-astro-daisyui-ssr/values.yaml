# standard-ui-blank-astro-daisyui-ssr - Default Configuration
# Astro SSR application running via Node.js standalone adapter (port 4321).
# Base configuration with sensible defaults for all environments.

# Global settings
global:
  storageClass: "local-path"
  imageRegistry: ""

# Application Configuration
app:
  name: standard-ui-blank-astro-daisyui-ssr
  version: "0.0.0"
  environment: "sit"
  namespace: "default"

  # Node.js SSR server configuration
  server:
    port: 4321

  # Runtime environment variables injected via ConfigMap.
  # Sensitive values (e.g. RESEND_API_KEY) are passed at deploy time via
  # --set app.env.RESEND_API_KEY=<value> and never stored in values files.
  env:
    RESEND_FROM: ""
    # Optional display name for the From field (e.g. "Acme Support").
    # When set, emails appear as: Acme Support <noreply@example.com>
    # Pass at deploy time via --set app.env.RESEND_FROM_NAME=<value>
    RESEND_FROM_NAME: ""
    RESEND_TO: ""
    RESEND_API_KEY: ""

# Image Configuration
image:
  repository: know-how.download/iqkv/standard-ui-blank-astro-daisyui-ssr
  tag: "latest"
  pullPolicy: Always
  # Base image: cicdtools/nodejs-runner

imagePullSecrets:
  - name: know-how-download-auth

# Deployment Configuration
replicaCount: 1

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Configuration
podAnnotations: {}
podLabels: {}

# Security Context
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Service Configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 4321
  annotations: {}

# Ingress Configuration
ingress:
  enabled: false
  className: "nginx"
  tls:
    enabled: false
    secretName: ""
    certManager:
      enabled: false
      issuer: "letsencrypt-production"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
  hosts:
    - host: standard-ui-blank-astro-daisyui-ssr.local
      paths:
        - path: /
          pathType: Prefix

# Resource Configuration
resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    memory: 256Mi
    cpu: 100m

# Autoscaling Configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Health Check Configuration
# Astro SSR exposes / by default; add a dedicated /health API route for production.
healthcheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /
      port: 4321
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /
      port: 4321
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

# Node Selection
nodeSelector: {}
tolerations: []
affinity: {}

# Monitoring Configuration
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    path: /metrics
    port: 4321
  prometheusRule:
    enabled: false

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# Volume Configuration
volumes:
  tmp:
    enabled: true
    size: 100Mi
  logs:
    enabled: true
    size: 100Mi
