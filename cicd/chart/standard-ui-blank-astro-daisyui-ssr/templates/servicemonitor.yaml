{{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "standard-ui-blank-astro-daisyui-ssr.fullname" . }}
  labels:
    {{- include "standard-ui-blank-astro-daisyui-ssr.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "standard-ui-blank-astro-daisyui-ssr.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.monitoring.serviceMonitor.path }}
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: 10s
      honorLabels: true
{{- end }}
