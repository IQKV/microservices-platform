{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "standard-ui-blank-astro-daisyui-ssr.serviceAccountName" . }}
  labels:
    {{- include "standard-ui-blank-astro-daisyui-ssr.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
