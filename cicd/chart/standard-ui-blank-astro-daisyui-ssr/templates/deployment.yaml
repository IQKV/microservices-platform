apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "standard-ui-blank-astro-daisyui-ssr.fullname" . }}
  labels:
    {{- include "standard-ui-blank-astro-daisyui-ssr.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "standard-ui-blank-astro-daisyui-ssr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "standard-ui-blank-astro-daisyui-ssr.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "standard-ui-blank-astro-daisyui-ssr.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- if not .Values.affinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "standard-ui-blank-astro-daisyui-ssr.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- else }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.server.port }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "standard-ui-blank-astro-daisyui-ssr.fullname" . }}-config

          # NODE_ENV and HOST are required by the Astro Node standalone adapter
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.app.server.port | quote }}

          {{- if .Values.healthcheck.enabled }}
          livenessProbe:
            {{- toYaml .Values.healthcheck.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.healthcheck.readinessProbe | nindent 12 }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            {{- if .Values.volumes.tmp.enabled }}
            - name: tmp-volume
              mountPath: /tmp
            {{- end }}
            {{- if .Values.volumes.logs.enabled }}
            - name: logs-volume
              mountPath: /opt/app/logs
            {{- end }}

      volumes:
        {{- if .Values.volumes.tmp.enabled }}
        - name: tmp-volume
          emptyDir:
            sizeLimit: {{ .Values.volumes.tmp.size }}
        {{- end }}
        {{- if .Values.volumes.logs.enabled }}
        - name: logs-volume
          emptyDir:
            sizeLimit: {{ .Values.volumes.logs.size }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
