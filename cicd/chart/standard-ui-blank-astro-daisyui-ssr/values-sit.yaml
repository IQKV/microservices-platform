# standard-ui-blank-astro-daisyui-ssr - SIT Environment Configuration
# Development / integration testing overrides

# Image Configuration
image:
  repository: know-how.download/iqkv/standard-ui-blank-astro-daisyui-ssr
  tag: "wip"
  pullPolicy: Always

# Resource Configuration (lower for dev)
resources:
  limits:
    memory: 256Mi
    cpu: 250m
  requests:
    memory: 128Mi
    cpu: 50m

# Health Checks (faster feedback in dev)
healthcheck:
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5

app:
  environment: "sit"
  env:
    RESEND_FROM: ""
    RESEND_TO: ""
    RESEND_API_KEY: ""
    # Override at deploy time:
    # --set app.env.RESEND_FROM=noreply@sit.iqkv.site
    # --set app.env.RESEND_TO=contact@sit.iqkv.site
    # --set app.env.RESEND_API_KEY=${RESEND_API_KEY}

# Ingress Configuration (SIT)
ingress:
  enabled: true
  className: "nginx"
  tls:
    enabled: false
    certManager:
      enabled: false
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
  hosts:
    - host: inventory-service.iqkv.site
      paths:
        - path: /
          pathType: Prefix

# Monitoring (disabled for SIT)
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false

# Autoscaling (disabled for SIT)
autoscaling:
  enabled: false
