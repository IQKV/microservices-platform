apiVersion: v1
kind: Secret
metadata:
  name: {{ include "foundation-ai-chat-service.fullname" . }}-secrets
  labels:
    {{- include "foundation-ai-chat-service.labels" . | nindent 4 }}
type: Opaque
data:
  # Database credentials
  database-password: {{ .Values.infraServices.postgresql.password | b64enc | quote }}

  # RabbitMQ credentials
  rabbitmq-password: {{ .Values.infraServices.rabbitmq.password | b64enc | quote }}
