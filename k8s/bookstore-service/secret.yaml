apiVersion: v1
kind: Secret
metadata:
  name: bookstore-service-secrets
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: gripday-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: gripday-platform
type: Opaque
data:
  # Database credentials (base64 encoded)
  GRIPDAY_DATABASE_USERNAME: Ym9va3N0b3JlX3VzZXI=  # bookstore_user
  GRIPDAY_DATABASE_PASSWORD: Ym9va3N0b3JlX3Bhc3M=  # bookstore_pass
  
  # Redis password (optional, empty for local)
  GRIPDAY_CACHE_REDIS_PASSWORD: ""
  
  # JWT Secret (shared with auth service)
  GRIPDAY_AUTH_JWT_SECRET: Z3JpcGRheS1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seQ==  # gripday-jwt-secret-key-for-development-only
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-service-secrets
  namespace: staging-env
  labels:
    app.kubernetes.io/name: gripday-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: gripday-platform
    environment: staging
type: Opaque
data:
  # Database credentials (base64 encoded) - should be different for staging
  GRIPDAY_DATABASE_USERNAME: Ym9va3N0b3JlX3N0YWdpbmdfdXNlcg==  # bookstore_staging_user
  GRIPDAY_DATABASE_PASSWORD: Ym9va3N0b3JlX3N0YWdpbmdfcGFzcw==  # bookstore_staging_pass
  
  # Redis password for staging
  GRIPDAY_CACHE_REDIS_PASSWORD: c3RhZ2luZ19yZWRpc19wYXNz  # staging_redis_pass
  
  # JWT Secret for staging (should be different)
  GRIPDAY_AUTH_JWT_SECRET: Z3JpcGRheS1qd3Qtc3RhZ2luZy1zZWNyZXQta2V5  # gripday-jwt-staging-secret-key
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-service-secrets
  namespace: gripday-production-env
  labels:
    app.kubernetes.io/name: gripday-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: gripday-platform
    environment: production
type: Opaque
data:
  # Database credentials (base64 encoded) - should be different for production
  GRIPDAY_DATABASE_USERNAME: Ym9va3N0b3JlX3Byb2RfdXNlcg==  # bookstore_prod_user
  GRIPDAY_DATABASE_PASSWORD: Ym9va3N0b3JlX3Byb2RfcGFzcw==  # bookstore_prod_pass
  
  # Redis password for production
  GRIPDAY_CACHE_REDIS_PASSWORD: cHJvZF9yZWRpc19wYXNz  # prod_redis_pass
  
  # JWT Secret for production (should be different and secure)
  GRIPDAY_AUTH_JWT_SECRET: Z3JpcGRheS1qd3QtcHJvZHVjdGlvbi1zZWNyZXQta2V5  # gripday-jwt-production-secret-key