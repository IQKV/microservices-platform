apiVersion: v1
kind: Secret
metadata:
  name: bookstore-service-secrets
  namespace: iqscaffold-dev-env
  labels:
    app.kubernetes.io/name: iqscaffold-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: iqscaffold
type: Opaque
data:
  # Database credentials (base64 encoded)
  IQSCAFFOLD_DATABASE_USERNAME: Ym9va3N0b3JlX3VzZXI= # bookstore_user
  IQSCAFFOLD_DATABASE_PASSWORD: Ym9va3N0b3JlX3Bhc3M= # bookstore_pass

  # Redis password (optional, empty for local)
  IQSCAFFOLD_CACHE_REDIS_PASSWORD: ""

  # JWT Secret (shared with user service)
  IQSCAFFOLD_AUTH_JWT_SECRET: Z3JpcGRheS1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seQ== # iqscaffold-jwt-secret-key-for-development-only
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-service-secrets
  namespace: staging-env
  labels:
    app.kubernetes.io/name: iqscaffold-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: iqscaffold
    environment: staging
type: Opaque
data:
  # Database credentials (base64 encoded) - should be different for staging
  IQSCAFFOLD_DATABASE_USERNAME: Ym9va3N0b3JlX3N0YWdpbmdfdXNlcg== # bookstore_staging_user
  IQSCAFFOLD_DATABASE_PASSWORD: Ym9va3N0b3JlX3N0YWdpbmdfcGFzcw== # bookstore_staging_pass

  # Redis password for staging
  IQSCAFFOLD_CACHE_REDIS_PASSWORD: c3RhZ2luZ19yZWRpc19wYXNz # staging_redis_pass

  # JWT Secret for staging (should be different)
  IQSCAFFOLD_AUTH_JWT_SECRET: Z3JpcGRheS1qd3Qtc3RhZ2luZy1zZWNyZXQta2V5 # iqscaffold-jwt-staging-secret-key
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-service-secrets
  namespace: iqscaffold-production-env
  labels:
    app.kubernetes.io/name: iqscaffold-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: iqscaffold
    environment: production
type: Opaque
data:
  # Database credentials (base64 encoded) - should be different for production
  IQSCAFFOLD_DATABASE_USERNAME: Ym9va3N0b3JlX3Byb2RfdXNlcg== # bookstore_prod_user
  IQSCAFFOLD_DATABASE_PASSWORD: Ym9va3N0b3JlX3Byb2RfcGFzcw== # bookstore_prod_pass

  # Redis password for production
  IQSCAFFOLD_CACHE_REDIS_PASSWORD: cHJvZF9yZWRpc19wYXNz # prod_redis_pass

  # JWT Secret for production (should be different and secure)
  IQSCAFFOLD_AUTH_JWT_SECRET: Z3JpcGRheS1qd3QtcHJvZHVjdGlvbi1zZWNyZXQta2V5 # iqscaffold-jwt-production-secret-key
