apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookstore-service-network-policy
  namespace: gripday-bookstore
  labels:
    app.kubernetes.io/name: gripday-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: gripday-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gripday-bookstore-service
      app.kubernetes.io/component: bookstore
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Allow traffic from gateway service
  - from:
    - namespaceSelector:
        matchLabels:
          name: gripday-gateway
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: gripday-gateway-service
    ports:
    - protocol: TCP
      port: 8082
  
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8082
  
  # Allow traffic from monitoring (Prometheus)
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8082
  
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  
  # Allow access to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: bookstore-postgres
    ports:
    - protocol: TCP
      port: 5432
  
  # Allow access to Redis
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: bookstore-redis
    ports:
    - protocol: TCP
      port: 6379
  
  # Allow access to auth service for JWT validation
  - to:
    - namespaceSelector:
        matchLabels:
          name: gripday-auth
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: gripday-auth-service
    ports:
    - protocol: TCP
      port: 8081
  
  # Allow access to observability services
  - to:
    - namespaceSelector:
        matchLabels:
          name: observability
    ports:
    - protocol: TCP
      port: 4317  # OTLP gRPC
    - protocol: TCP
      port: 4318  # OTLP HTTP
    - protocol: TCP
      port: 14268 # Jaeger collector
  
  # Allow HTTPS outbound for external services (if needed)
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
# Network policy for PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookstore-postgres-network-policy
  namespace: gripday-bookstore
  labels:
    app.kubernetes.io/name: bookstore-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: gripday-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bookstore-postgres
      app.kubernetes.io/component: database
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Only allow traffic from bookstore service
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: gripday-bookstore-service
    ports:
    - protocol: TCP
      port: 5432
  
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
