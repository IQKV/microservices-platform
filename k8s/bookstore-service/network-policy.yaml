apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookstore-service-network-policy
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: gripday-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: gripday
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gripday-bookstore-service
      app.kubernetes.io/component: bookstore
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow traffic from gateway service ONLY (API Gateway pattern)
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: gripday
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gripday-gateway-service
      ports:
        - protocol: TCP
          port: 8080

    # Allow traffic from same namespace (for service-to-service communication)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080

    # Allow traffic from monitoring (Prometheus)
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow access to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bookstore-postgres
      ports:
        - protocol: TCP
          port: 5432

    # Allow access to Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bookstore-redis
      ports:
        - protocol: TCP
          port: 6379

    # Allow access to auth service for JWT validation
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: gripday
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gripday-auth-service
      ports:
        - protocol: TCP
          port: 8080

    # Allow access to observability services
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: observability
      ports:
        - protocol: TCP
          port: 4317 # OTLP gRPC
        - protocol: TCP
          port: 4318 # OTLP HTTP
        - protocol: TCP
          port: 14268 # Jaeger collector

    # Allow HTTPS outbound for external services (if needed)
    - to: []
      ports:
        - protocol: TCP
          port: 443
---
# Network policy for PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookstore-postgres-network-policy
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: bookstore-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: gripday
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bookstore-postgres
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Only allow traffic from bookstore service
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gripday-bookstore-service
      ports:
        - protocol: TCP
          port: 5432

  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
