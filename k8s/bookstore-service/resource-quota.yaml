apiVersion: v1
kind: ResourceQuota
metadata:
  name: bookstore-service-quota
  namespace: gripday-bookstore
  labels:
    app.kubernetes.io/name: gripday-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: gripday-platform
spec:
  hard:
    # Compute resources
    requests.cpu: "6"
    requests.memory: "12Gi"
    limits.cpu: "12"
    limits.memory: "24Gi"
    
    # Storage
    requests.storage: "30Gi"
    persistentvolumeclaims: "5"
    
    # Object counts
    pods: "25"
    services: "10"
    configmaps: "10"
    secrets: "10"
    replicationcontrollers: "0"
  
  scopeSelector:
    matchExpressions:
    - operator: In
      scopeName: PriorityClass
      values: ["high-priority", "medium-priority", "low-priority"]
---
apiVersion: v1
kind: LimitRange
metadata:
  name: bookstore-service-limits
  namespace: gripday-bookstore
  labels:
    app.kubernetes.io/name: gripday-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: gripday-platform
spec:
  limits:
  # Container limits
  - type: Container
    max:
      cpu: "2"
      memory: "4Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "250m"
      memory: "256Mi"
    maxLimitRequestRatio:
      cpu: "4"
      memory: "4"
  
  # Pod limits
  - type: Pod
    max:
      cpu: "4"
      memory: "8Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
  
  # PVC limits
  - type: PersistentVolumeClaim
    max:
      storage: "15Gi"
    min:
      storage: "1Gi"
