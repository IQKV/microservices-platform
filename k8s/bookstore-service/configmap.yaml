apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-service-config
  namespace: iqscaffold-dev-env
  labels:
    app.kubernetes.io/name: iqscaffold-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: iqscaffold
data:
  application.yml: |
    server:
      port: 8080

    spring:
      application:
        name: iqscaffold-bookstore-service
      profiles:
        active: local
      
      # JPA Configuration
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: true
            use_sql_comments: true
            jdbc:
              batch_size: 20
            order_inserts: true
            order_updates: true
        open-in-view: false

      # Liquibase Configuration
      liquibase:
        change-log: classpath:db/changelog/db.changelog-master.xml
        enabled: true

      # Cache Configuration
      cache:
        type: redis
        redis:
          time-to-live: PT1H  # 1 hour default TTL

    # SpringDoc OpenAPI Configuration
    springdoc:
      api-docs:
        enabled: true
        path: /api-docs
        groups:
          enabled: true
      swagger-ui:
        enabled: true
        path: /swagger-ui.html
        groups-order: ASC
        operations-sorter: alpha
        tags-sorter: alpha
        try-it-out-enabled: true
        filter: true
        display-request-duration: true
        display-operation-id: true
        show-extensions: true
        show-common-extensions: true
      group-configs:
        - group: books
          display-name: Book Management APIs
          paths-to-match: /api/*/books/**
        - group: inventory
          display-name: Inventory Management APIs
          paths-to-match: /api/*/inventory/**
        - group: search
          display-name: Book Search APIs
          paths-to-match: /api/*/search/**
      show-actuator: true
      use-management-port: false

    # OpenTelemetry Configuration
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus,liquibase,openapi,caches
      endpoint:
        health:
          show-details: when-authorized
        liquibase:
          enabled: true
        prometheus:
          enabled: true
        caches:
          enabled: true
      metrics:
        export:
          prometheus:
            enabled: true
        distribution:
          percentiles-histogram:
            http.server.requests: true
          percentiles:
            http.server.requests: 0.5,0.95,0.99
      tracing:
        sampling:
          probability: 1.0

    # IQ Scaffold-specific configuration properties
    iqscaffold:
      bookstore:
        cache:
          book-catalog-ttl: PT2H      # 2 hours for book catalog
          search-results-ttl: PT30M   # 30 minutes for search results
          inventory-ttl: PT5M         # 5 minutes for inventory data
        pagination:
          default-page-size: 20
          max-page-size: 100
        search:
          max-results: 1000
          enable-fuzzy-search: true
      observability:
        tracing:
          enabled: true
          service-name: ${spring.application.name}
          sampling-rate: 1.0
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
          timeout: PT10S
        metrics:
          enabled: true
          path: /actuator/prometheus
          prefix: iqscaffold_bookstore
          include-host-tag: true
          include-application-tag: true
        logging:
          include-correlation-id: true
          include-trace-id: true
          include-span-id: true
          include-user-id: true
          include-tenant-id: true
          correlation-id-header: X-Correlation-ID
          request-id-header: X-Request-ID
          tenant-id-header: X-Tenant-ID
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-service-config-staging
  namespace: staging-env
  labels:
    app.kubernetes.io/name: iqscaffold-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: iqscaffold
    environment: staging
data:
  application-staging.yml: |
    server:
      port: 8080

    spring:
      profiles:
        active: staging
      
      jpa:
        show-sql: false
        properties:
          hibernate:
            format_sql: false
            use_sql_comments: false

    management:
      tracing:
        sampling:
          probability: 0.1

    iqscaffold:
      observability:
        tracing:
          sampling-rate: 0.1
        logging:
          level: INFO
      bookstore:
        cache:
          book-catalog-ttl: PT4H      # 4 hours for staging
          search-results-ttl: PT1H    # 1 hour for staging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-service-config-production
  namespace: iqscaffold-production-env
  labels:
    app.kubernetes.io/name: iqscaffold-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: iqscaffold
    environment: production
data:
  application-production.yml: |
    server:
      port: 8080

    spring:
      profiles:
        active: production
      
      jpa:
        show-sql: false
        properties:
          hibernate:
            format_sql: false
            use_sql_comments: false

    management:
      tracing:
        sampling:
          probability: 0.01

    iqscaffold:
      observability:
        tracing:
          sampling-rate: 0.01
        logging:
          level: WARN
      bookstore:
        cache:
          book-catalog-ttl: PT6H      # 6 hours for production
          search-results-ttl: PT2H    # 2 hours for production
