apiVersion: v1
kind: Service
metadata:
  name: bookstore-service
  namespace: iqscaffold-dev-env
  labels:
    app.kubernetes.io/name: iqscaffold-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: iqscaffold
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: iqscaffold-bookstore-service
    app.kubernetes.io/component: bookstore
---
# Headless service for service discovery
apiVersion: v1
kind: Service
metadata:
  name: bookstore-service-headless
  namespace: iqscaffold-dev-env
  labels:
    app.kubernetes.io/name: iqscaffold-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: iqscaffold
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: iqscaffold-bookstore-service
    app.kubernetes.io/component: bookstore
