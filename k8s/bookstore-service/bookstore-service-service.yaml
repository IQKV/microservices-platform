apiVersion: v1
kind: Service
metadata:
  name: bookstore-service
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: gripday-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: gripday-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: gripday-bookstore-service
    app.kubernetes.io/component: bookstore
---
# Headless service for service discovery
apiVersion: v1
kind: Service
metadata:
  name: bookstore-service-headless
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: gripday-bookstore-service
    app.kubernetes.io/component: bookstore
    app.kubernetes.io/part-of: gripday-platform
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: gripday-bookstore-service
    app.kubernetes.io/component: bookstore