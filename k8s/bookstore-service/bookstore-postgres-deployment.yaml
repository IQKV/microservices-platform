apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-postgres
  namespace: gripday-bookstore
  labels:
    app.kubernetes.io/name: bookstore-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: gripday-platform
    app.kubernetes.io/version: "15.8"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bookstore-postgres
      app.kubernetes.io/component: database
  strategy:
    type: Recreate  # Use Recreate for stateful services with persistent volumes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookstore-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: gripday-platform
        app.kubernetes.io/version: "15.8"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: postgres
        image: postgres:15.8-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: "gripday_bookstore_local"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: bookstore-service-secrets
              key: GRIPDAY_DATABASE_USERNAME
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bookstore-service-secrets
              key: GRIPDAY_DATABASE_PASSWORD
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
          successThreshold: 1
        
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
          successThreshold: 1
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # PostgreSQL needs to write to data directory
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
            - ALL
      
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: bookstore-postgres-pvc
      - name: postgres-init
        configMap:
          name: bookstore-postgres-init
          defaultMode: 0755
      
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookstore-postgres-pvc
  namespace: gripday-bookstore
  labels:
    app.kubernetes.io/name: bookstore-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: gripday-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard  # Adjust based on your cluster's storage classes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-postgres-init
  namespace: gripday-bookstore
  labels:
    app.kubernetes.io/name: bookstore-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: gripday-platform
data:
  01-init-extensions.sql: |
    -- Enable required PostgreSQL extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pg_trgm";
    
    -- Create indexes for better search performance
    -- These will be created by Liquibase migrations, but having them here as backup
    -- CREATE INDEX IF NOT EXISTS idx_books_title_trgm ON books USING gin (title gin_trgm_ops);
    -- CREATE INDEX IF NOT EXISTS idx_books_author_trgm ON books USING gin (author gin_trgm_ops);