apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-redis
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: bookstore-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: gripday
    app.kubernetes.io/version: "7.4-alpine"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bookstore-redis
      app.kubernetes.io/component: cache
  strategy:
    type: Recreate # Use Recreate for stateful services
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookstore-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: gripday
        app.kubernetes.io/version: "7.4-alpine"
    spec:
      priorityClassName: infrastructure-priority
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          command:
            - redis-server
            - /etc/redis/redis.conf

          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
              readOnly: true
            - name: redis-storage
              mountPath: /data

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Redis needs to write to data directory
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL

      volumes:
        - name: redis-config
          configMap:
            name: bookstore-redis-config
            defaultMode: 0644
        - name: redis-storage
          persistentVolumeClaim:
            claimName: bookstore-redis-pvc

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookstore-redis-pvc
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: bookstore-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: gripday
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard # Adjust based on your cluster's storage classes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-redis-config
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: bookstore-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: gripday
data:
  redis.conf: |
    # Redis configuration for bookstore service

    # Network
    bind 0.0.0.0
    port 6379

    # General
    daemonize no
    supervised no
    pidfile /var/run/redis_6379.pid
    loglevel notice
    logfile ""
    databases 16

    # Persistence
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data

    # Memory management
    maxmemory 200mb
    maxmemory-policy allkeys-lru

    # Security (password will be set via environment if needed)
    # requirepass will be set via REDIS_PASSWORD env var if provided

    # Performance
    tcp-keepalive 300
    timeout 0
    tcp-backlog 511

    # Disable dangerous commands in production
    # rename-command FLUSHDB ""
    # rename-command FLUSHALL ""
    # rename-command DEBUG ""
