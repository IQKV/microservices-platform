apiVersion: v1
kind: Service
metadata:
  name: bookstore-postgres
  namespace: gripday-bookstore
  labels:
    app.kubernetes.io/name: bookstore-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: gripday-platform
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app.kubernetes.io/name: bookstore-postgres
    app.kubernetes.io/component: database
---
# Headless service for StatefulSet (if needed for clustering in the future)
apiVersion: v1
kind: Service
metadata:
  name: bookstore-postgres-headless
  namespace: gripday-bookstore
  labels:
    app.kubernetes.io/name: bookstore-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: gripday-platform
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app.kubernetes.io/name: bookstore-postgres
    app.kubernetes.io/component: database