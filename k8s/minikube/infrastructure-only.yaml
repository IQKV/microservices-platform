# IQ Scaffold Platform - Infrastructure Only
# Deploy just databases and Redis for local development
# Useful when running services locally but want databases in Kubernetes

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: iqscaffold-dev-env
  labels:
    name: iqscaffold-dev-env
    environment: local

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: iqscaffold-infra-config
  namespace: iqscaffold-dev-env
data:
  REDIS_PORT: "6379"

---
# Secrets
apiVersion: v1
kind: Secret
metadata:
  name: iqscaffold-infra-secrets
  namespace: iqscaffold-dev-env
type: Opaque
data:
  # iqscaffold_user
  DB_USERNAME: Z3JpcGRheV91c2Vy
  # iqscaffold_password
  DB_PASSWORD: Z3JpcGRheV9wYXNzd29yZA==

---
# PostgreSQL for User Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-user
  namespace: iqscaffold-dev-env
  labels:
    app: postgres-user
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-user
  template:
    metadata:
      labels:
        app: postgres-user
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: iqscaffold_user
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-infra-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-infra-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - iqscaffold_user
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - iqscaffold_user
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-user
  namespace: iqscaffold-dev-env
  labels:
    app: postgres-user
spec:
  type: NodePort
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
  selector:
    app: postgres-user

---
# PostgreSQL for Bookstore Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-bookstore
  namespace: iqscaffold-dev-env
  labels:
    app: postgres-bookstore
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-bookstore
  template:
    metadata:
      labels:
        app: postgres-bookstore
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: iqscaffold_bookstore
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-infra-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-infra-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - iqscaffold_user
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - iqscaffold_user
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-bookstore
  namespace: iqscaffold-dev-env
  labels:
    app: postgres-bookstore
spec:
  type: NodePort
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30433
  selector:
    app: postgres-bookstore

---
# Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: iqscaffold-dev-env
  labels:
    app: redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --appendonly
            - "yes"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: iqscaffold-dev-env
  labels:
    app: redis
spec:
  type: NodePort
  ports:
    - port: 6379
      targetPort: 6379
      nodePort: 30379
  selector:
    app: redis
