# Gripday Platform - Minikube Ingress Configuration
#
# This file provides ingress configuration for minikube that mirrors production setup
# while keeping direct NodePort access available for debugging
#
# Enable ingress addon: minikube addons enable ingress
# Add to /etc/hosts:
#   $(minikube ip) api.gripday.site app.gripday.site auth.gripday.site
#
---
# Gateway Service Ingress (Main API Entry Point)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-service-ingress
  namespace: gripday-dev-env
  labels:
    app: gateway-service
    component: gateway
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "*"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: api.gripday.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080

---
# Auth Service Ingress (Optional - Direct Access for Debugging)
# In production, this would NOT exist - all traffic goes through gateway
# Keep this for local development convenience
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service-ingress
  namespace: gripday-dev-env
  labels:
    app: auth-service
    component: authentication
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: auth.gripday.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081

---
# Bookstore Service Ingress (Optional - Direct Access for Debugging)
# In production, this would NOT exist - all traffic goes through gateway
# Keep this for local development convenience
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookstore-service-ingress
  namespace: gripday-dev-env
  labels:
    app: bookstore-service
    component: bookstore
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: bookstore.gripday.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bookstore-service
                port:
                  number: 8082

---
# NOTES:
#
# This ingress configuration provides TWO ways to access services:
#
# 1. PRODUCTION-LIKE (API Gateway Pattern):
#    - http://api.gripday.site/api/v1/auth/login    → Gateway → Auth Service
#    - http://api.gripday.site/api/v1/bookstore/*   → Gateway → Bookstore Service
#    - This mirrors production/staging architecture
#
# 2. DIRECT ACCESS (Development/Debugging):
#    - http://auth.gripday.site/api/v1/auth/login   → Auth Service (direct)
#    - http://bookstore.gripday.site/api/v1/books   → Bookstore Service (direct)
#    - This bypasses the gateway for easier debugging
#
# Additionally, NodePort access is still available:
#    - http://$(minikube ip):30080                       → Gateway Service
#    - http://$(minikube ip):30081                       → Auth Service
#    - http://$(minikube ip):30082                       → Bookstore Service
#
# For local development, we keep ALL access methods to make debugging easier.
# In production/staging, only the API Gateway (option 1) is available.
