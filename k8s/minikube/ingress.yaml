# IQ Scaffold Platform - Minikube Ingress Configuration
#
# This file provides ingress configuration for minikube that mirrors production setup
# while keeping direct NodePort access available for debugging
#
# Enable ingress addon: minikube addons enable ingress
# Add to /etc/hosts:
#   $(minikube ip) api.iqscaffold.site app.iqscaffold.site user.iqscaffold.site
#
---
# Gateway Service Ingress (Main API Entry Point)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-service-ingress
  namespace: iqscaffold-dev-env
  labels:
    app: gateway-service
    component: gateway
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "*"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: api.iqscaffold.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080

---
# User Service Ingress (Optional - Direct Access for Debugging)
# In production, this would NOT exist - all traffic goes through gateway
# Keep this for local development convenience
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-service-ingress
  namespace: iqscaffold-dev-env
  labels:
    app: user-service
    component: authentication
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: user.iqscaffold.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8080

---
# Billing Service Ingress (Optional - Direct Access for Debugging)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billing-service-ingress
  namespace: iqscaffold-dev-env
  labels:
    app: billing-service
    component: billing
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: billing.iqscaffold.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: billing-service
                port:
                  number: 8082

---
# NOTES:
#
# This ingress configuration provides TWO ways to access services:
#
# 1. PRODUCTION-LIKE (API Gateway Pattern):
#    - http://api.iqscaffold.site/api/v1/auth/login    → Gateway → User Service
#    - This mirrors production/staging architecture
#
# 2. DIRECT ACCESS (Development/Debugging):
#    - http://user.iqscaffold.site/api/v1/auth/login   → User Service (direct)
#    - This bypasses the gateway for easier debugging
#
# Additionally, NodePort access is still available:
#    - http://$(minikube ip):30080                       → Gateway Service
#    - http://$(minikube ip):30081                       → User Service
#
# For local development, we keep ALL access methods to make debugging easier.
# In production/staging, only the API Gateway (option 1) is available.
