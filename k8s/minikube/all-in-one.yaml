# IQ Scaffold Platform - Minikube All-in-One Deployment
# This file contains all resources needed to run the platform on minikube

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: iqscaffold-dev-env
  labels:
    name: iqscaffold-dev-env
    environment: local

---
# ConfigMap with application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: iqscaffold-config
  namespace: iqscaffold-dev-env
data:
  # Database URLs
  AUTH_DB_URL: "jdbc:postgresql://postgres-user:5432/iqscaffold_user"
  BILLING_DB_URL: "jdbc:postgresql://postgres-billing:5432/iqscaffold_billing"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Service URLs
  IQSCAFFOLD_USER_SERVICE_URL: "http://user-service:8080"
  EMAIL_SERVICE_URL: "http://email-service:8080"

  # Spring Profile
  SPRING_PROFILES_ACTIVE: "local"

  # Email Configuration
  EMAIL_FROM_EMAIL: "billing@iqscaffold.local"
  EMAIL_FROM_NAME: "IQ Scaffold Billing (Local)"
  APP_BASE_URL: "http://api.iqscaffold.site"

  # JWT Configuration
  JWT_ISSUER: "iqscaffold-user-service"

  # Payment Configuration
  PAYMENT_PROVIDER: "stripe"
  BILLING_SAAS_MODE: "true"

  # Notification Configuration
  BILLING_EMAIL_NOTIFICATIONS: "true"
  BILLING_WEBHOOK_NOTIFICATIONS: "true"

  # JVM Options
  JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

---
# Secrets (base64 encoded default values for local development)
apiVersion: v1
kind: Secret
metadata:
  name: iqscaffold-secrets
  namespace: iqscaffold-dev-env
type: Opaque
data:
  # Database credentials (iqscaffold_user:iqscaffold_password)
  DB_USERNAME: aXFzY2FmZm9sZF91c2Vy
  DB_PASSWORD: aXFzY2FmZm9sZF9wYXNzd29yZA==

  # JWT Secret (local-dev-secret-key-change-in-production)
  JWT_SECRET: bG9jYWwtZGV2LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24=

  # Stripe Payment Configuration (test keys)
  STRIPE_API_KEY: c2tfdGVzdF9wbGFjZWhvbGRlcg== # sk_test_placeholder
  STRIPE_WEBHOOK_SECRET: d2hzZWNfcGxhY2Vob2xkZXI= # whsec_placeholder
  STRIPE_CLIENT_ID: Y2FfdGVzdF9wbGFjZWhvbGRlcg== # ca_test_placeholder

  # Stripe General Configuration (test keys)
  STRIPE_PUBLIC_KEY: cGtfdGVzdF9wbGFjZWhvbGRlcg== # pk_test_placeholder
  STRIPE_SECRET_KEY: c2tfdGVzdF9wbGFjZWhvbGRlcg== # sk_test_placeholder (same as API key)
  STRIPE_CONNECT_CLIENT_ID: Y2FfdGVzdF9wbGFjZWhvbGRlcg== # ca_test_placeholder

  # Email SMTP Configuration (empty for local development)
  SMTP_HOST: bG9jYWxob3N0 # localhost
  SMTP_PORT: MTA5NQ== # 1095 (dummy port)
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""

  # Redis password (empty for local)
  REDIS_PASSWORD: ""

---
# PostgreSQL for User Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-user
  namespace: iqscaffold-dev-env
  labels:
    app: postgres-user
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-user
  template:
    metadata:
      labels:
        app: postgres-user
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: iqscaffold_user
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - iqscaffold_user
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - iqscaffold_user
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-user
  namespace: iqscaffold-dev-env
  labels:
    app: postgres-user
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-user

---
# PostgreSQL for Billing Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-billing
  namespace: iqscaffold-dev-env
  labels:
    app: postgres-billing
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-billing
  template:
    metadata:
      labels:
        app: postgres-billing
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: iqscaffold_billing
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - iqscaffold_user
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - iqscaffold_user
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-billing
  namespace: iqscaffold-dev-env
  labels:
    app: postgres-billing
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-billing

---
# Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: iqscaffold-dev-env
  labels:
    app: redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --appendonly
            - "yes"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: iqscaffold-dev-env
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis

---
# User Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: iqscaffold-dev-env
  labels:
    app: user-service
    component: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        component: microservice
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z postgres-user 5432; do
                echo "Waiting for postgres-user..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis to be ready..."
              until nc -z redis 6379; do
                echo "Waiting for redis..."
                sleep 2
              done
              echo "Redis is ready!"
      containers:
        - name: user-service
          image: iqscaffold/iqscaffold-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: iqscaffold-config
                  key: SPRING_PROFILES_ACTIVE
            - name: IQSCAFFOLD_DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: iqscaffold-config
                  key: AUTH_DB_URL
            - name: IQSCAFFOLD_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-secrets
                  key: DB_USERNAME
            - name: IQSCAFFOLD_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-secrets
                  key: DB_PASSWORD
            - name: IQSCAFFOLD_CACHE_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: iqscaffold-config
                  key: REDIS_HOST
            - name: IQSCAFFOLD_CACHE_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: iqscaffold-config
                  key: REDIS_PORT
            - name: IQSCAFFOLD_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-secrets
                  key: JWT_SECRET
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: iqscaffold-config
                  key: JAVA_OPTS
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: iqscaffold-dev-env
  labels:
    app: user-service
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
      name: http
  selector:
    app: user-service

---
