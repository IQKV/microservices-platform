# IQ Scaffold Platform - Minikube All-in-One Deployment
# This file contains all resources needed to run the platform on minikube

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: iqscaffold-dev-env
  labels:
    name: iqscaffold-dev-env
    environment: local

---
# ConfigMap with application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: iqscaffold-config
  namespace: iqscaffold-dev-env
data:
  # Database URLs
  AUTH_DB_URL: "jdbc:postgresql://postgres-user:5432/iqscaffold_user"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Service URLs
  USER_SERVICE_URL: "http://user-service:8080"

  # Spring Profile
  SPRING_PROFILES_ACTIVE: "local"

  # JVM Options
  JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

---
# Secrets (base64 encoded default values for local development)
apiVersion: v1
kind: Secret
metadata:
  name: iqscaffold-secrets
  namespace: iqscaffold-dev-env
type: Opaque
data:
  # Database credentials (iqscaffold_user:iqscaffold_password)
  DB_USERNAME: Z3JpcGRheV91c2Vy
  DB_PASSWORD: Z3JpcGRheV9wYXNzd29yZA==

  # JWT Secret (local-dev-secret-key-change-in-production)
  JWT_SECRET: bG9jYWwtZGV2LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24=

  # Redis password (empty for local)
  REDIS_PASSWORD: ""

---
# PostgreSQL for User Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-user
  namespace: iqscaffold-dev-env
  labels:
    app: postgres-user
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-user
  template:
    metadata:
      labels:
        app: postgres-user
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: iqscaffold_user
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - iqscaffold_user
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - iqscaffold_user
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-user
  namespace: iqscaffold-dev-env
  labels:
    app: postgres-user
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-user

---
# Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: iqscaffold-dev-env
  labels:
    app: redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --appendonly
            - "yes"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: iqscaffold-dev-env
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis

---
# User Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: iqscaffold-dev-env
  labels:
    app: user-service
    component: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        component: microservice
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z postgres-user 5432; do
                echo "Waiting for postgres-user..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis to be ready..."
              until nc -z redis 6379; do
                echo "Waiting for redis..."
                sleep 2
              done
              echo "Redis is ready!"
      containers:
        - name: user-service
          image: iqscaffold/iqscaffold-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: iqscaffold-config
                  key: SPRING_PROFILES_ACTIVE
            - name: IQSCAFFOLD_DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: iqscaffold-config
                  key: AUTH_DB_URL
            - name: IQSCAFFOLD_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-secrets
                  key: DB_USERNAME
            - name: IQSCAFFOLD_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-secrets
                  key: DB_PASSWORD
            - name: IQSCAFFOLD_CACHE_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: iqscaffold-config
                  key: REDIS_HOST
            - name: IQSCAFFOLD_CACHE_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: iqscaffold-config
                  key: REDIS_PORT
            - name: IQSCAFFOLD_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: iqscaffold-secrets
                  key: JWT_SECRET
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: iqscaffold-config
                  key: JAVA_OPTS
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: iqscaffold-dev-env
  labels:
    app: user-service
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
      name: http
  selector:
    app: user-service

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: iqscaffold-dev-env
  labels:
    app: gateway-service
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
  selector:
    app: gateway-service
