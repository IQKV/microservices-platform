apiVersion: v1
kind: Service
metadata:
  name: user-redis
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: user-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: gripday
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: user-redis
    app.kubernetes.io/component: cache
---
apiVersion: v1
kind: Service
metadata:
  name: user-redis-staging
  namespace: staging-env
  labels:
    app.kubernetes.io/name: user-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: gripday
    environment: staging
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: user-redis
    app.kubernetes.io/component: cache
    environment: staging
---
apiVersion: v1
kind: Service
metadata:
  name: user-redis-production
  namespace: gripday-production-env
  labels:
    app.kubernetes.io/name: user-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: gripday
    environment: production
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: user-redis
    app.kubernetes.io/component: cache
    environment: production
