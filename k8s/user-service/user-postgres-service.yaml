apiVersion: v1
kind: Service
metadata:
  name: user-postgres
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: user-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: gripday
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: user-postgres
    app.kubernetes.io/component: database
---
apiVersion: v1
kind: Service
metadata:
  name: user-postgres-staging
  namespace: staging-env
  labels:
    app.kubernetes.io/name: user-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: gripday
    environment: staging
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: user-postgres
    app.kubernetes.io/component: database
    environment: staging
---
apiVersion: v1
kind: Service
metadata:
  name: user-postgres-production
  namespace: gripday-production-env
  labels:
    app.kubernetes.io/name: user-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: gripday
    environment: production
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: user-postgres
    app.kubernetes.io/component: database
    environment: production
