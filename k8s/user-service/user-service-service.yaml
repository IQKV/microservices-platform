apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: iqscaffold-dev-env
  labels:
    app.kubernetes.io/name: iqscaffold-user-service
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: iqscaffold
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: iqscaffold-user-service
    app.kubernetes.io/component: authentication
---
apiVersion: v1
kind: Service
metadata:
