apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service-ingress
  namespace: gripday-auth
  labels:
    app.kubernetes.io/name: gripday-auth-service
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: gripday-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-ID,X-Correlation-ID"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
  - host: auth.gripday.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8081
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8081
      - path: /actuator
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8081
      - path: /swagger-ui
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8081
      - path: /api-docs
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8081
# NOTE: Staging and production environments do NOT have direct ingress
# All traffic routes through the Gateway Service (API Gateway pattern)
# Direct ingress is only available in local development environment for debugging