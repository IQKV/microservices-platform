  labels:
    app.kubernetes.io/name: auth-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: gripday-platform
    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app.kubernetes.io/name: auth-postgres
    app.kubernetes.io/component: database
    environment: staging
---
apiVersion: v1
kind: Service
metadata:
  name: auth-postgres-production
