apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: gripday-auth
  labels:
    app.kubernetes.io/name: gripday-auth-service
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: gripday-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: gripday-auth-service
    app.kubernetes.io/component: authentication
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-headless
  namespace: gripday-auth
  labels:
    app.kubernetes.io/name: gripday-auth-service
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: gripday-platform
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: gripday-auth-service
    app.kubernetes.io/component: authentication
---
