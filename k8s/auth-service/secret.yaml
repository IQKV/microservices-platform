apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: gripday-user-service
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: gripday
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  # Database credentials
  GRIPDAY_DATABASE_USERNAME: Z3JpcGRheV91c2Vy # gripday_user
  GRIPDAY_DATABASE_PASSWORD: Z3JpcGRheV9wYXNzd29yZA== # gripday_password

  # JWT Secret
  GRIPDAY_AUTH_JWT_SECRET: bG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tdXNl # local-development-secret-key-not-for-production-use

  # Redis password (empty for local)
  GRIPDAY_CACHE_REDIS_PASSWORD: ""

  # OAuth2 credentials (base64 encoded placeholders)
  GRIPDAY_AUTH_OAUTH2_GOOGLE_CLIENT_ID: eW91ci1nb29nbGUtY2xpZW50LWlk # your-google-client-id
  GRIPDAY_AUTH_OAUTH2_GOOGLE_CLIENT_SECRET: eW91ci1nb29nbGUtY2xpZW50LXNlY3JldA== # your-google-client-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets-staging
  namespace: staging-env
  labels:
    app.kubernetes.io/name: gripday-user-service
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: gripday
    environment: staging
type: Opaque
data:
  # Base64 encoded values - replace with actual staging values
  GRIPDAY_DATABASE_USERNAME: Z3JpcGRheV91c2VyX3N0YWdpbmc= # gripday_user_staging
  GRIPDAY_DATABASE_PASSWORD: c3RhZ2luZy1kYi1wYXNzd29yZA== # staging-db-password
  GRIPDAY_AUTH_JWT_SECRET: c3RhZ2luZy1qd3Qtc2VjcmV0LWtleQ== # staging-jwt-secret-key
  GRIPDAY_CACHE_REDIS_PASSWORD: c3RhZ2luZy1yZWRpcy1wYXNzd29yZA== # staging-redis-password
  GRIPDAY_AUTH_OAUTH2_GOOGLE_CLIENT_ID: c3RhZ2luZy1nb29nbGUtY2xpZW50LWlk # staging-google-client-id
  GRIPDAY_AUTH_OAUTH2_GOOGLE_CLIENT_SECRET: c3RhZ2luZy1nb29nbGUtY2xpZW50LXNlY3JldA== # staging-google-client-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets-production
  namespace: gripday-production-env
  labels:
    app.kubernetes.io/name: gripday-user-service
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: gripday
    environment: production
type: Opaque
data:
  # Base64 encoded values - replace with actual production values from vault/secrets manager
  GRIPDAY_DATABASE_USERNAME: Z3JpcGRheV91c2VyX3Byb2Q= # gripday_user_prod
  GRIPDAY_DATABASE_PASSWORD: cHJvZC1kYi1wYXNzd29yZA== # prod-db-password
  GRIPDAY_AUTH_JWT_SECRET: cHJvZC1qd3Qtc2VjcmV0LWtleQ== # prod-jwt-secret-key
  GRIPDAY_CACHE_REDIS_PASSWORD: cHJvZC1yZWRpcy1wYXNzd29yZA== # prod-redis-password
  GRIPDAY_AUTH_OAUTH2_GOOGLE_CLIENT_ID: cHJvZC1nb29nbGUtY2xpZW50LWlk # prod-google-client-id
  GRIPDAY_AUTH_OAUTH2_GOOGLE_CLIENT_SECRET: cHJvZC1nb29nbGUtY2xpZW50LXNlY3JldA== # prod-google-client-secret
