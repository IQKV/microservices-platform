apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: gripday-auth-service
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: gripday-platform
data:
  application.yml: |
    server:
      port: 8081

    spring:
      application:
        name: gripday-auth-service
      profiles:
        active: local
      
      # JPA Configuration
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: true
            use_sql_comments: true
            jdbc:
              batch_size: 20
            order_inserts: true
            order_updates: true
        open-in-view: false

      # Liquibase Configuration
      liquibase:
        change-log: classpath:db/changelog/db.changelog-master.xml
        enabled: true

    # SpringDoc OpenAPI Configuration
    springdoc:
      api-docs:
        enabled: true
        path: /api-docs
        groups:
          enabled: true
      swagger-ui:
        enabled: true
        path: /swagger-ui.html
        groups-order: ASC
        operations-sorter: alpha
        tags-sorter: alpha
        try-it-out-enabled: true
        filter: true
        display-request-duration: true
        display-operation-id: true
        show-extensions: true
        show-common-extensions: true
      group-configs:
        - group: authentication
          display-name: Authentication APIs
          paths-to-match: /api/*/auth/**
        - group: user-management
          display-name: User Management APIs
          paths-to-match: /api/*/users/**
        - group: tenant-management
          display-name: Tenant Management APIs
          paths-to-match: /api/*/tenants/**
      show-actuator: true
      use-management-port: false

    # OpenTelemetry Configuration
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus,liquibase,openapi
      endpoint:
        health:
          show-details: when-authorized
        liquibase:
          enabled: true
        prometheus:
          enabled: true
      metrics:
        export:
          prometheus:
            enabled: true
        distribution:
          percentiles-histogram:
            http.server.requests: true
          percentiles:
            http.server.requests: 0.5,0.95,0.99
      tracing:
        sampling:
          probability: 1.0

    # Gripday-specific configuration properties
    gripday:
      auth:
        jwt:
          access-token-expiry: PT15M  # 15 minutes
          refresh-token-expiry: P7D   # 7 days
          issuer: gripday-auth-service
      observability:
        tracing:
          enabled: true
          service-name: ${spring.application.name}
          sampling-rate: 1.0
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
          timeout: PT10S
        metrics:
          enabled: true
          path: /actuator/prometheus
          prefix: gripday_auth
          include-host-tag: true
          include-application-tag: true
        logging:
          include-correlation-id: true
          include-trace-id: true
          include-span-id: true
          include-user-id: true
          include-tenant-id: true
          correlation-id-header: X-Correlation-ID
          request-id-header: X-Request-ID
          tenant-id-header: X-Tenant-ID
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config-staging
  namespace: staging-env
  labels:
    app.kubernetes.io/name: gripday-auth-service
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: gripday-platform
    environment: staging
data:
  application-staging.yml: |
    server:
      port: 8081

    spring:
      profiles:
        active: staging
      
      jpa:
        show-sql: false
        properties:
          hibernate:
            format_sql: false
            use_sql_comments: false

    management:
      tracing:
        sampling:
          probability: 0.1

    gripday:
      observability:
        tracing:
          sampling-rate: 0.1
        logging:
          level: INFO
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config-production
  namespace: gripday-production-env
  labels:
    app.kubernetes.io/name: gripday-auth-service
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: gripday-platform
    environment: production
data:
  application-production.yml: |
    server:
      port: 8081

    spring:
      profiles:
        active: production
      
      jpa:
        show-sql: false
        properties:
          hibernate:
            format_sql: false
            use_sql_comments: false

    management:
      tracing:
        sampling:
          probability: 0.01

    gripday:
      observability:
        tracing:
          sampling-rate: 0.01
        logging:
          level: WARN
