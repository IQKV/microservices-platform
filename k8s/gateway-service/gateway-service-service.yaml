apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: gripday-gateway
  labels:
    app.kubernetes.io/name: gripday-gateway-service
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: gripday-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: gripday-gateway-service
    app.kubernetes.io/component: gateway
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service-headless
