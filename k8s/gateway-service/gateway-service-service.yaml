    app.kubernetes.io/part-of: gripday-platform
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: gripday-gateway-service
    app.kubernetes.io/component: gateway
---
