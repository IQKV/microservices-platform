apiVersion: v1
kind: Service
metadata:
  name: gateway-redis
  namespace: gripday-gateway
  labels:
    app.kubernetes.io/name: gateway-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: gripday-platform
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app.kubernetes.io/name: gateway-redis
    app.kubernetes.io/component: cache
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-redis-staging
  namespace: staging-env
  labels:
    app.kubernetes.io/name: gateway-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: gripday-platform
    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app.kubernetes.io/name: gateway-redis
    app.kubernetes.io/component: cache
    environment: staging
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-redis-production
  namespace: production-env
  labels:
    app.kubernetes.io/name: gateway-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: gripday-platform
    environment: production
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app.kubernetes.io/name: gateway-redis
    app.kubernetes.io/component: cache
    environment: production