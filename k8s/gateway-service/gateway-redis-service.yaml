apiVersion: v1
kind: Service
metadata:
  name: gateway-redis
  namespace: iqscaffold-dev-env
  labels:
    app.kubernetes.io/name: gateway-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: iqscaffold
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: gateway-redis
    app.kubernetes.io/component: cache
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-redis-staging
  namespace: staging-env
  labels:
    app.kubernetes.io/name: gateway-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: iqscaffold
    environment: staging
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: gateway-redis
    app.kubernetes.io/component: cache
    environment: staging
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-redis-production
  namespace: iqscaffold-production-env
  labels:
    app.kubernetes.io/name: gateway-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: iqscaffold
    environment: production
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: gateway-redis
    app.kubernetes.io/component: cache
    environment: production
