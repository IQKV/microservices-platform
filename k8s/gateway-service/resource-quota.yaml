apiVersion: v1
kind: ResourceQuota
metadata:
  name: gateway-service-quota
  namespace: gripday-gateway
  labels:
    app.kubernetes.io/name: gripday-gateway-service
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: gripday-platform
spec:
  hard:
    # Compute resources (gateway needs more for traffic handling)
    requests.cpu: "8"
    requests.memory: "16Gi"
    limits.cpu: "16"
    limits.memory: "32Gi"
    
    # Storage
    requests.storage: "10Gi"
    persistentvolumeclaims: "3"
    
    # Object counts
    pods: "30"
    services: "10"
    configmaps: "10"
    secrets: "10"
    replicationcontrollers: "0"
  
  scopeSelector:
    matchExpressions:
    - operator: In
      scopeName: PriorityClass
      values: ["high-priority", "medium-priority", "low-priority"]
---
apiVersion: v1
kind: LimitRange
metadata:
  name: gateway-service-limits
  namespace: gripday-gateway
  labels:
    app.kubernetes.io/name: gripday-gateway-service
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: gripday-platform
spec:
  limits:
  # Container limits (gateway needs more resources)
  - type: Container
    max:
      cpu: "4"
      memory: "8Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    default:
      cpu: "1000m"
      memory: "1Gi"
    defaultRequest:
      cpu: "500m"
      memory: "768Mi"
    maxLimitRequestRatio:
      cpu: "4"
      memory: "4"
  
  # Pod limits
  - type: Pod
    max:
      cpu: "8"
      memory: "16Gi"
    min:
      cpu: "200m"
      memory: "256Mi"
  
  # PVC limits
  - type: PersistentVolumeClaim
    max:
      storage: "5Gi"
    min:
      storage: "512Mi"
