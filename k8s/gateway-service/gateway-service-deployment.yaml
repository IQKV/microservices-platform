apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: gripday-gateway-service
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: gripday
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gripday-gateway-service
      app.kubernetes.io/component: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gripday-gateway-service
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: gripday
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: gateway-service-sa
      priorityClassName: high-priority
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway-service
          image: gripday/gripday-gateway-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # Spring Profile
            - name: SPRING_PROFILES_ACTIVE
              value: "local"

            # Redis Configuration
            - name: GRIPDAY_CACHE_REDIS_HOST
              value: "gateway-redis"
            - name: GRIPDAY_CACHE_REDIS_PORT
              value: "6379"
            - name: GRIPDAY_CACHE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-service-secrets
                  key: GRIPDAY_CACHE_REDIS_PASSWORD
                  optional: true
            - name: GRIPDAY_CACHE_REDIS_DATABASE
              value: "1"

            # JWT Configuration
            - name: GRIPDAY_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-service-secrets
                  key: GRIPDAY_AUTH_JWT_SECRET

            # Observability Configuration
            - name: GRIPDAY_OBSERVABILITY_TRACING_ENDPOINT
              value: "http://jaeger-collector:14268/api/traces"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "gripday-gateway-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=gripday-gateway-service,service.version=1.0.0,deployment.environment=local"

            # JVM Configuration for reactive workloads
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp

          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
            successThreshold: 1

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL

          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 15

      volumes:
        - name: config-volume
          configMap:
            name: gateway-service-config
        - name: tmp-volume
          emptyDir: {}

      restartPolicy: Always
      terminationGracePeriodSeconds: 30

      # Topology spread constraints for better distribution
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gripday-gateway-service
              app.kubernetes.io/component: gateway
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gripday-gateway-service
              app.kubernetes.io/component: gateway

      # Pod disruption budget for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - gripday-gateway-service
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-service-sa
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: gripday-gateway-service
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: gripday
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-service-pdb
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: gripday-gateway-service
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: gripday
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gripday-gateway-service
      app.kubernetes.io/component: gateway
