apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-service-config
  namespace: gripday-dev-env
  labels:
    app.kubernetes.io/name: gripday-gateway-service
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: gripday
data:
  application.yml: |
    server:
      port: 8080

    spring:
      application:
        name: gripday-gateway-service
      profiles:
        active: local
      
      cloud:
        gateway:
          routes:
          # ===== User Service Routes =====
          - id: user-service-api
            uri: http://user-service.gripday-user.svc.cluster.local:8080
            predicates:
            - Path=/api/v1/auth/**
            filters:
            - StripPrefix=0
          
          - id: user-service-users
            uri: http://user-service.gripday-user.svc.cluster.local:8080
            predicates:
            - Path=/api/v1/users/**
            filters:
            - StripPrefix=0
          
          - id: user-service-tenants
            uri: http://user-service.gripday-user.svc.cluster.local:8080
            predicates:
            - Path=/api/v1/tenants/**
            filters:
            - StripPrefix=0
          
          - id: user-service-actuator
            uri: http://user-service.gripday-user.svc.cluster.local:8080
            predicates:
            - Path=/api/v1/auth/actuator/**
            filters:
            - RewritePath=/api/v1/auth/(?<segment>.*), /$\{segment}
          
          # ===== Bookstore Service Routes =====
          - id: bookstore-service-api
            uri: http://bookstore-service.gripday-bookstore.svc.cluster.local:8080
            predicates:
            - Path=/api/v1/bookstore/**
            filters:
            - StripPrefix=0
          
          - id: bookstore-service-public
            uri: http://bookstore-service.gripday-bookstore.svc.cluster.local:8080
            predicates:
            - Path=/api/v1/bookstore/public/**
            filters:
            - StripPrefix=0
          
          - id: bookstore-service-actuator
            uri: http://bookstore-service.gripday-bookstore.svc.cluster.local:8080
            predicates:
            - Path=/api/v1/bookstore/actuator/**
            filters:
            - RewritePath=/api/v1/bookstore/(?<segment>.*), /$\{segment}
          
          # ===== Gateway Health & Monitoring =====
          - id: gateway-actuator
            uri: http://localhost:8080
            predicates:
            - Path=/actuator/**
            filters:
            - StripPrefix=0
          
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
                - OPTIONS
                allowedHeaders:
                - "*"
                allowCredentials: true
                maxAge: 3600
          
          default-filters:
          - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

    # OpenTelemetry Configuration
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus,gateway
      endpoint:
        health:
          show-details: when-authorized
        prometheus:
          enabled: true
      metrics:
        export:
          prometheus:
            enabled: true
        distribution:
          percentiles-histogram:
            http.server.requests: true
          percentiles:
            http.server.requests: 0.5,0.95,0.99
      tracing:
        sampling:
          probability: 1.0

    # Gripday-specific configuration properties
    gripday:
      gateway:
        auth:
          jwt:
            secret: ${GRIPDAY_AUTH_JWT_SECRET}
            issuer: gripday-user-service
        rate-limiting:
          enabled: true
          default-requests-per-minute: 60
          burst-capacity: 10
          replenish-rate: 1
        circuit-breaker:
          enabled: true
          failure-rate-threshold: 50
          wait-duration-in-open-state: 30s
          sliding-window-size: 10
          minimum-number-of-calls: 5
      observability:
        tracing:
          enabled: true
          service-name: ${spring.application.name}
          sampling-rate: 1.0
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
          timeout: PT10S
        metrics:
          enabled: true
          path: /actuator/prometheus
          prefix: gripday_gateway
          include-host-tag: true
          include-application-tag: true
        logging:
          include-correlation-id: true
          include-trace-id: true
          include-span-id: true
          include-user-id: true
          include-tenant-id: true
          correlation-id-header: X-Correlation-ID
          request-id-header: X-Request-ID
          tenant-id-header: X-Tenant-ID
---
