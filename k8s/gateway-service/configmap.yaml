          - id: user-service-tenants
            uri: http://user-service-staging.staging-env.svc.cluster.local:8080
            predicates:
            - Path=/api/v1/tenants/**
            filters:
            - StripPrefix=0
          
          # ===== Bookstore Service Routes =====
          - id: bookstore-service-api
            uri: http://bookstore-service.staging-env.svc.cluster.local:8080
            predicates:
            - Path=/api/v1/bookstore/**
            filters:
            - StripPrefix=0
          
          - id: bookstore-service-public
            uri: http://bookstore-service.staging-env.svc.cluster.local:8080
            predicates:
            - Path=/api/v1/bookstore/public/**
            filters:
            - StripPrefix=0
          
          # ===== Gateway Health =====
          - id: gateway-actuator
            uri: http://localhost:8080
            predicates:
            - Path=/actuator/**
            filters:
            - StripPrefix=0

    management:
      tracing:
        sampling:
          probability: 0.1

    gripday:
      gateway:
        rate-limiting:
          default-requests-per-minute: 120
          burst-capacity: 20
      observability:
        tracing:
          sampling-rate: 0.1
        logging:
          level: INFO
