apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-service-network-policy
  namespace: gripday-gateway
  labels:
    app.kubernetes.io/name: gripday-gateway-service
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: gripday-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gripday-gateway-service
      app.kubernetes.io/component: gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  # Allow ingress from monitoring namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
  # Allow ingress from same namespace (for service mesh)
  - from:
    - namespaceSelector:
        matchLabels:
          name: gripday-gateway
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow egress to auth service
  - to:
    - namespaceSelector:
        matchLabels:
          name: gripday-auth
    ports:
    - protocol: TCP
      port: 8081
  # Allow egress to Redis
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: gateway-redis
          app.kubernetes.io/component: cache
    ports:
    - protocol: TCP
      port: 6379
  # Allow egress to DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow egress to observability stack
  - to:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 4317  # OTLP
    - protocol: TCP
      port: 14268  # Jaeger
    - protocol: TCP
      port: 9090   # Prometheus
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-redis-network-policy
  namespace: gripday-gateway
  labels:
    app.kubernetes.io/name: gateway-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: gripday-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway-redis
      app.kubernetes.io/component: cache
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from gateway service only
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: gripday-gateway-service
          app.kubernetes.io/component: gateway
    ports:
    - protocol: TCP
      port: 6379
  # Allow ingress from monitoring for metrics
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 6379
  egress:
  # Allow egress to DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53