# ============================================================================
# IQ Scaffold Microservices Platform - Drone CI/CD Pipeline
# ============================================================================
# Pipeline Flow:
#   1. VerifyCode        - Code quality, tests, and static analysis
#   2. PublishArtifacts  - Maven artifacts to Nexus repository
#   3. PublishDockerImage - Container images to registry
#   4. Deployment        - Helm-based Kubernetes deployments
#   5. ReleasePackage    - Automated version management
# ============================================================================

# ============================================================================
# Pipeline 1: VerifyCode
# ============================================================================
# Validates code quality, runs tests, and performs static analysis
# Triggers: Push to dev, feature/*, prerelease/*, *.*.x branches and tags
# ============================================================================
kind: pipeline
name: VerifyCode
type: docker

trigger:
  event:
    - push
    - tag
  ref:
    include:
      - refs/heads/dev # Main development branch
      - refs/heads/feature/* # Feature branches
      - refs/heads/prerelease/* # Release candidate branches
      - refs/heads/*.*.x # Maintenance branches
      - refs/tags/* # Version tags

# Persistent volumes for dependency caching
volumes:
  - name: maven-cache
    host:
      path: /app/.m2
  - name: npm-cache
    host:
      path: /app/.npm-cache
  - name: pnpm-store
    host:
      path: /app/.pnpm-store

steps:
  # --------------------------------------------------------------------------
  # Step 1: Code Coverage Gate
  # --------------------------------------------------------------------------
  # Runs unit tests, integration tests, and measures code coverage
  # Coverage thresholds (JaCoCo):
  #   - user-service: 18% instruction, 48% line, 30% branch
  #   - gateway-service: 27% instruction
  #   - bookstore-service: 60% instruction, 65% line, 50% branch
  # --------------------------------------------------------------------------
  - name: code-coverage-gate
    image: cicdtools/pipeline-runner
    pull: never
    volumes:
      - name: maven-cache
        path: /root/.m2
    environment:
      DATASOURCE_DRIVER: org.postgresql.Driver
      DATASOURCE_URL: jdbc:postgresql://db:5432/svc_testing_db
      NEXUS_DEPLOYER_USERNAME:
        from_secret: NEXUS_DEPLOYER_USERNAME
      NEXUS_DEPLOYER_PASSWORD:
        from_secret: NEXUS_DEPLOYER_PASSWORD
    commands:
      - javac -version
      - mvn -version
      - pnpm install && pnpm lint # Frontend linting
      - mvn clean verify -Dstyle.color=always -Dmaven.javadoc.skip=true -s ../maven-settings.xml -Ddeployer.username=$NEXUS_DEPLOYER_USERNAME -Ddeployer.password=$NEXUS_DEPLOYER_PASSWORD

  # --------------------------------------------------------------------------
  # Step 2: Static Analysis Gate
  # --------------------------------------------------------------------------
  # Performs comprehensive static code analysis:
  #   - SonarQube: Code quality, security vulnerabilities, code smells
  #   - PMD: Code quality rules for all three services
  #   - SpotBugs: Bug pattern detection with custom exclusions
  # Quality gate blocks pipeline if thresholds not met
  # --------------------------------------------------------------------------
  - name: static-analysis-gate
    depends_on:
      - code-coverage-gate
    image: cicdtools/pipeline-runner
    pull: never
    volumes:
      - name: maven-cache
        path: /root/.m2
      - name: npm-cache
        path: /root/.npm
    environment:
      NEXUS_DEPLOYER_USERNAME:
        from_secret: NEXUS_DEPLOYER_USERNAME
      NEXUS_DEPLOYER_PASSWORD:
        from_secret: NEXUS_DEPLOYER_PASSWORD
      SONAR_HOST:
        from_secret: SONAR_HOST
      SONAR_TOKEN:
        from_secret: SONAR_TOKEN
    commands:
      # Copy dependencies for SonarQube analysis
      - mvn org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -Dmdep.prependGroupId=true -Dstyle.color=always -s ../maven-settings.xml -Ddeployer.username=$NEXUS_DEPLOYER_USERNAME -Ddeployer.password=$NEXUS_DEPLOYER_PASSWORD

      # SonarQube analysis with quality gate (blocks on failure)
      - mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar '-Dsonar.java.libraries=target/dependency/*.jar' '-Dsonar.java.test.libraries=target/classes,target/dependency/*.jar' -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300 -Dsonar.host.url=$SONAR_HOST -Dsonar.token=$SONAR_TOKEN -Dsonar.projectKey=${DRONE_REPO_OWNER}:${DRONE_REPO_NAME} -Dsonar.projectName=${DRONE_REPO_OWNER}:${DRONE_REPO_NAME} -Dstyle.color=always -Dmaven.javadoc.skip=true --batch-mode -s ../maven-settings.xml -Ddeployer.username=$NEXUS_DEPLOYER_USERNAME -Ddeployer.password=$NEXUS_DEPLOYER_PASSWORD

      # PMD analysis for each microservice (High priority violations only)
      - pmd check --minimum-priority High -d ./iqscaffold-user-service -f text -R https://raw.githubusercontent.com/KnowHowDevOps/homelab-operations-pipeline/dev/resources/pmd/ruleset.xml
      - pmd check --minimum-priority High -d ./iqscaffold-bookstore-service -f text -R https://raw.githubusercontent.com/KnowHowDevOps/homelab-operations-pipeline/dev/resources/pmd/ruleset.xml
      - pmd check --minimum-priority High -d ./iqscaffold-gateway-service -f text -R https://raw.githubusercontent.com/KnowHowDevOps/homelab-operations-pipeline/dev/resources/pmd/ruleset.xml

      # SpotBugs analysis with custom exclusions
      - wget -O /drone/spotbugs-exclude.xml https://raw.githubusercontent.com/KnowHowDevOps/homelab-operations-pipeline/dev/resources/spotbugs-exclude.xml
      - mvn com.github.spotbugs:spotbugs-maven-plugin:4.9.8.2:check -s /drone/maven-settings.xml -Ddeployer.username=$NEXUS_DEPLOYER_USERNAME -Ddeployer.password=$NEXUS_DEPLOYER_PASSWORD  -Dspotbugs.xmlOutput=true -Dspotbugs.failOnError=true -Dspotbugs.excludeFilterFile=/drone/spotbugs-exclude.xml -Dspotbugs.includeTests=true -Dstyle.color=always

  # --------------------------------------------------------------------------
  # Step 3: Slack Notification (Failure Only)
  # --------------------------------------------------------------------------
  # Notifies team in Slack when verification fails
  # --------------------------------------------------------------------------
  - name: notify-slack-on-failure
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: dev
      template: >
        :red_circle: :thunder_cloud_and_rain: {{build.link}} ({{build.branch}}) by {{build.author}}
    when:
      status:
        - failure
    depends_on:
      - code-coverage-gate
      - static-analysis-gate

# PostgreSQL service for integration tests (Testcontainers alternative)
services:
  - name: db
    image: postgres:16.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: svc_testing_db

---
# ============================================================================
# Pipeline 2: PublishArtifacts
# ============================================================================
# Publishes Maven artifacts to Nexus repository
# Triggers: Push to dev, prerelease/*, *.*.x branches and tags
# Artifacts:
#   - SNAPSHOT JARs (dev, prerelease, maintenance branches)
#   - Release JARs (tags only)
#   - GitHub releases with changelog (tags only)
# ============================================================================
kind: pipeline
name: PublishArtifacts
type: docker

trigger:
  event:
    - push
    - tag
  ref:
    - refs/heads/dev
    - refs/heads/prerelease/*
    - refs/heads/*.*.x
    - refs/tags/*

depends_on:
  - VerifyCode # Only runs if code verification passes

volumes:
  - name: maven-cache
    host:
      path: /app/.m2
  - name: pnpm-store
    host:
      path: /app/.pnpm-store

steps:
  # --------------------------------------------------------------------------
  # Step 1: Publish SNAPSHOT JAR
  # --------------------------------------------------------------------------
  # Deploys SNAPSHOT artifacts to Nexus for dev/prerelease/maintenance branches
  # Skips tests as they already passed in VerifyCode pipeline
  # --------------------------------------------------------------------------
  - name: publish-snapshot-jar
    image: cicdtools/pipeline-runner
    pull: never
    volumes:
      - name: maven-cache
        path: /root/.m2
    environment:
      NEXUS_DEPLOYER_USERNAME:
        from_secret: NEXUS_DEPLOYER_USERNAME
      NEXUS_DEPLOYER_PASSWORD:
        from_secret: NEXUS_DEPLOYER_PASSWORD
    commands:
      - mvn deploy -Dstyle.color=always -DskipTests -Dmaven.test.skip=true -Dmaven.javadoc.skip=true -Dcheckstyle.skip=true -s ../maven-settings.xml -Ddeployer.username=$NEXUS_DEPLOYER_USERNAME -Ddeployer.password=$NEXUS_DEPLOYER_PASSWORD -DaltDeploymentRepository=kh-contrib-snapshots-repo::https://know-how.nexus/repository/maven-snapshots
    when:
      branch:
        include:
          - "dev"
          - "prerelease/*"
          - "*.*.x"

  # --------------------------------------------------------------------------
  # Step 2: Publish Release JAR
  # --------------------------------------------------------------------------
  # Deploys release artifacts to Nexus for tagged versions
  # --------------------------------------------------------------------------
  - name: publish-release-jar
    image: cicdtools/pipeline-runner
    pull: never
    volumes:
      - name: maven-cache
        path: /root/.m2
    environment:
      NEXUS_DEPLOYER_USERNAME:
        from_secret: NEXUS_DEPLOYER_USERNAME
      NEXUS_DEPLOYER_PASSWORD:
        from_secret: NEXUS_DEPLOYER_PASSWORD
    commands:
      - mvn deploy -Dstyle.color=always -DskipTests -Dmaven.test.skip=true -Dmaven.javadoc.skip=true -Dcheckstyle.skip=true -s ../maven-settings.xml -Ddeployer.username=$NEXUS_DEPLOYER_USERNAME -Ddeployer.password=$NEXUS_DEPLOYER_PASSWORD -DaltDeploymentRepository=kh-contrib-releases-repo::https://know-how.nexus/repository/maven-releases
    when:
      ref:
        - "refs/tags/*"

  # --------------------------------------------------------------------------
  # Step 3: Create GitHub Release
  # --------------------------------------------------------------------------
  # Generates GitHub release with changelog using release-it
  # Only runs for tagged versions
  # --------------------------------------------------------------------------
  - name: create-github-release
    depends_on:
      - publish-release-jar
    image: cicdtools/pipeline-runner
    pull: never
    volumes:
      - name: maven-cache
        path: /root/.m2
      - name: npm-cache
        path: /root/.npm
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_API_ACCESS_TOKEN
    commands:
      - git checkout -b release
      - pnpm install && git config --unset core.hooksPath
      - wget -O ./.release-it.json https://raw.githubusercontent.com/KnowHowDevOps/homelab-operations-pipeline/dev/resources/release-it/release.json
      - git fetch --tags
      - release-it --ci --no-increment -VV
      - git status
    when:
      ref:
        - "refs/tags/*"

  # --------------------------------------------------------------------------
  # Step 4: Slack Notification
  # --------------------------------------------------------------------------
  # Notifies team of artifact publication success/failure
  # --------------------------------------------------------------------------
  - name: notify-slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: dev
      template: >
        {{#success build.status}}
         :large_green_circle: :package: *${DRONE_COMMIT_MESSAGE}*
         {{build.link}} ({{build.branch}}) by {{build.author}}
        {{else}}
         :red_circle: :package: {{build.link}} ({{build.branch}}) by {{build.author}}
        {{/success}}
    when:
      status:
        - failure
        - success
    depends_on:
      - publish-snapshot-jar
      - publish-release-jar

---
# ============================================================================
# Pipeline 3: PublishDockerImage
# ============================================================================
# Builds and publishes Docker images for all microservices
# Triggers: Push to feature/* branches and tags
# Services: user-service, gateway-service, bookstore-service
# Image naming: know-how.download/{owner}/{repo}/{service}:{tag}
# ============================================================================
kind: pipeline
name: PublishDockerImage
type: docker

trigger:
  event:
    - push
    - tag
  ref:
    include:
      - refs/heads/feature/* # Feature branch images for testing
      - refs/tags/* # Release images for staging/production

depends_on:
  - PublishArtifacts # Ensures artifacts are published first

volumes:
  - name: maven-cache
    host:
      path: /app/.m2
  - name: pnpm-store
    host:
      path: /app/.pnpm-store

steps:
  # --------------------------------------------------------------------------
  # Step 1: Package JAR Files
  # --------------------------------------------------------------------------
  # Builds JAR files for all services and downloads Dockerfile template
  # --------------------------------------------------------------------------
  - name: package-jar
    image: cicdtools/pipeline-runner
    pull: never
    volumes:
      - name: maven-cache
        path: /root/.m2
    environment:
      NEXUS_DEPLOYER_USERNAME:
        from_secret: NEXUS_DEPLOYER_USERNAME
      NEXUS_DEPLOYER_PASSWORD:
        from_secret: NEXUS_DEPLOYER_PASSWORD
    commands:
      - wget -O ./Dockerfile https://raw.githubusercontent.com/KnowHowDevOps/homelab-operations-pipeline/dev/resources/JDK.dockerfile
      - mvn package -Dstyle.color=always -DskipTests -Dmaven.test.skip=true -Dmaven.javadoc.skip=true -Dcheckstyle.skip=true --batch-mode -s ../maven-settings.xml -Ddeployer.username=$NEXUS_DEPLOYER_USERNAME -Ddeployer.password=$NEXUS_DEPLOYER_PASSWORD

  # ==========================================================================
  # Feature Branch Docker Builds
  # ==========================================================================
  # Builds images for feature branches with branch name as tag
  # Sequential build order: user-service → gateway-service → bookstore-service
  # ==========================================================================

  # --------------------------------------------------------------------------
  # User Service (Feature)
  # --------------------------------------------------------------------------
  - name: build-container-with-feature-for-iqscaffold-user-service
    depends_on:
      - package-jar
    image: plugins/docker
    settings:
      dockerfile: ./Dockerfile
      context: ./iqscaffold-user-service/
      storage_driver: vfs
      username:
        from_secret: SVC_CONTAINER_REGISTRY_USERNAME
      password:
        from_secret: SVC_CONTAINER_REGISTRY_PASSWORD
      repo: know-how.download/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}/iqscaffold-user-service
      registry: know-how.download
      force_tag: true
      build_args:
        - BASE_IMAGE=know-how.download/library/jre-runner
        - VCS_REFERENCE=${DRONE_COMMIT}
      tags:
        - ${DRONE_BRANCH:8} # Strips 'feature/' prefix
    when:
      branch:
        include:
          - "feature/*"

  # --------------------------------------------------------------------------
  # Gateway Service (Feature)
  # --------------------------------------------------------------------------
  - name: build-container-with-feature-for-iqscaffold-gateway-service
    depends_on:
      - build-container-with-feature-for-iqscaffold-user-service
    image: plugins/docker
    settings:
      dockerfile: ./Dockerfile
      context: ./iqscaffold-gateway-service/
      storage_driver: vfs
      username:
        from_secret: SVC_CONTAINER_REGISTRY_USERNAME
      password:
        from_secret: SVC_CONTAINER_REGISTRY_PASSWORD
      repo: know-how.download/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}/iqscaffold-gateway-service
      registry: know-how.download
      force_tag: true
      build_args:
        - BASE_IMAGE=know-how.download/library/jre-runner
        - VCS_REFERENCE=${DRONE_COMMIT}
      tags:
        - ${DRONE_BRANCH:8}
    when:
      branch:
        include:
          - "feature/*"

  # --------------------------------------------------------------------------
  # Bookstore Service (Feature)
  # --------------------------------------------------------------------------
  - name: build-container-with-feature-for-iqscaffold-bookstore-service
    depends_on:
      - build-container-with-feature-for-iqscaffold-gateway-service
    image: plugins/docker
    settings:
      dockerfile: ./Dockerfile
      context: ./iqscaffold-bookstore-service/
      storage_driver: vfs
      username:
        from_secret: SVC_CONTAINER_REGISTRY_USERNAME
      password:
        from_secret: SVC_CONTAINER_REGISTRY_PASSWORD
      repo: know-how.download/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}/iqscaffold-bookstore-service
      registry: know-how.download
      force_tag: true
      build_args:
        - BASE_IMAGE=know-how.download/library/jre-runner
        - VCS_REFERENCE=${DRONE_COMMIT}
      tags:
        - ${DRONE_BRANCH:8}
    when:
      branch:
        include:
          - "feature/*"

  # ==========================================================================
  # Release Docker Builds
  # ==========================================================================
  # Builds images for tagged releases with version tag
  # Sequential build order: user-service → gateway-service → bookstore-service
  # ==========================================================================

  # --------------------------------------------------------------------------
  # User Service (Release)
  # --------------------------------------------------------------------------
  - name: build-container-release-iqscaffold-user-service
    depends_on:
      - package-jar
    image: plugins/docker
    settings:
      dockerfile: ./Dockerfile
      context: ./iqscaffold-user-service/
      storage_driver: vfs
      username:
        from_secret: SVC_CONTAINER_REGISTRY_USERNAME
      password:
        from_secret: SVC_CONTAINER_REGISTRY_PASSWORD
      repo: know-how.download/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}/iqscaffold-user-service
      registry: know-how.download
      force_tag: true
      build_args:
        - BASE_IMAGE=know-how.download/library/jre-runner
        - VCS_REFERENCE=${DRONE_COMMIT}
      tags:
        - ${DRONE_TAG} # Version tag (e.g., 1.0.0)
    when:
      ref:
        - "refs/tags/*"

  # --------------------------------------------------------------------------
  # Gateway Service (Release)
  # --------------------------------------------------------------------------
  - name: build-container-release-iqscaffold-gateway-service
    depends_on:
      - build-container-release-iqscaffold-user-service
    image: plugins/docker
    settings:
      dockerfile: ./Dockerfile
      context: ./iqscaffold-gateway-service/
      storage_driver: vfs
      username:
        from_secret: SVC_CONTAINER_REGISTRY_USERNAME
      password:
        from_secret: SVC_CONTAINER_REGISTRY_PASSWORD
      repo: know-how.download/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}/iqscaffold-gateway-service
      registry: know-how.download
      force_tag: true
      build_args:
        - BASE_IMAGE=know-how.download/library/jre-runner
        - VCS_REFERENCE=${DRONE_COMMIT}
      tags:
        - ${DRONE_TAG}
    when:
      ref:
        - "refs/tags/*"

  # --------------------------------------------------------------------------
  # Bookstore Service (Release)
  # --------------------------------------------------------------------------
  - name: build-container-release-iqscaffold-bookstore-service
    depends_on:
      - build-container-release-iqscaffold-gateway-service
    image: plugins/docker
    settings:
      dockerfile: ./Dockerfile
      context: ./iqscaffold-bookstore-service/
      storage_driver: vfs
      username:
        from_secret: SVC_CONTAINER_REGISTRY_USERNAME
      password:
        from_secret: SVC_CONTAINER_REGISTRY_PASSWORD
      repo: know-how.download/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}/iqscaffold-bookstore-service
      registry: know-how.download
      force_tag: true
      build_args:
        - BASE_IMAGE=know-how.download/library/jre-runner
        - VCS_REFERENCE=${DRONE_COMMIT}
      tags:
        - ${DRONE_TAG}
    when:
      ref:
        - "refs/tags/*"

---
# ============================================================================
# Pipeline 4: PromoteFeatureDeployment
# ============================================================================
# Deploys feature branches to test environment
# Trigger: Manual promotion event with target=test
# Deployment: Helm-based with atomic rollback on failure
# ============================================================================
kind: pipeline
name: PromoteFeatureDeployment
type: docker
trigger:
  event:
    - promote # Manual trigger only
  target:
    - test # Test environment
  ref:
    - "refs/heads/feature/*"

steps:
  # --------------------------------------------------------------------------
  # Deploy to Test Environment
  # --------------------------------------------------------------------------
  # Uses Helm for atomic deployment with automatic rollback on failure
  # --------------------------------------------------------------------------
  - name: deploy
    image: cicdtools/pipeline-runner
    pull: never
    environment:
      HELM_CHARTS_REPOSITORY:
        from_secret: HELM_CHARTS_REPOSITORY
    commands:
      - git clone ${HELM_CHARTS_REPOSITORY} charts && cd charts/IQKV/${DRONE_REPO_NAME}
      - kubectl version --output=yaml
      - helm upgrade --install --atomic --wait --timeout 2m ${DRONE_REPO_NAME} ./ --values ./values.yaml --values ./${DRONE_DEPLOY_TO}-values.yaml --set image.tag=${DRONE_BRANCH:8} -n iqscaffold-${DRONE_DEPLOY_TO}-env

  # --------------------------------------------------------------------------
  # Slack Notification
  # --------------------------------------------------------------------------
  - name: notify-slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: dev
      template: >
        {{#success build.status}}
         :large_green_circle: :ship: *${DRONE_COMMIT_MESSAGE}*
         {{build.link}} ({{build.branch}}) by {{build.author}}
        {{else}}
         :red_circle: :anchor: {{build.link}} ({{build.branch}}) by {{build.author}}
        {{/success}}
    when:
      status:
        - failure
        - success
    depends_on:
      - deploy

---
# ============================================================================
# Pipeline 5: RollbackFeatureDeployment
# ============================================================================
# Rolls back feature branch deployment from test environment
# Trigger: Manual rollback event with target=test
# ============================================================================
kind: pipeline
name: RollbackFeatureDeployment
type: docker
trigger:
  event:
    - rollback # Manual trigger only
  target:
    - test
  ref:
    - "refs/heads/feature/*"

steps:
  - name: rollback
    image: cicdtools/pipeline-runner
    pull: never
    environment:
      HELM_CHARTS_REPOSITORY:
        from_secret: HELM_CHARTS_REPOSITORY
    commands:
      - git clone ${HELM_CHARTS_REPOSITORY} charts && cd charts/IQKV/${DRONE_REPO_NAME}
      - helm uninstall --wait --timeout 2m ${DRONE_REPO_NAME} -n iqscaffold-${DRONE_DEPLOY_TO}-env

---
# ============================================================================
# Pipeline 6: PromoteDeployment
# ============================================================================
# Deploys tagged releases to staging or production environments
# Trigger: Manual promotion event with target=staging|production
# Deployment: Helm-based with atomic rollback on failure
# ============================================================================
kind: pipeline
name: PromoteDeployment
type: docker
trigger:
  event:
    - promote # Manual trigger only
  target:
    - staging # Staging environment
    - production # Production environment
  ref:
    - "refs/tags/*" # Only tagged releases

steps:
  # --------------------------------------------------------------------------
  # Deploy to Staging/Production
  # --------------------------------------------------------------------------
  # Uses Helm for atomic deployment with automatic rollback on failure
  # Image tag is the version tag (e.g., 1.0.0)
  # --------------------------------------------------------------------------
  - name: deploy
    image: cicdtools/pipeline-runner
    pull: never
    environment:
      HELM_CHARTS_REPOSITORY:
        from_secret: HELM_CHARTS_REPOSITORY
    commands:
      - git clone ${HELM_CHARTS_REPOSITORY} charts && cd charts/IQKV/${DRONE_REPO_NAME}
      - kubectl version --output=yaml
      - helm upgrade --install --atomic --wait --timeout 2m ${DRONE_REPO_NAME} ./ --values ./values.yaml --values ./${DRONE_DEPLOY_TO}-values.yaml --set image.tag=${DRONE_TAG} -n iqscaffold-${DRONE_DEPLOY_TO}-env

  # --------------------------------------------------------------------------
  # Slack Notification
  # --------------------------------------------------------------------------
  - name: notify-slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: dev
      template: >
        {{#success build.status}}
         :large_green_circle: :ship: *${DRONE_COMMIT_MESSAGE}*
         {{build.link}} ({{build.branch}}) by {{build.author}}
        {{else}}
         :red_circle: :anchor: {{build.link}} ({{build.branch}}) by {{build.author}}
        {{/success}}
    when:
      status:
        - failure
        - success
    depends_on:
      - deploy

---
# ============================================================================
# Pipeline 7: RollbackDeployment
# ============================================================================
# Rolls back release deployment from staging or production
# Trigger: Manual rollback event with target=staging|production
# ============================================================================
kind: pipeline
name: RollbackDeployment
type: docker
trigger:
  event:
    - rollback # Manual trigger only
  target:
    - staging
    - production
  ref:
    - "refs/tags/*"

steps:
  - name: rollback
    image: cicdtools/pipeline-runner
    pull: never
    environment:
      HELM_CHARTS_REPOSITORY:
        from_secret: HELM_CHARTS_REPOSITORY
    commands:
      - git clone ${HELM_CHARTS_REPOSITORY} charts && cd charts/IQKV/${DRONE_REPO_NAME}
      - helm uninstall --wait --timeout 2m ${DRONE_REPO_NAME} -n iqscaffold-${DRONE_DEPLOY_TO}-env

---
# ============================================================================
# Pipeline 8: ReleasePackage
# ============================================================================
# Automates version management and release creation
# Trigger: Manual promotion event with target=release
# Process:
#   1. Extracts version from package.json
#   2. Updates Maven POMs to release version
#   3. Creates and pushes version tag
#   4. Bumps to next SNAPSHOT version
#   5. Generates changelog and commits
# ============================================================================
kind: pipeline
name: ReleasePackage
type: docker
trigger:
  event:
    - promote # Manual trigger only
  target:
    - release
  branch:
    - "dev" # Main development branch
    - "*.*.x" # Maintenance branches

volumes:
  - name: maven-cache
    host:
      path: /app/.m2
  - name: pnpm-store
    host:
      path: /app/.pnpm-store

steps:
  # --------------------------------------------------------------------------
  # Create Release Tag and Bump Version
  # --------------------------------------------------------------------------
  # Automated release workflow:
  #   1. Remove SNAPSHOT from version
  #   2. Create and push release tag
  #   3. Bump to next SNAPSHOT version
  #   4. Generate changelog with release-it
  #   5. Commit and push changes
  # --------------------------------------------------------------------------
  - name: create-release-tag
    failure: ignore # Continue even if release already exists
    image: cicdtools/pipeline-runner
    pull: never
    volumes:
      - name: maven-cache
        path: /root/.m2
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_API_ACCESS_TOKEN
    commands:
      # Extract and prepare version numbers
      - export RELEASE_VERSION=$(jq -r .version package.json | cut -d '-' -f 1)
      - export INCREMENT_COMMAND="increment_version -m ${RELEASE_VERSION}"
      - export SNAPSHOT_VERSION=$(${INCREMENT_COMMAND})
      - echo Prepare new version ${RELEASE_VERSION}
      - export NEXT_SNAPSHOT=${SNAPSHOT_VERSION}-SNAPSHOT

      # Configure Git identity
      - export GIT_AUTHOR_NAME="${SVC_BUILD_GIT_USERNAME}"
      - export GIT_AUTHOR_EMAIL="${SVC_BUILD_GIT_EMAIL}"
      - export GIT_COMMITTER_NAME="${SVC_BUILD_GIT_USERNAME}"
      - export GIT_COMMITTER_EMAIL=${SVC_BUILD_GIT_EMAIL}
      - git remote set-url --push origin ${DRONE_GIT_SSH_URL}

      # Create release version and tag
      - git checkout -b v${RELEASE_VERSION}
      - mvn versions:set -DremoveSnapshot
      - mvn versions:set -DnewVersion=${RELEASE_VERSION}
      - mvn versions:update-parent
      - >-
        git commit -a -m "chore: bump v${RELEASE_VERSION}"
      - git tag ${RELEASE_VERSION} && git push origin ${RELEASE_VERSION}
      - echo "✅ Release tag ${RELEASE_VERSION} was created."
      - sleep 10

      # Cleanup and prepare next SNAPSHOT version
      - git tag -d ${RELEASE_VERSION} && git checkout ${DRONE_COMMIT_BRANCH} && git branch -D v${RELEASE_VERSION}
      - mvn versions:set -DnewVersion=${NEXT_SNAPSHOT}
      - mvn versions:update-parent -DallowSnapshots=true

      # Generate changelog and commit
      - pnpm install && git config --unset core.hooksPath
      - wget -O ./.release-it.json https://raw.githubusercontent.com/KnowHowDevOps/homelab-operations-pipeline/dev/resources/release-it/changelog.json
      - git fetch --tags
      - release-it --ci --no-increment -VV
      - npm version ${SNAPSHOT_VERSION} --no-git-tag-version
      - >-
        git commit -a -m "chore: create new ${NEXT_SNAPSHOT}"
      - git push origin ${DRONE_COMMIT_BRANCH}
      - echo "✅ Started ${NEXT_SNAPSHOT}."
      - echo "🚀 Good job, new version ${RELEASE_VERSION} was released successfully."
