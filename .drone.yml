---
kind: pipeline
name: ReleasePackage
type: docker
trigger:
  event:
    - promote
  target:
    - release
  branch:
    - "dev"
    - "*.*.x"

volumes:
  - name: maven-cache
    host:
      path: /app/.m2
  - name: pnpm-store
    host:
      path: /app/.pnpm-store

steps:
  - name: create-release-tag
    failure: ignore
    image: cicdtools/pipeline-runner
    pull: never
    volumes:
      - name: maven-cache
        path: /root/.m2
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_API_ACCESS_TOKEN
    commands:
      - export RELEASE_VERSION=$(jq -r .version package.json | cut -d '-' -f 1)
      - export INCREMENT_COMMAND="increment_version -m $${RELEASE_VERSION}"
      - export SNAPSHOT_VERSION=$($${INCREMENT_COMMAND})
      - echo Prepare new version $${RELEASE_VERSION}
      - export NEXT_SNAPSHOT=$${SNAPSHOT_VERSION}-SNAPSHOT
      - export GIT_AUTHOR_NAME="$${SVC_BUILD_GIT_USERNAME}"
      - export GIT_AUTHOR_EMAIL="$${SVC_BUILD_GIT_EMAIL}"
      - export GIT_COMMITTER_NAME="$${SVC_BUILD_GIT_USERNAME}"
      - export GIT_COMMITTER_EMAIL=$${SVC_BUILD_GIT_EMAIL}
      - git remote set-url --push origin ${DRONE_GIT_SSH_URL}
      - git checkout -b v$${RELEASE_VERSION}
      - mvn versions:set -DremoveSnapshot
      - mvn versions:set -DnewVersion=$${RELEASE_VERSION}
      - mvn versions:update-parent
      - >-
        git commit -a -m "chore: bump v$${RELEASE_VERSION}"
      - git tag $${RELEASE_VERSION} && git push origin $${RELEASE_VERSION}
      - echo "✅ Release tag $${RELEASE_VERSION} was created."
      - sleep 10
      - git tag -d $${RELEASE_VERSION} && git checkout ${DRONE_COMMIT_BRANCH} && git branch -D v$${RELEASE_VERSION}
      - mvn versions:set -DnewVersion=$${NEXT_SNAPSHOT}
      - mvn versions:update-parent -DallowSnapshots=true
      - pnpm install && git config --unset core.hooksPath
      - wget -O ./.release-it.json https://raw.githubusercontent.com/KnowHowDevOps/homelab-operations-pipeline/dev/resources/release-it/changelog.json
      - git fetch --tags
      - release-it --ci --no-increment -VV
      - npm version $${SNAPSHOT_VERSION} --no-git-tag-version
      - >-
        git commit -a -m "chore: create new $${NEXT_SNAPSHOT}"
      - git push origin ${DRONE_COMMIT_BRANCH}
      - echo "✅ Started $${NEXT_SNAPSHOT}."
      - echo "🚀 Good job, new version $${RELEASE_VERSION} was released successfully."
